function wireTabEvents() {
  const schnellBtn = document.getElementById('schnellBtn');
  if (schnellBtn) schnellBtn.addEventListener('click', openSchnellanlage);
  const addBtn = document.getElementById('addProjectBtn');
  if (addBtn) addBtn.addEventListener('click', () => openProjectModal(null));
  const recalcBtn = document.getElementById('recalcSollBtn');
  if (recalcBtn) recalcBtn.addEventListener('click', async () => { recalcBtn.disabled = true; recalcBtn.textContent = 'Berechne…'; await recalcAllSoll(); });
  document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openProjectModal(b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteProject(b.dataset.del)));
  const projFilterKundeSel = document.getElementById('projFilterKundeSel');
  if (projFilterKundeSel) projFilterKundeSel.addEventListener('change', () => { projFilterKunde = projFilterKundeSel.value; render(); });
  const projFilterStatusSel = document.getElementById('projFilterStatusSel');
  if (projFilterStatusSel) projFilterStatusSel.addEventListener('change', () => { projFilterStatus = projFilterStatusSel.value; render(); });
  const projFilterArtSel = document.getElementById('projFilterArtSel');
  if (projFilterArtSel) projFilterArtSel.addEventListener('change', () => { projFilterArt = projFilterArtSel.value; render(); });

// ---------- CONTRACTOR-PORTAL (externe Freelancer, siehe migration_contractor_timesheets.sql) ----------
// Läuft komplett getrennt von der internen App oben - ausschließlich über die dort angelegten
// SECURITY DEFINER-Funktionen (sb.rpc(...)), nie über direkten Tabellenzugriff, damit ein
// Contractor rein technisch gar nicht an andere Daten kommen kann.

// Prüft, ob die eingeloggte E-Mail zu einem Contractor gehört (kein interner Zugriff nötig).
async function initContractorAccess() {
  const { data: rows, error } = await sb.rpc('my_contractor_profile');
  if (error) { console.error('Contractor-Profil konnte nicht geladen werden (migration_contractor_timesheets.sql ausgeführt?)', error); return false; }
  if (!rows || !rows.length) return false;
  contractorProfile = rows[0];
  return true;
}

async function loadContractorPortal() {
  contractorMonth = monatBegrenzen(contractorMonth);
  const { data: projects, error } = await sb.rpc('my_timesheet_projects');
  if (error) console.error('Projekte des Contractors konnten nicht geladen werden', error);
  contractorProjects = projects || [];
  await loadContractorTimesheet();
}

// Lädt für JEDEN Eintrag des Contractors das Timesheet des gewählten Monats -
// seit Migration 27 ist das ein Eintrag je Projekt unter dem Placement. Im
// bisherigen Timesheet-Portal stehen alle untereinander auf einer Seite (siehe
// Siemens-Timesheet: zwei Projektzeilen je Woche, je eigene Summe).
async function loadContractorTimesheet() {
  contractorSheets = [];
  for (const proj of contractorProjects) {
    const { data: tsRows, error } = await sb.rpc('my_timesheet', {
      p_project_id: proj.project_id, p_month: contractorMonth,
      p_placement_projekt_id: proj.placement_projekt_id || null });
    if (error) { console.error('Timesheet konnte nicht geladen werden', proj.project_id, error); continue; }
    const ts = (tsRows && tsRows[0]) || null;
    if (!ts) continue;
    const { data: dayRows, error: dayErr } = await sb.rpc('my_timesheet_days', { p_timesheet_id: ts.timesheet_id });
    if (dayErr) console.error('Tageswerte konnten nicht geladen werden', dayErr);
    contractorSheets.push({ proj, ts, days: dayRows || [] });
  }
  renderContractorPortal();
}

// Wochen eines Monats als Raster Mo-So - wie im bisherigen Timesheet-Portal.
// Tage vor dem Monatsersten bzw. nach dem Monatsletzten bleiben leer.
function wochenDesMonats(monthStr) {
  const tage = daysOfMonth(monthStr);
  const [y, m] = monthStr.split('-').map(Number);
  const wochen = [];
  let woche = new Array(7).fill(null);
  tage.forEach(t => {
    const nr = Number(t.date.slice(8));
    // getUTCDay: 0 = Sonntag. Wir wollen Montag als Spalte 0.
    const spalte = (new Date(Date.UTC(y, m - 1, nr)).getUTCDay() + 6) % 7;
    woche[spalte] = { ...t, nr };
    if (spalte === 6) { wochen.push(woche); woche = new Array(7).fill(null); }
  });
  if (woche.some(Boolean)) wochen.push(woche);
  return wochen;
}

const WOCHENTAGE = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

// Welche Monate darf ein Contractor im Portal auswählen? Grundsätzlich das
// laufende Geschäftsjahr (= Kalenderjahr) bis zum aktuellen Monat. Zukünftige
// Monate ergeben für eine Zeiterfassung keinen Sinn.
// Ausnahme Januar: Dann bleibt der Dezember des Vorjahres offen, damit das alte
// Jahr noch abgeschlossen werden kann - sonst stünde man am 1. Januar vor einem
// nicht mehr erreichbaren Dezember.
function timesheetMonatsGrenzen() {
  const jetzt = new Date();
  const jahr = jetzt.getFullYear();
  const min = jetzt.getMonth() === 0 ? `${jahr - 1}-12` : `${jahr}-01`;
  return { min, max: currentMonthStr() };
}

// Hält einen Monatswert innerhalb der erlaubten Spanne. Nötig, weil man in das
// Feld auch tippen kann und der Browser min/max dabei nicht überall erzwingt.
function monatBegrenzen(monatStr) {
  const { min, max } = timesheetMonatsGrenzen();
  if (!monatStr || !/^\d{4}-\d{2}$/.test(monatStr)) return max;
  if (monatStr < min) return min;
  if (monatStr > max) return max;
  return monatStr;
}

function renderContractorPortal() {
  document.body.dataset.org = contractorProfile ? contractorProfile.org : '';
  const app = document.getElementById('app');
  const wochen = wochenDesMonats(contractorMonth);
  const [jahr, monat] = contractorMonth.split('-').map(Number);
  const letzter = new Date(Date.UTC(jahr, monat, 0)).getUTCDate();
  const mm = String(monat).padStart(2, '0');
  const zeitraum = `01.${mm}.${jahr} – ${letzter}.${mm}.${jahr}`;
  const zeit = v => v ? new Date(v).toLocaleString('de-DE', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }) : '–';
  const kopf = (label, wert) => `<div><div class="ts-label">${esc(label)}</div><div class="ts-wert">${esc(wert || '–')}</div></div>`;
  const summe = bl => bl.days.reduce((a, d) => a + (Number(d.stunden) || 0), 0);
  const gesamt = contractorSheets.reduce((a, bl) => a + summe(bl), 0);
  // Ein Timesheet je Projekt - eingereicht wird deshalb auch je Projekt.
  const offen = contractorSheets.filter(bl => bl.ts.status !== 'submitted' && bl.ts.status !== 'approved' && summe(bl) > 0);

  const projektBlock = (bl) => {
    const gesperrt = bl.ts.status === 'submitted' || bl.ts.status === 'approved';
    const tage = new Map(bl.days.map(d => [d.day, d]));
    // Bei mehreren Projekten beim selben Kunden ist die Projektnummer das, woran der
    // Freelancer sie auseinanderhält - deshalb steht sie im Titel.
    const titel = (bl.proj.placement_name || bl.proj.projektname || bl.proj.kunde)
      + (bl.proj.rate_code ? ' · ' + bl.proj.rate_code : '');
    return `
    <div class="ts-projekt">
      <div class="ts-projekt-kopf">
        <div>
          <div class="ts-projekt-titel">${esc(titel)}</div>
          <div class="ts-projekt-meta">${esc(bl.proj.kunde)}${bl.proj.po_referenz ? ' · PO ' + esc(bl.proj.po_referenz) : ''} · Nr. ${bl.ts.nummer || '–'}</div>
        </div>
        <div style="text-align:right;">
          <span class="badge ${bl.ts.status === 'approved' ? 'Aktiv' : (bl.ts.status === 'rejected' ? 'Kritisch' : 'Bevorstehend')}">${TS_STATUS_LABEL[bl.ts.status]}</span>
          <div class="ts-projekt-summe">${fmtNum(summe(bl), 2)} Std.</div>
        </div>
      </div>
      ${bl.ts.status === 'rejected' && bl.ts.review_note ? `<div class="banner error">Grund der Ablehnung: ${esc(bl.ts.review_note)}</div>` : ''}
      <div class="table-scroll">
        <table class="ts-raster">
          <thead><tr>${WOCHENTAGE.map(w => `<th>${w}</th>`).join('')}</tr></thead>
          <tbody>
            ${wochen.map(woche => `<tr>
              ${woche.map(t => !t ? '<td class="leer"></td>' : `
                <td>
                  <div class="ts-tag">${t.nr}</div>
                  <input class="ts-std" type="number" min="0" max="24" step="0.25"
                    data-sheet="${bl.ts.timesheet_id}" data-day="${t.date}"
                    value="${tage.has(t.date) && Number(tage.get(t.date).stunden) ? tage.get(t.date).stunden : ''}"
                    ${gesperrt ? 'disabled' : ''} placeholder="0">
                </td>`).join('')}
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      ${gesperrt && !(bl.ts.sonstiges || '').trim() ? '' : `
      <div class="ts-block">
        <div class="ts-label">Notizen</div>
        ${gesperrt
          ? `<div class="ts-notiz-text">${esc(bl.ts.sonstiges)}</div>`
          : `<textarea rows="4" data-sonstiges="${bl.ts.timesheet_id}"
               placeholder="Woran hast du gearbeitet? Abwesenheiten, Urlaub, Feiertage …">${esc(bl.ts.sonstiges || '')}</textarea>`}
      </div>`}
      <div class="ts-projekt-fuss no-print">
        <button class="btn primary" data-submit="${bl.ts.timesheet_id}" ${gesperrt || !summe(bl) ? 'disabled' : ''}>Einreichen</button>
        <span class="ts-projekt-status">${bl.ts.submitted_at ? 'Eingereicht ' + zeit(bl.ts.submitted_at) : ''}${bl.ts.reviewed_at ? ' · Freigegeben ' + zeit(bl.ts.reviewed_at) + (bl.ts.reviewed_by ? ' von ' + esc(bl.ts.reviewed_by) : '') : ''}</span>
      </div>
    </div>`;
  };

  app.innerHTML = `
    <header class="top no-print">
      <div class="brand-row">
        ${contractorProfile && contractorProfile.org === 'peax'
          ? `<div class="peax-wordmark">peax<span class="tag">A Konzepthaus Brand</span></div>`
          : `<div class="kh-wordmark">KONZEPT<br>HAUS</div>`}
        <div><h1>Mein Timesheet</h1></div>
      </div>
      <div class="userbar">
        <button class="btn" id="tsPrintBtn">Als PDF speichern</button>
        <button class="btn" id="logoutBtn">Abmelden</button>
      </div>
    </header>
    <div class="toolbar-filters no-print">
      <label>Monat:</label>
      <input type="month" id="tsMonthInput" value="${contractorMonth}"
        min="${timesheetMonatsGrenzen().min}" max="${timesheetMonatsGrenzen().max}">
      ${offen.length > 1 ? `<button class="btn" id="tsSubmitAll">Alle ${offen.length} einreichen</button>` : ''}
    </div>

    ${!contractorSheets.length ? '<div class="card"><div class="empty">Für dich ist noch kein Projekt hinterlegt. Bitte bei Rike melden.</div></div>' : `
    <div class="card ts-sheet">
      <div class="ts-kopf">
        ${kopf('Timesheet für', contractorProfile ? contractorProfile.name : '')}
        ${kopf('Zeitraum', zeitraum)}
        ${kopf('Projekte', String(contractorSheets.length))}
        ${kopf('Gesamtstunden', fmtNum(gesamt, 2))}
      </div>
      ${contractorSheets.map(projektBlock).join('')}
      <div class="ts-summe">Gesamtstunden alle Projekte <strong>${fmtNum(gesamt, 2)}</strong></div>
    </div>
    <footer class="hint no-print">Deine Eingaben werden automatisch gespeichert. Eingereicht wird je Projekt – das Team prüft und gibt sie frei.</footer>
    `}
  `;

  document.getElementById('logoutBtn').addEventListener('click', handleLogout);
  const printBtn = document.getElementById('tsPrintBtn');
  if (printBtn) printBtn.addEventListener('click', () => window.print());
  const monthInput = document.getElementById('tsMonthInput');
  if (monthInput) monthInput.addEventListener('change', () => {
    const gewaehlt = monatBegrenzen(monthInput.value);
    if (gewaehlt !== monthInput.value) {
      monthInput.value = gewaehlt;
      alert('Es können nur Monate des laufenden Geschäftsjahres bis zum aktuellen Monat erfasst werden.');
    }
    contractorMonth = gewaehlt;
    loadContractorTimesheet();
  });

  app.querySelectorAll('input[data-day]').forEach(inp => {
    inp.addEventListener('change', async () => {
      const val = inp.value === '' ? 0 : Number(inp.value);
      const { error } = await sb.rpc('set_timesheet_day', { p_timesheet_id: inp.dataset.sheet, p_day: inp.dataset.day, p_stunden: val });
      if (error) alert(error.message);
      await loadContractorTimesheet();
    });
  });
  app.querySelectorAll('textarea[data-sonstiges]').forEach(ta => {
    ta.addEventListener('change', async () => {
      const { error } = await sb.rpc('set_timesheet_sonstiges', { p_timesheet_id: ta.dataset.sonstiges, p_text: ta.value });
      if (error) alert(error.message);
    });
  });

  const einreichen = async (id) => {
    const { error } = await sb.rpc('submit_timesheet', { p_timesheet_id: id });
    if (error) { alert(error.message); return false; }
    return true;
  };
  app.querySelectorAll('[data-submit]').forEach(b => b.addEventListener('click', async () => {
    if (await einreichen(b.dataset.submit)) await loadContractorTimesheet();
  }));
  const alleBtn = document.getElementById('tsSubmitAll');
  if (alleBtn) alleBtn.addEventListener('click', async () => {
    for (const bl of offen) await einreichen(bl.ts.timesheet_id);
    await loadContractorTimesheet();
  });
}

function subscribeContractorRealtime() {
  if (realtimeChannel) return;
  realtimeChannel = sb.channel('public:contractor-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'timesheets' }, () => loadContractorTimesheet())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'timesheet_days' }, () => loadContractorTimesheet())
    .subscribe();
}

// ---------- BOOTSTRAP ----------

async function startApp() {
  document.getElementById('app').innerHTML = '<div class="empty">Lade…</div>';
  await initOrgAccess();
  if (!allowedOrgs.length) {
    const isContractor = await initContractorAccess();
    if (isContractor) { subscribeContractorRealtime(); await loadContractorPortal(); return; }
    renderNoAccess();
    return;
  }
  subscribeRealtime();
  await loadAll();
}

sb.auth.onAuthStateChange((event, newSession) => {
  session = newSession;
  if (session) {
    renderAuth(); // clears any stale auth screen instantly, then app takes over
    startApp();
  } else {
    if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
    allowedOrgs = []; activeOrg = null;
    contractorProfile = null; contractorProjects = []; contractorSheets = [];
    renderAuth();
  }
});

sb.auth.getSession().then(({ data: { session: s } }) => {
  session = s;
  if (session) startApp();
  else renderAuth();
});
