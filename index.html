<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projektliste – Freelancer Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    /* Zurückhaltende Grundpalette, angelehnt an das Projektcontrolling-Tool:
       weiße Flächen, fast schwarzer Text, wenige Grautöne, 4px Radius, kaum
       Schatten. Farbe kommt fast ausschließlich aus der Marke (siehe unten). */
    --bg: #ffffff; --card: #ffffff; --surface: #f6f6f6;
    --border: #eaeaea; --border-strong: #dcdcdc;
    --text: #1a1a1a; --muted: #8a8a8a; --muted-soft: #aaaaaa;
    /* Semantik sparsam und entsättigt - nur dort, wo die Farbe eine Aussage
       trägt (Abweichung, Status). Sonst bleibt alles grau. */
    --green: #2f7d4f; --amber: #9a6b12; --red: #c0392b;
    --tint: #f4f4f4;
    /* Marke: KH = Gelb, peax = Orange/Rot (wie auf den Rechnungsvorlagen).
       --accent-bar ist der reine Markenton für Flächen/Balken,
       --accent-ink die textlesbare Variante - reines Gelb wäre auf Weiß
       unlesbar, deshalb bei KH ein dunkleres Gold als Ink. */
    --accent-bar: #FFEC14; --accent-ink: #8a6b06; --accent-bg: #fffbe0;
  }
  body[data-org="peax"] { --accent-bar: #FF4600; --accent-ink: #FF4600; --accent-bg: #fff2ed; }
  * { box-sizing: border-box; }
  body { margin: 5px 0 0; font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: 5px; background: var(--accent-bar); z-index: 100; }
  #app { max-width: 1900px; margin: 0 auto; padding: 22px 26px 60px; }
  header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .brand-row { display: flex; align-items: center; gap: 14px; }
  .peax-wordmark { font-size: 26px; font-weight: 300; letter-spacing: -.5px; color: var(--text); line-height: 1; }
  .peax-wordmark .tag { display: block; font-size: 9px; font-weight: 700; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  .kh-wordmark { font-size: 17px; font-weight: 800; letter-spacing: .02em; color: var(--text); line-height: 1.05; padding-left: 10px; border-left: 5px solid var(--accent-bar); }
  h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .userbar { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  nav.tabs { display: flex; gap: 4px; margin-bottom: 22px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  nav.tabs button { background: none; border: none; padding: 9px 14px; font-size: 14px; font-weight: 500; color: var(--muted-soft); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; border-radius: 4px 4px 0 0; }
  nav.tabs button.active { color: var(--text); font-weight: 600; border-bottom-color: var(--accent-bar); }
  nav.tabs button:hover { color: var(--text); background: var(--surface); }
  /* Gruppen mit Klappmenü: der Wrapper muss position:relative sein, damit das
     Menü darunter ausgerichtet wird und nicht am Seitenrand klebt. */
  .navgroup { position: relative; display: inline-flex; }
  .navgroup > button .caret { font-size: 10px; margin-left: 5px; opacity: .55; }
  .navgroup > button .sub { font-weight: 400; opacity: .75; }
  .navmenu { position: absolute; top: 100%; left: 0; z-index: 50; margin-top: 2px;
    background: var(--card); border: 1px solid var(--border); border-radius: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,.05), 0 16px 36px -12px rgba(0,0,0,.18); padding: 4px; min-width: 190px;
    display: flex; flex-direction: column; }
  .navmenu button { padding: 9px 12px; text-align: left; border-bottom: none; margin-bottom: 0;
    border-radius: 4px; white-space: nowrap; font-weight: 500; color: var(--text); }
  .navmenu button:hover { background: var(--surface); }
  .navmenu button.active { background: var(--surface); color: var(--text); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 16px 18px; }
  .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 22px; }
  @media (max-width: 900px) { .grid-kpi { grid-template-columns: repeat(2, 1fr); } }
  /* Kennzahlen bewusst einheitlich statt bunt - die Zahl trägt die Information,
     nicht die Kachelfarbe. Die Farbvarianten bleiben als Klassen bestehen,
     damit das Markup unverändert bleibt, sehen aber alle gleich aus. */
  .kpi { border-radius: 4px; padding: 15px 16px; border: 1px solid var(--border); background: var(--card); }
  .kpi .label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .kpi .value { font-size: 26px; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; color: var(--text); }
  .kpi .hint { font-size: 11.5px; color: var(--muted-soft); margin-top: 3px; }
  .kpi.blue, .kpi.teal, .kpi.purple, .kpi.amber { background: var(--card); }
  .kpi.blue .value, .kpi.teal .value, .kpi.purple .value, .kpi.amber .value { color: var(--text); }
  section.panel { margin-bottom: 24px; }
  section.panel h2 { font-size: 15px; margin: 0 0 12px; font-weight: 700; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; border-bottom-color: var(--border-strong); }
  tbody tr:hover { background: var(--surface); }
  table.projekte-table { font-size: 12.5px; }
  table.projekte-table th, table.projekte-table td { padding: 8px 8px; }
  table.projekte-table th:last-child, table.projekte-table td:last-child {
    position: sticky; right: 0; background: var(--card); box-shadow: -6px 0 6px -6px rgba(0,0,0,.08);
  }
  table.projekte-table tbody tr:hover td:last-child { background: var(--surface); }
  tr.inactive { opacity: .4; }
  /* Statuskennzeichen: neutrale Fläche, die Farbe steckt nur in der Schrift und
     nur dort, wo sie etwas bedeutet. */
  .badge { display: inline-block; padding: 3px 9px; border-radius: 4px; font-size: 11.5px; font-weight: 600; background: var(--tint); color: #555; }
  .badge.Gut { color: var(--green); }
  .badge.Achtung { color: var(--amber); }
  .badge.Kritisch { color: var(--red); }
  .badge.Aktiv { color: var(--green); }
  .badge.Pausiert { color: var(--amber); }
  .badge.Beendet { color: #999; }
  .badge.Bevorstehend { color: #555; }
  .badge.Perm { color: #555; }
  .badge.Contract { color: #555; }
  .mini-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; margin-left: 6px; vertical-align: middle; background: var(--tint); color: #666; }
  .mini-badge.auto { color: var(--green); }
  .mini-badge.manuell { color: var(--amber); }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar-filters { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: nowrap; }
  .toolbar-filters > * { flex: 0 0 auto; }
  .toolbar-filters label { white-space: nowrap; }
  .toolbar-filters select { padding: 7px 6px; }
  .toolbar-filters input[type=month] { padding: 7px 6px; }
  select, input[type=text], input[type=number], input[type=date], input[type=month], input[type=email], input[type=password], textarea {
    font-size: 13px; padding: 8px 9px; border: 1px solid var(--border-strong); border-radius: 4px; background: #fff; color: var(--text); font-family: inherit;
  }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent-ink); }
  input.num-cell { width: 90px; padding: 5px 7px; }
  button.btn { font-size: 13px; font-weight: 500; padding: 8px 16px; border-radius: 4px; border: 1px solid transparent; background: var(--surface); cursor: pointer; color: var(--text); font-family: inherit; }
  button.btn:hover { background: #ededed; }
  button.btn:disabled { opacity: .4; cursor: not-allowed; }
  button.btn:disabled:hover { filter: none; background: var(--surface); }
  button.btn.primary:disabled:hover { background: var(--accent-ink); }
  button.btn.primary { background: var(--accent-ink); color: #fff; border-color: var(--accent-ink); font-weight: 600; }
  button.btn.primary:hover { filter: brightness(.92); }
  button.btn.danger { color: var(--red); background: var(--card); border-color: var(--border-strong); }
  button.btn.danger:hover { background: #fdf3f2; }
  button.link { background: none; border: none; color: var(--accent-ink); font-size: 12.5px; cursor: pointer; padding: 2px 4px; font-weight: 600; font-family: inherit; }
  button.link:hover { text-decoration: underline; }
  button.link.danger { color: var(--red); }
  .chart-wrap { position: relative; height: 280px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.28); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-radius: 4px; padding: 22px 24px; width: 460px; max-width: 92vw; max-height: 88vh; overflow: auto;
    box-shadow: 0 2px 6px rgba(0,0,0,.05), 0 16px 36px -12px rgba(0,0,0,.25); }
  .modal h3 { margin: 0 0 16px; font-size: 16px; font-weight: 700; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
  .field input, .field select { width: 100%; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .empty { color: var(--muted-soft); font-size: 13px; padding: 18px 0; text-align: center; }
  footer.hint { text-align: center; color: var(--muted-soft); font-size: 11.5px; margin-top: 24px; }
  .auth-wrap { max-width: 380px; margin: 90px auto; }
  .auth-wrap h1 { text-align: center; margin-bottom: 4px; }
  .auth-wrap p.sub { text-align: center; margin-bottom: 22px; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .auth-tabs button { flex: 1; }
  .banner { padding: 11px 14px; border-radius: 4px; font-size: 13px; margin-bottom: 14px; background: var(--surface); color: var(--text); }
  .banner.error { background: #fdf3f2; color: var(--red); }
  .banner.info { background: var(--accent-bg); color: var(--text); }
  /* ---------- Contractor-Timesheet ---------- */
  .ts-sheet { max-width: 900px; }
  .ts-kopf { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 20px;
    padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .ts-label { font-size: 10.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .ts-wert { font-size: 13.5px; margin-top: 2px; }
  table.ts-raster { table-layout: fixed; }
  table.ts-raster th { text-align: center; font-size: 10.5px; padding: 6px 4px; }
  table.ts-raster td { text-align: center; padding: 6px 4px; vertical-align: top; height: 62px; }
  table.ts-raster td.leer { background: #fbfbfb; }
  .ts-tag { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  input.ts-std { width: 100%; max-width: 74px; text-align: center; padding: 5px 4px; font-size: 13px; }
  .ts-projekt { border-top: 1px solid var(--border-strong); padding-top: 18px; margin-top: 22px; }
  .ts-projekt:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .ts-projekt-kopf { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 12px; }
  .ts-projekt-titel { font-size: 15px; font-weight: 700; }
  .ts-projekt-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .ts-projekt-summe { font-size: 17px; font-weight: 700; margin-top: 6px; white-space: nowrap; }
  .ts-projekt-fuss { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .ts-projekt-status { font-size: 11.5px; color: var(--muted); }
  .ts-notiz-text { font-size: 12.5px; line-height: 1.5; padding-top: 6px; white-space: pre-line; }
  .ts-summe { text-align: right; font-size: 14px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-strong); }
  .ts-summe strong { font-size: 18px; margin-left: 8px; }
  .ts-block { margin-top: 22px; }
  .ts-block textarea { width: 100%; }
  .ts-notiz { display: grid; grid-template-columns: 130px 1fr; gap: 12px; align-items: start; margin-top: 8px; }
  .ts-notiz-tag { font-size: 12.5px; font-weight: 600; padding-top: 7px; }
  .ts-notiz-tag span { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
  @media (max-width: 620px) { .ts-notiz { grid-template-columns: 1fr; } .ts-notiz-tag { padding-top: 0; } }

  @media print {
    header.top, nav.tabs, footer.hint, .no-print { display: none !important; }
    body { background: #fff; }
    body::before { display: none; }
    #app { max-width: none; padding: 0; }
    .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
    /* Timesheet als Dokument: Eingabefelder sollen wie gedruckter Text aussehen,
       nicht wie Formularkästen. */
    .ts-sheet { max-width: none; border: none; padding: 0; }
    .ts-sheet input, .ts-sheet textarea { border: none !important; padding: 0 !important; background: none !important;
      resize: none; font-size: 12px; color: #000; }
    .ts-sheet textarea { height: auto; min-height: 0; overflow: visible; }
    table.ts-raster td { height: auto; border: 1px solid #ddd; }
    table.ts-raster td.leer { background: #f7f7f7; }
    .ts-notiz { break-inside: avoid; }
    .ts-projekt { break-inside: avoid; }
    .toolbar-filters { display: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>

<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<!-- SheetJS (für den Kunden-Report als echte .xlsx-Datei) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
/* ============================================================
   Supabase-Zugangsdaten
   ============================================================ */
const SUPABASE_URL = 'https://uevefmvbpznvuvhvkdwl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVldmVmbXZicHpudnV2aHZrZHdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMjUzMTYsImV4cCI6MjEwMDgwMTMxNn0.ewGSI6UcXpInCL1z9VTqcqsGxBPd5Aqt4YUMulrml5E';
/* ============================================================ */
// Basis-URL des Weclapp-Webapp (nicht die API) – nur für Direktlinks zu Rechnungen im
// Tab "Eingangsrechnungen", kein Geheimnis (öffentlich sichtbare Web-Oberflächen-URL, kein API-Key).
const WECLAPP_WEB_URL = 'https://konzepthaus.weclapp.com';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MONTH_NAMES = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MONTH_NAMES_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// Personalisierter Einladungslink für Contractors (?invite=<email> in der URL, siehe
// "Link kopieren" bei den Contractors im Tab "Timesheets") - öffnet die Registrierung
// direkt mit vorausgefüllter E-Mail, damit Rike Contractors nicht einzeln anschreiben muss.
const inviteEmail = new URLSearchParams(location.search).get('invite') || '';

let session = null;
let authMode = inviteEmail ? 'signup' : 'login'; // 'login' | 'signup'
let authError = '';
let authInfo = '';
let authBusy = false;

let data = { projects: [], allProjects: [], entries: [], consultants: [], ki_vorschlaege: [], team_memberships: [], contractors: [], contractorProjects: [], timesheets: [], timesheetDays: [], candidates: [], placements: [], placementProjekte: [], kunden: [], abrechnungen: [] };
// Contractor-Portal (externe Freelancer, die NUR ihr eigenes Timesheet sehen - siehe
// migration_contractor_timesheets.sql). Komplett getrennt vom internen App-Zustand oben.
let contractorProfile = null;
let contractorProjects = [];
let contractorMonth = currentMonthStr(); // wird beim Öffnen zusätzlich über monatBegrenzen() geprüft // function-Deklaration ist gehoisted, daher hier schon nutzbar
let contractorSheets = []; // je Projekt: { proj, ts, days }
const TS_STATUS_LABEL = { draft: 'Entwurf', submitted: 'Eingereicht', approved: 'Freigegeben', rejected: 'Abgelehnt' };
let tsFilterStatus = 'submitted';
// Mehrfirmen-Unterstützung (KH + peax): allowedOrgs kommt aus der Tabelle user_access
// (welche Firmen darf diese E-Mail-Adresse sehen - siehe migration_multi_org.sql).
// activeOrg ist die aktuell angezeigte Firma; data.projects/entries/consultants werden
// in loadAll() darauf gefiltert. data.allProjects bleibt firmenübergreifend (alles, worauf
// die Person laut RLS Zugriff hat) - wird nur für die KI-Vorschläge-Projektauswahl gebraucht,
// weil ein Vorschlag dort wahlweise einem KH- oder peax-Projekt zugeordnet werden kann.
let allowedOrgs = [];
let istAdmin = false; // sieht diese Person den Reiter Finance? (user_access.role = 'admin')
let activeOrg = null;
const ORG_LABELS = { kh: 'KH', peax: 'peax' };
let activeTab = 'dashboard';
// Welches Klappmenü ist gerade offen (Name der Gruppe), null = keines.
let offenesMenu = null;
let bankJahr = new Date().getFullYear(); // gewähltes Jahr in der Jahresübersicht

// Aufbau der oberen Navigation. Ein Eintrag ohne "kinder" ist ein einzelner
// Reiter, einer mit "kinder" wird zu einem Klappmenü zusammengefasst.
// Ein neues Sheet hinzufügen heißt: hier eine Zeile ergänzen und unten in
// render() eine Zeile für den Inhalt - sonst nichts.
// "badge" liefert eine Zahl, die als (n) hinter dem Namen erscheint; bei
// Gruppen werden die Zahlen der Kinder zusammengezählt, damit nichts
// übersehen wird, nur weil es zugeklappt ist.
// bereich: welcher Bereich diesen Reiter freischaltet (siehe Migration 28).
// Ohne Angabe ist der Reiter für alle sichtbar, die überhaupt Zugang zur Firma
// haben - das Dashboard zeigt nur Zahlen aus Daten, die man ohnehin sehen darf.
const NAV = [
  { key: 'dashboard', label: 'Dashboard' },
  { label: 'Projekte', bereich: 'projektliste', kinder: [
    { key: 'projekte', label: 'Projektliste' },
    { key: 'soll', label: 'SOLL-Stunden' },
    { key: 'ist', label: 'IST-Stunden' },
  ] },
  { label: 'CRM', bereich: 'crm', kinder: [
    { key: 'kunden', label: 'Kunden' },
    { key: 'crm', label: 'Kandidaten' },
  ] },
  { key: 'placements', label: 'Placements', bereich: 'crm' },
  { key: 'timesheets', label: 'Timesheets', bereich: 'timesheets',
    badge: () => data.timesheets.filter(t => t.status === 'submitted').length },
  { key: 'reports', label: 'Reports', bereich: 'reports',
    badge: () => reportOffeneAnzahl() },
  { key: 'ki', label: 'Eingangsrechnungen', bereich: 'eingangsrechnungen',
    badge: () => data.ki_vorschlaege.filter(v => v.status === 'pending').length },
  // Finance enthält Provisionssätze und die firmenübergreifenden Zahlen für die
  // Bank - wie jeder andere Bereich über das Häkchen steuerbar, seit Migration 30
  // auch in der Datenbank (vorher hing es zusätzlich an der Admin-Rolle, dadurch
  // war das Häkchen wirkungslos). Das Ausblenden hier ist die Bequemlichkeit; die
  // eigentliche Sperre sitzt in der Datenbank, denn ein verstecktes Menü hält
  // niemanden auf, der die Konsole öffnet.
  { label: 'Finance', bereich: 'finance', kinder: [
    { key: 'provisionen', label: 'Provisionen' },
    { key: 'bank', label: 'Jahresübersicht SOLL' },
  ] },
];

// Einstellungen stehen bewusst NICHT in der Reiterleiste: sie gehören nicht zur
// täglichen Arbeit, sondern werden selten und gezielt aufgerufen. Erreichbar
// über das Zahnrad in der Kopfzeile, nur für Admins.
const EINSTELLUNGS_TABS = ['rechte'];

// Bereiche der angemeldeten Person in der aktiven Firma. Kommt aus der Datenbank
// (meine_bereiche), nicht aus dem Browser - hier wird nur angezeigt, was dort
// ohnehin gilt.
let meineBereiche = new Set();

function darfBereich(bereich) {
  if (!bereich) return true;
  if (istAdmin) return true;
  return meineBereiche.has(bereich);
}

// Reiter, die diese Person tatsächlich sehen darf.
function sichtbareNav() {
  return NAV.filter(e => (!e.nurAdmin || istAdmin) && darfBereich(e.bereich));
}
function darfTab(key) {
  if (EINSTELLUNGS_TABS.includes(key)) return istAdmin;
  return sichtbareNav().some(e => e.key === key || (e.kinder || []).some(k => k.key === key));
}

// Klick irgendwo anders und Escape schließen ein offenes Menü. Bewusst HIER auf
// oberster Ebene registriert und nicht in wireTabEvents(): dort käme bei jedem
// Neuaufbau der Seite ein weiterer Listener dazu, bis es hundert sind.
document.addEventListener('click', () => { if (offenesMenu) { offenesMenu = null; render(); } });

// Ein <input type="month"> lässt sich leeren. Ohne Prüfung landete der leere
// Wert als month:'' in der Datenbank - so ein Eintrag taucht danach dauerhaft
// in Monatslisten, Dashboard und Trend auf und lässt sich kaum wieder
// zuordnen. Deshalb: leerer oder unsinniger Wert -> aktueller Monat.
function gueltigerMonat(wert, rueckfall) {
  return /^\d{4}-\d{2}$/.test(wert || '') ? wert : (rueckfall || currentMonthStr());
}

function currentMonthStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

// Der letzte abgeschlossene Kalendermonat - der Monat, für den abgerechnet wird.
// Am 20. August ist das der Juli: der August läuft noch, da fehlen Stunden.
// Erst auf den 1. setzen, sonst würde am 31. März ein Monat zurück beim 3. März
// landen (den 31. Februar gibt es nicht).
function letzterVollerMonat() {
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() - 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

// Macht einen Wert sicher, bevor er in HTML eingesetzt wird. Ohne das kann ein
// Text aus der Datenbank oder aus der URL die Seite umbauen: steht z.B. in einem
// Kundennamen ein "<script>", würde der Browser das als echtes HTML ausführen
// statt es anzuzeigen. Betrifft besonders Felder, die von außen befüllt werden -
// Lieferantennamen aus Weclapp, Absendernamen aus dem Rechnungspostfach, und den
// ?invite=-Parameter aus dem Einladungslink.
//
// Faustregel für neuen Code: alles, was aus der Datenbank oder aus der URL kommt
// und in ein `...`-Template eingesetzt wird, gehört in esc(). Zahlen brauchen es
// nicht (fmtEUR/fmtNum liefern schon sichere Zeichen), fest im Code stehende
// Texte auch nicht. Im Zweifel esc() - doppelt escapen kann nicht passieren,
// weil esc() den Wert immer nur einmal umwandelt.
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Jeder Schreibvorgang gehört hier durch. Grund: Supabase wirft bei einem
// fehlgeschlagenen insert/update/delete KEINE Exception, sondern liefert ein
// Objekt mit .error zurück. Wird das nicht geprüft, läuft der Code stur weiter,
// das Fenster schließt sich, die Liste lädt neu - und der Wert ist einfach nicht
// da. Ein gescheitertes Speichern sah dadurch exakt aus wie ein erfolgreiches.
//
// Rückgabe: bei Erfolg die Daten (bei .select()) bzw. true, im Fehlerfall null.
// Aufrufer, bei denen ein Weiterlaufen Schaden anrichten würde, prüfen deshalb
// auf null und brechen ab.
// quiet: true unterdrückt nur das Hinweisfenster (für Schleifen, die sonst
// dutzendfach nacheinander melden würden) - der Aufrufer meldet dann gesammelt.
// Fehlt ein Bereich, antwortet die Datenbank mit "new row violates row-level
// security policy" bzw. Code 42501. Damit kann niemand etwas anfangen - deshalb
// wird genau dieser Fall in einen verständlichen Satz übersetzt. Alle anderen
// Fehler bleiben im Wortlaut stehen, damit nichts verschleiert wird.
function fehlerText(error) {
  const code = error && error.code;
  const text = (error && error.message) || '';
  if (code === '42501' || /row-level security/i.test(text)) {
    return 'Dafür fehlt dir die Berechtigung.\n\n'
      + 'Die Bereiche werden unter dem Zahnrad oben rechts vergeben (nur Admins).';
  }
  return text;
}

async function save(query, was, quiet) {
  const res = await query;
  if (res && res.error) {
    console.error('Speichern fehlgeschlagen:', was, res.error);
    if (!quiet) {
      alert(`"${was}" konnte nicht gespeichert werden.\n\n${fehlerText(res.error)}\n\n`
        + 'Die Änderung wurde NICHT übernommen. Bitte Seite neu laden und noch einmal versuchen.');
    }
    return null;
  }
  return (res && res.data !== null && res.data !== undefined) ? res.data : true;
}

function fmtEUR(n) { return (n || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }); }
// Rechnungsbeträge mit Cent. fmtEUR rundet auf ganze Euro - das reicht für
// Übersichten, aber nicht für eine Zeile, die so auf die Rechnung geht.
function fmtEUR2(n) { return (n || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtNum(n, digits) { return (n || 0).toLocaleString('de-DE', { maximumFractionDigits: digits ?? 1 }); }
function fmtPct(n) { return ((n || 0) * 100).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + '%'; }
function fmtDate(s) { if (!s) return '–'; const [y,m,d] = s.split('-'); return `${d}.${m}.${y}`; }

// Provisionen, die ohnehin nur mit data.projects der aktuellen Firma arbeiten)
// liefert das dieselben Ergebnisse, weil IDs eindeutig sind.
function project(id) { return data.allProjects.find(p => p.id === id); }
function margeH(p) { return (p.charge_h || 0) - (p.pay_h || 0); }
function margePct(p) { return p.charge_h ? margeH(p) / p.charge_h : 0; }

function isActiveInMonth(p, monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  const monthStart = new Date(y, m - 1, 1);
  const monthEnd = new Date(y, m, 0);
  const start = p.start_date ? new Date(p.start_date) : null;
  const ende = p.end_date ? new Date(p.end_date) : null;
  if (start && start > monthEnd) return false;
  if (ende && ende < monthStart) return false;
  return true;
}

// Status wird automatisch aus der Projektlaufzeit erkannt: "Noch nicht aktiv" (Start liegt in der
// Zukunft), "Beendet" (Ende liegt in der Vergangenheit) oder sonst "Aktiv". "Pausiert" ist die einzige
// manuelle Ausnahme – wird sie im Projekt gesetzt, überschreibt sie die automatische Erkennung.
function computedStatus(p) {
  if (p.status === 'Pausiert') return 'Pausiert';
  const today = new Date();
  const todayUTC = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
  const ps = parseDateUTC(p.start_date);
  const pe = parseDateUTC(p.end_date);
  if (ps !== null && ps > todayUTC) return 'Noch nicht aktiv';
  if (pe !== null && pe < todayUTC) return 'Beendet';
  return 'Aktiv';
}

function round1(n) { return Math.round((n || 0) * 10) / 10; }
// Für Geldbeträge und Tagesmengen im Kundenreport - eine Nachkommastelle reicht
// dort nicht: 1,2 statt 1,22 Tage sind bei 800 EUR/Tag schon 16 EUR Unterschied.
function round2(n) { return Math.round((n || 0) * 100) / 100; }

// Umrechnung Stunden -> Tage für Placements mit Tagessatz. Bewusst anteilig:
// wer an einem Tag 9,75 Stunden arbeitet, hat 1,22 Tage geleistet, nicht 1. Ein
// Deckel auf ganze Tage würde jede Mehrarbeit verschenken.
// Falls das je nach Kunde abweicht, gehört daraus ein Feld am Placement - dann
// hier durch pl.stunden_pro_tag ersetzen.
const STUNDEN_PRO_TAG = 8;
function parseDateUTC(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function daysInclusive(a, b) { return Math.round((b - a) / 86400000) + 1; }
function monthRangeUTC(monthStr) { const [y, m] = monthStr.split('-').map(Number); return [Date.UTC(y, m - 1, 1), Date.UTC(y, m, 0)]; }

// Liste aller Kalendertage eines Monats (für das Contractor-Timesheet: ein Eingabefeld pro Tag).
function daysOfMonth(monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const out = [];
  for (let d = 1; d <= last; d++) {
    const date = monthStr + '-' + String(d).padStart(2, '0');
    const weekday = new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('de-DE', { weekday: 'short', timeZone: 'UTC' });
    out.push({ date, weekday });
  }
  return out;
}

// Gesamte "bestellte" Stunden über die komplette Projektlaufzeit. Bei KH: Std./Woche x Wochen.
// Bei peax gibt es kein Std./Woche - dort steht die Gesamtstundenzahl bereits direkt in
// amount_ordered_hours (wird beim Verteilen auf Monate weiter unten anteilig nach Tagen aufgeteilt).
// Bei Perm-Projekten (Pauschalhonorar statt Stundenabrechnung) zählt immer genau 1 Stunde,
// damit Umsatz = Stunden x Charge/h weiterhin die volle Rechnungssumme ergibt.
function projectTotalSollHours(p) {
  if (p.projekttyp === 'perm') return p.start_date ? 1 : 0;
  const ps = parseDateUTC(p.start_date), pe = parseDateUTC(p.end_date);
  if (ps === null || pe === null || pe < ps) return 0;
  if (p.org === 'peax') return round1(p.amount_ordered_hours || 0);
  return round1((p.wochenstunden || 0) * daysInclusive(ps, pe) / 7);
}

// Anteil der Gesamtstunden, der auf einen bestimmten Monat entfällt (nach Tagesüberlappung).
// Bei Perm-Projekten fällt die gesamte 1 Stunde in den Monat des Startdatums (= Placement-Monat).
// Bei peax wird dafür die bestellte Gesamtstundenzahl (amount_ordered_hours) gleichmäßig über die
// Kalendertage der Projektlaufzeit verteilt (Tage im Monat / Gesamttage x Gesamtstunden) - das
// Gegenstück zu Std./Woche x Tage/7 bei KH, nur eben ausgehend von der Gesamtzahl statt einer Wochenrate.
function projectMonthSollHours(p, monthStr) {
  if (p.projekttyp === 'perm') {
    return (p.start_date && p.start_date.slice(0, 7) === monthStr) ? 1 : 0;
  }
  const ps = parseDateUTC(p.start_date), pe = parseDateUTC(p.end_date);
  if (ps === null || pe === null || pe < ps) return 0;
  const [ms, me] = monthRangeUTC(monthStr);
  const os = Math.max(ps, ms), oe = Math.min(pe, me);
  if (os > oe) return 0;
  const overlapDays = daysInclusive(os, oe);
  if (p.org === 'peax') {
    if (p.amount_ordered_hours == null) return 0;
    const totalDays = daysInclusive(ps, pe);
    if (!totalDays) return 0;
    return round1(p.amount_ordered_hours * overlapDays / totalDays);
  }
  return round1((p.wochenstunden || 0) * overlapDays / 7);
}

function monthListForProject(p) {
  if (p.projekttyp === 'perm') return p.start_date ? [p.start_date.slice(0, 7)] : [];
  if (!p.start_date || !p.end_date) return [];
  const [sy, sm] = p.start_date.split('-').map(Number);
  const [ey, em] = p.end_date.split('-').map(Number);
  const out = []; let y = sy, m = sm, guard = 0;
  while ((y < ey || (y === ey && m <= em)) && guard < 240) {
    out.push(y + '-' + String(m).padStart(2, '0'));
    m++; if (m > 12) { m = 1; y++; }
    guard++;
  }
  return out;
}

// Gleicht die SOLL-Einträge eines Projekts mit der berechneten Monatsverteilung ab.
// Manuell überschriebene Monate (auto === false) werden dabei nicht angetastet.
async function syncAutoSoll(proj) {
  const months = monthListForProject(proj);
  const monthSet = new Set(months);
  const existing = data.entries.filter(e => e.project_id === proj.id && e.kind === 'soll');

  // Fehler werden gezählt und am Ende EINMAL gemeldet - hier laufen pro Projekt
  // bis zu einem Dutzend Schreibvorgänge, ein Hinweisfenster je Monat wäre nicht
  // wegklickbar.
  let fehler = 0;
  for (const m of months) {
    const hours = projectMonthSollHours(proj, m);
    const ex = existing.find(e => e.month === m);
    if (!ex) {
      if (!await save(sb.from('entries').insert({ project_id: proj.id, kind: 'soll', month: m, stunden: hours, auto: true }), 'SOLL-Monat', true)) fehler++;
    } else if (ex.auto && Math.abs((ex.stunden || 0) - hours) > 0.05) {
      if (!await save(sb.from('entries').update({ stunden: hours }).eq('id', ex.id), 'SOLL-Monat', true)) fehler++;
    }
  }
  const stale = existing.filter(e => e.auto && !monthSet.has(e.month));
  for (const e of stale) {
    if (!await save(sb.from('entries').delete().eq('id', e.id), 'SOLL-Monat entfernen', true)) fehler++;
  }
  if (fehler) {
    alert(`Die automatische SOLL-Berechnung konnte ${fehler} Monat(e) nicht speichern`
      + `${proj.kunde ? ' (Projekt: ' + proj.kunde + ')' : ''}.\n\n`
      + 'Die SOLL-Stunden dieses Projekts sind dadurch unvollständig. Details stehen in der '
      + 'Browser-Konsole. Bitte Seite neu laden und "SOLL neu berechnen" noch einmal ausführen.');
  }
  await loadAll();
}

async function recalcAllSoll() {
  for (const p of data.projects) {
    await syncAutoSoll(p);
  }
}

function computeEntry(e) {
  const p = project(e.project_id);
  const chargeH = p ? p.charge_h : 0;
  const payH = p ? p.pay_h : 0;
  const stunden = e.stunden || 0;
  const umsatz = stunden * chargeH;
  const kosten = stunden * payH;
  return { stunden, umsatz, kosten, rohertrag: umsatz - kosten };
}
function sumEntries(list) {
  return list.reduce((acc, e) => {
    const c = computeEntry(e);
    acc.stunden += c.stunden; acc.umsatz += c.umsatz; acc.kosten += c.kosten; acc.rohertrag += c.rohertrag;
    return acc;
  }, { stunden: 0, umsatz: 0, kosten: 0, rohertrag: 0 });
}
function entriesOf(kind) { return data.entries.filter(e => e.kind === kind); }

// Gruppiert SOLL- und IST-Zahlen nach Kunde: Umsatz (Stunden x Charge/h), Kosten (Stunden x Pay/h)
// und Rohertrag (Umsatz - Kosten), summiert über alle Projekte des Kunden.
function customerBreakdown(sollEntries, istEntries) {
  const kunden = Array.from(new Set(data.projects.map(p => p.kunde))).sort();
  return kunden.map(k => {
    const projectIds = new Set(data.projects.filter(p => p.kunde === k).map(p => p.id));
    const soll = sumEntries(sollEntries.filter(e => projectIds.has(e.project_id)));
    const ist = sumEntries(istEntries.filter(e => projectIds.has(e.project_id)));
    return {
      kunde: k,
      sollUmsatz: soll.umsatz, istUmsatz: ist.umsatz,
      sollKosten: soll.kosten, istKosten: ist.kosten,
      sollRohertrag: soll.rohertrag, istRohertrag: ist.rohertrag,
    };
  });
}
function allMonthsUsed() {
  const set = new Set();
  data.entries.forEach(e => set.add(e.month));
  set.add(currentMonthStr());
  return Array.from(set).sort();
}
function statusFromErf(erf, hasSoll) {
  if (!hasSoll) return null;
  if (erf >= 0.9) return 'Gut';
  if (erf >= 0.8) return 'Achtung';
  return 'Kritisch';
}
function monthLabel(m) { const [y, mo] = m.split('-').map(Number); return MONTH_NAMES[mo - 1] + ' ' + y; }

// SOLL-Zahlen beider Firmen nebeneinander, monatsweise - die Aufstellung, die
// bisher von Hand in Excel gepflegt wurde und an die Bank geht.
//
// ACHTUNG, bewusste Ausnahme: Dies ist die EINZIGE Stelle, an der KH und peax
// gemeinsam dargestellt werden. Überall sonst gilt die strikte Trennung nach
// activeOrg (siehe CLAUDE.md). Hier ist die Vermischung genau der Zweck - die
// Bank will die GmbH als Ganzes sehen. Deshalb data.allEntries statt data.entries.
//
// Wer nur für eine Firma freigeschaltet ist, sieht durch RLS auch nur deren
// Zahlen; der Summenblock wird dann weggelassen, damit "Total GmbH" nicht eine
// Vollständigkeit vortäuscht, die es für diese Person nicht gibt.

function bankJahre() {
  const set = new Set(data.allEntries.filter(e => e.kind === 'soll' && e.month).map(e => yearOfMonth(e.month)));
  set.add(new Date().getFullYear());
  return Array.from(set).filter(y => y > 1990 && y < 2200).sort((a, b) => b - a);
}

// Liefert je Monat { umsatz, kosten, rohertrag } für eine Firma - oder für alle
// freigeschalteten Firmen zusammen, wenn org null ist.
function bankZeilen(org, monate) {
  return monate.map(m => {
    const treffer = data.allEntries.filter(e => {
      if (e.kind !== 'soll' || e.month !== m) return false;
      const p = project(e.project_id);
      if (!p) return false;
      return org ? p.org === org : allowedOrgs.includes(p.org);
    });
    return sumEntries(treffer);
  });
}

      </div>
    </div>
    ${orgs.map(o => bankBlockHTML(ORG_LABELS[o] || o, monate, bankZeilen(o, monate), false)).join('')}
    ${orgs.length < 2 ? '' : bankBlockHTML('Total GmbH', monate, bankZeilen(null, monate), true)}
`;
}

function exportBankReport() {
  if (typeof XLSX === 'undefined') { alert('Die Excel-Bibliothek konnte nicht geladen werden (CDN/Internetverbindung prüfen).'); return; }
  const monate = monthsInYear(bankJahr);
  const orgs = allowedOrgs.slice().sort();
  const rows = [];
  const block = (titel, werte) => {
    ['umsatz', 'kosten', 'rohertrag'].forEach(feld => {
      const name = feld === 'umsatz' ? 'Umsatzerlöse' : (feld === 'kosten' ? 'Kosten' : 'Rohertrag');
      const zeile = { Bereich: titel, Position: name };
      monate.forEach((m, i) => { zeile[MONTH_NAMES[i]] = round2(werte[i][feld]); });
      zeile['Gesamt'] = round2(werte.reduce((s, w) => s + w[feld], 0));
      rows.push(zeile);
    });
  };
  orgs.forEach(o => block(ORG_LABELS[o] || o, bankZeilen(o, monate)));
  if (orgs.length > 1) block('Total GmbH', bankZeilen(null, monate));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'SOLL ' + bankJahr);
  XLSX.writeFile(wb, `Jahresuebersicht_SOLL_${bankJahr}.xlsx`);
}

// ---------- PROVISIONEN ----------

function consultant(id) { return data.consultants.find(c => c.id === id); }
function consultantName(id) { const c = consultant(id); return c ? c.name : '–'; }

// Umsatz, der einem Consultant aus einem Projekt zugerechnet wird: voll, wenn er alleine
// oder mit sich selbst in beiden Rollen zugewiesen ist; halb, wenn zwei unterschiedliche
// Consultants am Projekt hängen.
function consultantShareForProject(p, consultantId) {
  const c1 = p.consultant1_id, c2 = p.consultant2_id;
  const involved = c1 === consultantId || c2 === consultantId;
  if (!involved) return 0;
  if (c1 && c2 && c1 !== c2) return 0.5;
  return 1;
}

// Summe des einem Consultant zugerechneten Rohertrags (Umsatz - Kosten = Stunden x Marge/h) über
// eine Liste von Entries (z.B. alle IST-Einträge eines Monats). Provision wird auf Rohertrag berechnet, nicht auf Umsatz.
function attributedRevenue(consultantId, entries) {
  let total = 0;
  for (const e of entries) {
    const p = project(e.project_id);
    if (!p) continue;
    const share = consultantShareForProject(p, consultantId);
    if (share > 0) total += computeEntry(e).rohertrag * share;
  }
  return total;
}

function quarterOfMonth(monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  const q = Math.floor((m - 1) / 3) + 1;
  return { year: y, quarter: q };
}
function monthsInQuarter(year, quarter) {
  const startM = (quarter - 1) * 3 + 1;
  return [0, 1, 2].map(i => year + '-' + String(startM + i).padStart(2, '0'));
}
function quarterLabel(year, quarter) { return 'Q' + quarter + ' ' + year; }
function monthsInYear(year) { return Array.from({ length: 12 }, (_, i) => year + '-' + String(i + 1).padStart(2, '0')); }
function yearOfMonth(monthStr) { return Number(monthStr.split('-')[0]); }

// Team-Mitglieder eines Team-Leads, aus team_memberships (nicht mehr über ein einzelnes
// team_lead_id-Feld auf dem Mitglied) - so kann eine Person gleichzeitig bei mehreren
// Team-Boni mitzählen (z.B. bei peax Erik/Georg bei Sam UND bei Valentin).
function teamMembersOf(leadId) {
  const ids = new Set(data.team_memberships.filter(tm => tm.team_lead_id === leadId).map(tm => tm.member_id));
  return data.consultants.filter(c => ids.has(c.id));
}

// Zeitraum-Fenster für den Team-Bonus eines Leads, je nach team_rate_period
// ('quarterly' oder 'yearly'), bezogen auf den im Provisionen-Tab gewählten Monat.
function periodWindowFor(lead, refMonth) {
  if (lead.team_rate_period === 'yearly') {
    const year = yearOfMonth(refMonth);
    return { months: monthsInYear(year), label: String(year) };
  }
  const { year, quarter } = quarterOfMonth(refMonth);
  return { months: monthsInQuarter(year, quarter), label: quarterLabel(year, quarter) };
}

// Detail-Zeilen (pro Projekt/Freelancer) für die Provisionsabrechnung eines Consultants,
// über eine gegebene Liste von IST-Einträgen (Monat oder ganzes Quartal).
function projectRowsForConsultant(consultantId, entries) {
  const rows = [];
  for (const e of entries) {
    const p = project(e.project_id);
    if (!p) continue;
    const share = consultantShareForProject(p, consultantId);
    if (share <= 0) continue;
    const c = computeEntry(e);
    rows.push({
      month: e.month, kunde: p.kunde, contractor: p.contractor,
      stunden: c.stunden, rohertragVoll: c.rohertrag, share, rohertragAnteil: c.rohertrag * share,
    });
  }
  return rows.sort((a, b) => a.month === b.month ? a.kunde.localeCompare(b.kunde) : a.month.localeCompare(b.month));
}

// Druckbare Provisionsabrechnung für einen einzelnen Consultant (Monat) oder Team-Lead (Quartal),

    // Team-Mitgliedschaften abgleichen (nur relevant, falls dieser Consultant Team-Lead ist) -
    // bestehende entfernen, die nicht mehr angehakt sind, neue hinzufügen. Falls die Migration
    // migration_team_bonus.sql noch nicht ausgeführt wurde, schlagen diese Calls einfach fehl,
    // ohne die App zu blockieren (Consultant selbst ist dann trotzdem gespeichert).
    if (consultantId) {
      const { data: existing } = await sb.from('team_memberships').select('*').eq('team_lead_id', consultantId);
      const existingIds = new Set((existing || []).map(tm => tm.member_id));
      const toRemove = (existing || []).filter(tm => !checkedMemberIds.includes(tm.member_id));
      const toAdd = checkedMemberIds.filter(id => !existingIds.has(id));
      let fehler = 0;
      for (const tm of toRemove) if (!await save(sb.from('team_memberships').delete().eq('id', tm.id), 'Team-Zuordnung', true)) fehler++;
      for (const memberId of toAdd) if (!await save(sb.from('team_memberships').insert({ team_lead_id: consultantId, member_id: memberId }), 'Team-Zuordnung', true)) fehler++;
      if (fehler) {
        alert(`Der Consultant wurde gespeichert, aber ${fehler} Team-Zuordnung(en) nicht.\n\n`
          + 'Falls die Migration 08_migration_team_bonus.sql noch nicht ausgeführt wurde, ist das '
          + 'erwartbar. Sonst stehen Details in der Browser-Konsole.');
      }
    }
    modalConfig = null;
    await loadAll();
  });
}

// ---------- CONTRACTORS (externe Freelancer mit eigenem Timesheet-Zugang) ----------
// Bewusst eine eigene, kleine Verwaltung getrennt von den Consultants oben - siehe Kommentar
// am Anfang von migration_contractor_timesheets.sql für den Unterschied.

function contractor(id) { return data.contractors.find(c => c.id === id); }
function contractorName(id) { const c = contractor(id); return c ? c.name : '–'; }
// Alias-Namen eines Contractors (Schreibweisen, unter denen er in Weclapp
// Rechnungen stellt). Leer, solange Migration 22 nicht gelaufen ist.
function aliaseVon(contractorId) {
  if (!contractorId || !data.contractorAliase) return [];
  return data.contractorAliase.filter(a => a.contractor_id === contractorId).map(a => a.alias).sort();
}

function openContractorModal(id) {
  const c = id ? contractor(id) : null;
  modalConfig = {
    type: 'contractor', id: id || null,
    values: c ? { ...c } : { org: activeOrg, name: '', email: '' },
    // Zustand des Kunde/Projekt-Baums unten - lebt nur, während das Modal offen ist.
    pickerSearch: '', pickerExpanded: new Set(), pickerChecked: null, pickerExpandedInit: false,
  };
  render();
}

function renderContractorModal(c) {
  const v = c.values;
  // Die Kunde/Projekt-Auswahl kommt bewusst aus dem CRM (Tab "CRM"), nicht direkt aus dem
  // Tab "Projekte": dort werden die konkreten Subprojekte pro Kunde angelegt (candidates.kunde
  // + candidates.projekt_name) - das Projekte-Sheet selbst ist zu allgemein gefasst, um darauf
  // ein Timesheet sinnvoll aufzuteilen. Ein Kandidat muss dafür schon per "Projekt erzeugen" im
  // CRM mit einem echten Projekt verknüpft sein (candidates.linked_project_id) - erst dann kann
  // ein Contractor auch tatsächlich Stunden dagegen buchen (contractor_projects zeigt technisch
  // weiterhin auf projects.id, die Anzeige/Gruppierung kommt aber aus den CRM-Kandidaten).
  const assignedIds = c.id ? new Set(data.contractorProjects.filter(cp => cp.contractor_id === c.id).map(cp => cp.project_id)) : new Set();
  if (!c.pickerChecked) c.pickerChecked = new Set(assignedIds);

  // Leaf-Elemente sind die einzelnen Projekte (Tabelle placement_projekte),
  // gruppiert nach dem Kunden ihres Kandidaten (kunde_id, nicht nach Textvergleich -
  // vermeidet Gruppierungs-Doppler durch Tippfehler im Freitext). Seit Migration 27
  // hängen mehrere davon unter einem Placement; gebucht wird auf jedes einzeln.
  const byKunde = new Map();
  data.placements.forEach(sp => {
    const cd = candidate(sp.candidate_id);
    if (!cd || !cd.kunde_id) return;
    if (!byKunde.has(cd.kunde_id)) byKunde.set(cd.kunde_id, []);
    byKunde.get(cd.kunde_id).push({ sp, cd });
  });

  const nameNorm = (v.name || '').trim().toLowerCase();
  const suggestedKunden = new Set();
  if (nameNorm) data.candidates.forEach(cd => { if (cd.kunde_id && (cd.contractor || '').trim().toLowerCase() === nameNorm) suggestedKunden.add(cd.kunde_id); });
  // Kunden von bereits angehakten Projekten (auch wenn gerade erst über die Suche
  // dazugewählt) bleiben immer sichtbar, damit eine Auswahl nicht verschwindet, sobald
  // die Suche wieder leer ist.
  const checkedKunden = new Set();
  data.placements.forEach(sp => {
    if (!sp.linked_project_id || !c.pickerChecked.has(sp.linked_project_id)) return;
    const cd = candidate(sp.candidate_id);
    if (cd && cd.kunde_id) checkedKunden.add(cd.kunde_id);
  });
  // Standardmäßig (ohne Suche) nur die zu diesem Contractor passenden Kunden zeigen - nicht
  // die komplette Kundenliste der Firma. Andere Kunden findet man über die Suche.
  const defaultKunden = new Set([...suggestedKunden, ...checkedKunden]);
  if (!c.pickerExpandedInit) { defaultKunden.forEach(k => c.pickerExpanded.add(k)); c.pickerExpandedInit = true; }

  const search = (c.pickerSearch || '').trim().toLowerCase();
  const kundenList = Array.from(byKunde.keys()).sort((a, b) => kundeName(a).localeCompare(kundeName(b)))
    .filter(kid => search ? kundeName(kid).toLowerCase().includes(search) : defaultKunden.has(kid));

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${c.id ? 'Contractor bearbeiten' : 'Neuer Contractor'}</h3>
      <div class="field"><label>Name</label><input type="text" id="ctf_name" value="${esc(v.name || '')}"></div>
      <div class="field"><label>E-Mail (für den Timesheet-Login)</label><input type="text" id="ctf_email" value="${esc(v.email || '')}" placeholder="freelancer@beispiel.com"></div>
      ${!data.contractorAliase ? '' : `
      <div class="field">
        <label>Rechnet auch ab als (ein Name pro Zeile)</label>
        <textarea id="ctf_aliase" rows="3" style="width:100%;font-family:inherit;font-size:14px;padding:8px;border:1px solid var(--border);border-radius:8px;">${esc(aliaseVon(c.id).join('\n'))}</textarea>
      </div>`}
      <div class="field">
        <label>Kunde / Subprojekte aus dem CRM (worauf dieser Contractor Stunden buchen darf)</label>
        <input type="text" id="ctf_picker_search" placeholder="🔍 weiteren Kunden suchen…" value="${c.pickerSearch || ''}" style="width:100%;margin-bottom:8px;">
        <div style="display:flex;flex-direction:column;gap:2px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;max-height:260px;overflow:auto;">
          ${kundenList.length ? kundenList.map(kid => {
            const itemsOfKunde = byKunde.get(kid);
            const checkedCount = itemsOfKunde.filter(({ sp }) => sp.linked_project_id && c.pickerChecked.has(sp.linked_project_id)).length;
            const expanded = c.pickerExpanded.has(kid) || !!search;
            const isSuggested = suggestedKunden.has(kid);
            return `
            <div>
              <div data-toggle-kunde="${kid}" style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:5px 2px;font-weight:600;font-size:13px;">
                <span style="display:inline-block;width:14px;">${expanded ? '▾' : '▸'}</span>
                <span>${esc(kundeName(kid))}</span>
                ${checkedCount ? `<span class="mini-badge manuell">${checkedCount}</span>` : ''}
                ${isSuggested ? `<span class="mini-badge auto">Vorschlag</span>` : ''}
              </div>
              ${expanded ? `
              <div style="padding-left:26px;display:flex;flex-direction:column;gap:4px;margin-bottom:4px;">
                ${itemsOfKunde.map(({ sp, cd }) => sp.linked_project_id ? `
                  <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;margin:0;">
                    <input type="checkbox" class="ctf_project" value="${sp.linked_project_id}" ${c.pickerChecked.has(sp.linked_project_id) ? 'checked' : ''}> ${esc(placementBezeichnung(sp, cd))}
                  </label>` : `
                  <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;margin:0;color:var(--muted);" title="Im CRM erst auf 'Projekt erzeugen' klicken, bevor darauf gebucht werden kann">
                    <input type="checkbox" disabled> ${esc(placementBezeichnung(sp, cd))} (noch kein Projekt erzeugt)
                  </label>`).join('')}
              </div>` : ''}
            </div>`;
          }).join('') : `<span class="empty" style="padding:0;">${search ? 'keine passenden Kunden' : 'kein passender Kunde anhand des Namens gefunden – oben nach dem Kunden suchen'}</span>`}
        </div>
      </div>
      <div class="modal-actions">
        ${c.id ? '<button class="btn danger" id="modalDeleteContractor">Löschen</button>' : ''}
        <button class="btn" id="modalCancelContractor">Abbrechen</button>
        <button class="btn primary" id="modalSaveContractor">Speichern</button>
      </div>
    </div>`;
  document.getElementById('app').appendChild(overlay);

  // Aktuelle Checkbox-Auswahl im modalConfig sichern, bevor ein Re-Render (Suche/Aufklappen)
  // den DOM neu aufbaut - sonst gingen bereits gesetzte Haken bei versteckten/eingeklappten
  // Zeilen verloren.
  function syncChecked() {
    document.querySelectorAll('.ctf_project').forEach(el => { if (el.checked) c.pickerChecked.add(el.value); else c.pickerChecked.delete(el.value); });
  }
  document.querySelectorAll('.ctf_project').forEach(cb => cb.addEventListener('change', syncChecked));
  document.querySelectorAll('[data-toggle-kunde]').forEach(el => el.addEventListener('click', () => {
    syncChecked();
    const k = el.dataset.toggleKunde;
    if (c.pickerExpanded.has(k)) c.pickerExpanded.delete(k); else c.pickerExpanded.add(k);
    render();
  }));
  const pickerSearchInput = document.getElementById('ctf_picker_search');
  if (pickerSearchInput) pickerSearchInput.addEventListener('input', () => {
    syncChecked();
    c.pickerSearch = pickerSearchInput.value;
    render();
    const fresh = document.getElementById('ctf_picker_search');
    if (fresh) { fresh.focus(); const pos = fresh.value.length; fresh.setSelectionRange(pos, pos); }
  });

  document.getElementById('modalCancelContractor').addEventListener('click', () => { modalConfig = null; render(); });
  if (c.id) document.getElementById('modalDeleteContractor').addEventListener('click', () => deleteContractor(c.id));
  document.getElementById('modalSaveContractor').addEventListener('click', async () => {
    syncChecked();
    const payload = {
      org: c.id ? c.values.org : activeOrg,
      name: document.getElementById('ctf_name').value.trim(),
      email: document.getElementById('ctf_email').value.trim() || null,
    };
    let contractorId = c.id;
    if (contractorId) {
      if (!await save(sb.from('contractors').update(payload).eq('id', contractorId), 'Contractor')) return;
    } else {
      const inserted = await save(sb.from('contractors').insert(payload).select().single(), 'Contractor');
      if (!inserted) return; // ohne angelegten Contractor ergeben die Projektzuordnungen unten keinen Sinn
      contractorId = inserted.id;
    }
    // Alias-Namen abgleichen: entfernte löschen, neue anlegen. Nur wenn das Feld
    // überhaupt existiert (Migration 22 ausgeführt).
    const aliasFeld = document.getElementById('ctf_aliase');
    if (contractorId && aliasFeld) {
      const neu = aliasFeld.value.split('\n').map(z => z.trim()).filter(Boolean);
      const alt = aliaseVon(contractorId);
      const raus = alt.filter(a => !neu.includes(a));
      const rein = neu.filter(a => !alt.includes(a));
      let aFehler = 0;
      for (const a of raus) {
        if (!await save(sb.from('contractor_aliase').delete().eq('contractor_id', contractorId).eq('alias', a), 'Alias entfernen', true)) aFehler++;
      }
      for (const a of rein) {
        if (!await save(sb.from('contractor_aliase').insert({ contractor_id: contractorId, alias: a }), 'Alias anlegen', true)) aFehler++;
      }
      if (aFehler) alert(`Der Contractor wurde gespeichert, aber ${aFehler} Alias-Name(n) nicht. Details in der Browser-Konsole.`);
    }
    if (contractorId) {
      const checkedIds = Array.from(c.pickerChecked);
      const toRemove = Array.from(assignedIds).filter(id => !c.pickerChecked.has(id));
      const toAdd = checkedIds.filter(id => !assignedIds.has(id));
      let fehler = 0;
      for (const projectId of toRemove) if (!await save(sb.from('contractor_projects').delete().eq('contractor_id', contractorId).eq('project_id', projectId), 'Projektzuordnung', true)) fehler++;
      for (const projectId of toAdd) if (!await save(sb.from('contractor_projects').insert({ contractor_id: contractorId, project_id: projectId }), 'Projektzuordnung', true)) fehler++;
      if (fehler) alert(`Der Contractor wurde gespeichert, aber ${fehler} Projektzuordnung(en) nicht. Details in der Browser-Konsole.`);
    }
    modalConfig = null;
    await loadAll();
  });
}

// ---------- CRM (Kandidaten/Freelancer) ----------
// Ein Kandidat bildet die Beziehung Freelancer<->Kunde ab (Name, E-Mails, VAT-ID). Darunter
// können mehrere Placements hängen (Tabelle placements) - manche Freelancer arbeiten für
// denselben Kunden gleichzeitig an mehreren, eigenständigen Projekten mit jeweils eigenem
// Namen, eigener Projektnummer und eigenen Konditionen. "Projekt erzeugen" übernimmt pro
// Subprojekt nur die Felder, die es auch in der Tabelle "projects" gibt (Kunde/Contractor
// kommen dabei vom übergeordneten Kandidaten) - Projektname, Projektnummer, E-Mails und
// VAT-ID bleiben bewusst nur im CRM.

function candidate(id) { return data.candidates.find(cd => cd.id === id); }
// "Placement" = ein Kandidat bei einem konkreten Projekt/Kunde, mit eigenen Konditionen
// (Pay/Charge, Zeitraum, Consultants, Zahlungsziel, PO) - siehe migration_placements.sql.
// Ein Kandidat kann mehrere Placements haben (mehrere Projekte, ggf. mit unterschiedlichen
// Konditionen). Tabellenname in Supabase ist weiterhin "placements".
function placement(id) { return data.placements.find(p => p.id === id); }
function placementsOf(candidateId) { return data.placements.filter(p => p.candidate_id === candidateId); }
// Die Projekte eines Placements (Migration 27). Ein Placement trägt die Konditionen
// des Freelancers, die Projekte darunter sind das, was einzeln im Timesheet erfasst
// und einzeln abgerechnet wird. Im Timesheet-Portal-Export von Siemens heißt die
// Projektnummer "Rate code" - dieselbe Sache, nur deren Wort dafür.
function projekteVon(placementId) { return (data.placementProjekte || []).filter(pp => pp.placement_id === placementId); }
// Anzeigename eines Placements: die Projekte darunter, sonst der Name des
// Freelancers. Die alten Felder placements.projekt_name/_nummer sind seit
// Migration 27 leer und werden nicht mehr gelesen.
function placementBezeichnung(pl, cd) {
  const rc = projekteVon(pl.id);
  if (!rc.length) return (cd && cd.contractor) || '(ohne Namen)';
  return rc.map(pp => (pp.projekt_name || '(ohne Namen)') + (pp.projekt_nummer ? ' #' + pp.projekt_nummer : '')).join(', ');
}
function ppKey(pp) { return pp.id || pp._tempId; }
function blankPlacementProjekt() {
  return { id: null, _tempId: 'pp-' + Math.random().toString(36).slice(2),
           projekt_name: '', projekt_nummer: '' };
}
function candidateProjectsOf(candidateId) { return placementsOf(candidateId); } // Alias, falls noch irgendwo referenziert

// ---------- CRM (Kunden-Stammdaten: Anschrift, VAT-ID, Ansprechpartner, Payment Terms) ----------
// Projekte und Kandidaten wählen ihren Kunden per Dropdown aus dieser Liste (kunde_id) statt per
// Freitext - siehe migration_kunden.sql. Das bisherige Textfeld "kunde" bleibt als denormalisierter
// Anzeigename bestehen (wird beim Speichern/Umbenennen automatisch synchron gehalten), damit alle
// bestehenden Auswertungen (Filter, Gruppierung, Tortendiagramm, Suche) unverändert weiterlaufen.
function kunde(id) { return data.kunden.find(k => k.id === id); }
function kundeName(id) { const k = kunde(id); return k ? k.name : '–'; }
function kundeOptionsHTML(selectedId) {
  const sorted = [...data.kunden].sort((a, b) => a.name.localeCompare(b.name));
  return '<option value="">– bitte wählen –</option>' +
    sorted.map(k => `<option value="${k.id}" ${selectedId === k.id ? 'selected' : ''}>${esc(k.name)}</option>`).join('');
}

// Stunden-Index: die freigegebenen Stunden werden EINMAL zusammengezählt und
// danach nachgeschlagen. Vorher lief jede einzelne Abfrage durch alle
// Timesheet-Tage - bei einem Kunden wie Siemens mit über 40 Contractors und
// mehreren Jahren Historie sind das je Report-Zeile ~100.000 Zeilen, und der
// Reports-Tab hing dadurch spürbar. Der Index wird nach jedem Laden verworfen
// (siehe loadAll), kann also nicht veralten.
let stundenIndexCache = null;
function stundenIndex() {
  if (stundenIndexCache) return stundenIndexCache;
  const proTimesheet = new Map();
  data.timesheetDays.forEach(d => {
    proTimesheet.set(d.timesheet_id, (proTimesheet.get(d.timesheet_id) || 0) + (Number(d.stunden) || 0));
  });
  const proProjekt = new Map();          // projectId                        -> Stunden
  const proProjektMonat = new Map();     // projectId|month                  -> Stunden
  const proContractorMonat = new Map();  // projectId|month|contractorId     -> Stunden
  const contractorsJeMonat = new Map();  // projectId|month                  -> Set(contractorId)
  const proRateCode = new Map();         // projectId|month|contractorId|rateCodeId -> Stunden
  data.timesheets.forEach(t => {
    if (t.status !== 'approved') return;
    const std = proTimesheet.get(t.id) || 0;
    const pm = t.project_id + '|' + t.month;
    proProjekt.set(t.project_id, (proProjekt.get(t.project_id) || 0) + std);
    proProjektMonat.set(pm, (proProjektMonat.get(pm) || 0) + std);
    const pcm = pm + '|' + t.contractor_id;
    proContractorMonat.set(pcm, (proContractorMonat.get(pcm) || 0) + std);
    // Zusätzlich je Projekt: die Projektzeile bekommt die Gesamtstunden, der
    // Report braucht sie aufgeteilt nach Kostenstelle.
    if (t.placement_projekt_id) {
      const rc = pcm + '|' + t.placement_projekt_id;
      proRateCode.set(rc, (proRateCode.get(rc) || 0) + std);
    }
    if (!contractorsJeMonat.has(pm)) contractorsJeMonat.set(pm, new Set());
    contractorsJeMonat.get(pm).add(t.contractor_id);
  });
  stundenIndexCache = { proProjekt, proProjektMonat, proContractorMonat, contractorsJeMonat, proRateCode };
  return stundenIndexCache;
}

// Summe der freigegebenen (approved) Timesheet-Stunden eines Projekts in einem bestimmten Monat -
// Basis für die "Menge"-Spalte im Reports-Tab (siehe reportZeilen).
function approvedHoursForProjectMonth(projectId, month) {
  return stundenIndex().proProjektMonat.get(projectId + '|' + month) || 0;
}

// Dasselbe, aber für EINEN bestimmten Freelancer. Für den Kundenreport ist das
// die richtige Zahl: dort steht pro Zeile ein Freelancer mit SEINEM Stundensatz.
// Die Projektsumme oben zählt dagegen alle Freelancer zusammen (so gewollt, sie
// füllt die IST-Stunden des Projekts) - in einer Rechnungszeile wäre sie falsch.
// Ist Migration 19 (candidates.contractor_id) in dieser Datenbank schon gelaufen?
// Solange nicht, wird das Auswahlfeld nicht angezeigt und das Feld nicht
// mitgespeichert - sonst würde jedes Speichern eines Kandidaten scheitern, nur
// weil die App neuer ist als die Datenbank.
function hatContractorVerknuepfung() {
  return !data.candidates.length || Object.prototype.hasOwnProperty.call(data.candidates[0], 'contractor_id');
}

// rateCodeId gesetzt = nur die Stunden dieser einen Kostenstelle. Ohne Angabe die
// Summe über alle Kostenstellen des Projekts (so wie die Projektzeile sie führt).
function approvedHoursForContractorMonth(projectId, contractorId, month, rateCodeId) {
  if (!contractorId) return null;
  const basis = projectId + '|' + month + '|' + contractorId;
  if (rateCodeId) return stundenIndex().proRateCode.get(basis + '|' + rateCodeId) || 0;
  return stundenIndex().proContractorMonat.get(basis) || 0;
}

// Wie viele verschiedene Freelancer haben in diesem Monat freigegebene Stunden
// auf dem Projekt? Bei genau einem ist die Projektsumme automatisch auch dessen
// Summe - dann darf der Report sie auch ohne Verknüpfung verwenden.
function approvedContractorCount(projectId, month) {
  const menge = stundenIndex().contractorsJeMonat.get(projectId + '|' + month);
  return menge ? menge.size : 0;
}

// ---------- REPORTS (Grundlage für die Kundenrechnungen) ----------
//
// Aufbau wie der bisherige TimesheetPortal-Report: pro Freelancer eine Position
// mit Menge, Satz und Betrag für einen Monat. Grundlage sind ausschließlich
// FREIGEGEBENE Timesheets - alles andere ist noch nicht abrechenbar.

// Ein Placement hat mehrere Projekte und damit mehrere Rechnungspositionen pro
// Monat - der Vermerk hängt deshalb am einzelnen Projekt, nicht am Placement.
function abrechnungFuer(projektEintragId, month) {
  return (data.abrechnungen || []).find(a => a.placement_projekt_id === projektEintragId && a.month === month);
}

// Zeichen am Reiter: wie viele Positionen im gewählten Monat noch offen sind -
// bewusst über ALLE Kunden, unabhängig vom eingestellten Filter.
//
// Läuft bei JEDEM Neuzeichnen, auch auf ganz anderen Reitern. Deshalb gemerkt und
// nur neu gerechnet, wenn sich Daten oder Monat geändert haben - sonst zahlt jeder
// Klick irgendwo in der App für eine Zahl in Klammern.
let offeneAnzahlCache = null;
function reportOffeneAnzahl() {
  if (!data.candidates.length) return 0;
  const index = stundenIndex();
  if (offeneAnzahlCache && offeneAnzahlCache.index === index
      && offeneAnzahlCache.monat === reportMonth
      && offeneAnzahlCache.abrechnungen === data.abrechnungen) {
    return offeneAnzahlCache.wert;
  }
  const wert = reportZeilen('').zeilen.filter(z => !z.abr).length;
  offeneAnzahlCache = { index, monat: reportMonth, abrechnungen: data.abrechnungen, wert };
  return wert;
}

// Baut die Positionen für Tabelle UND Excel-Export aus denselben Daten. Beides
// aus einer Quelle, damit auf dem Bildschirm nie etwas anderes steht als in der
// Datei, aus der anschließend die Rechnung geschrieben wird.
function reportZeilen(kundeFilter) {
  const filterId = kundeFilter === undefined ? reportKundeId : kundeFilter;
  const zeilen = [];
  const warnungen = [];
  const kandidaten = filterId ? data.candidates.filter(cd => cd.kunde_id === filterId) : data.candidates;
  kandidaten.forEach(cd => {
    // Eine Rechnungsposition je Projekt - die Konditionen kommen vom
    // Placement darüber. Bei Siemens hat eine Person mehrere Kostenstellen und
    // damit mehrere Positionen im selben Monat, alle zu demselben Satz.
    placementsOf(cd.id).filter(pl => pl.linked_project_id).forEach(pl => {
    const rateCodes = projekteVon(pl.id);
    (rateCodes.length ? rateCodes : [null]).forEach(pp => {
      // Stunden IMMER nur die dieses einen Freelancers. Ohne Verknüpfung
      // (candidates.contractor_id) geht das nur, wenn auf dem Projekt in diesem
      // Monat ohnehin nur eine Person gebucht hat - sonst würde die Position die
      // Stunden der Kollegen mitberechnen und der Kunde zu viel bezahlen.
      let stunden = approvedHoursForContractorMonth(pl.linked_project_id, cd.contractor_id, reportMonth, pp ? pp.id : null);
      if (stunden === null) {
        const anzahl = approvedContractorCount(pl.linked_project_id, reportMonth);
        if (anzahl > 1) {
          warnungen.push(`${cd.contractor || 'Unbenannter Kandidat'} (${(pp && pp.projekt_name) || 'ohne Projektnamen'}): `
            + `${anzahl} Freelancer buchen auf dieses Projekt, aber es ist kein Timesheet-Zugang hinterlegt. `
            + `Position weggelassen – bitte im Tab "CRM" den Contractor zuordnen.`);
          return;
        }
        // Ohne Timesheet-Zugang lässt sich nicht nach Projekt trennen - dann
        // zählt die Position die Gesamtstunden des Projekts, wie bisher.
        stunden = rateCodes.length > 1 ? 0 : approvedHoursForProjectMonth(pl.linked_project_id, reportMonth);
      }
      const abr = pp ? abrechnungFuer(pp.id, reportMonth) : null;
      // Ohne Stunden gibt es nichts abzurechnen - AUSSER die Position wurde schon
      // fakturiert. Die muss sichtbar bleiben, sonst verschwindet eine gestellte
      // Rechnung spurlos, wenn ihre Stunden nachträglich zurückgezogen werden.
      if (!stunden && !abr) return;
      const k = kunde(cd.kunde_id);
      const payRate = pl.pay_rate || 0;
      const chargeRate = pl.charge_rate || 0;
      // Abrechnungsart berücksichtigen: Pauschale ist ein Festbetrag (Menge 1),
      // beim Tagessatz werden die erfassten Stunden anteilig in Tage umgerechnet
      // (siehe STUNDEN_PRO_TAG) - 9,75 Stunden sind 1,22 Tage.
      let menge = stunden;
      let einheit = 'Hours';
      if (pl.rate_unit === 'pauschale') { menge = 1; einheit = 'Fixed'; }
      else if (pl.rate_unit === 'tag') { menge = round2(stunden / STUNDEN_PRO_TAG); einheit = 'Days'; }
      zeilen.push({
        placementId: pl.id,
        projektEintragId: pp ? pp.id : null,
        kundeName: k ? k.name : 'kein Kunde zugeordnet',
        ohneKunde: !k,
        contractor: cd.contractor || '–',
        projektName: (pp && pp.projekt_name) || '',
        projektNummer: (pp && pp.projekt_nummer) || '',
        placementCode: pl.placement_code || '',
        placementBeschreibung: pl.placement_description || '',
        stunden: round2(stunden),
        menge: round2(menge),
        einheit,
        einheitLabel: einheit === 'Days' ? 'Tage' : (einheit === 'Fixed' ? 'pauschal' : 'Std.'),
        payRate, chargeRate,
        totalPay: round2(menge * payRate),
        totalCharge: round2(menge * chargeRate),
        consultants: [pl.consultant1_id, pl.consultant2_id].filter(Boolean).map(consultantName).join(' / '),
        poReferenz: pl.po_referenz || '',
        poPfad: pl.po_pdf_path || '',
        poDatei: pl.po_pdf_filename || '',
        abr,
      });
    });
    });
  });
  zeilen.sort((a, b) => a.kundeName.localeCompare(b.kundeName)
    || a.contractor.localeCompare(b.contractor)
    || a.projektNummer.localeCompare(b.projektNummer));
  return { zeilen, warnungen };
}

// Vermerk setzen: Placement X ist für Monat Y an den Kunden fakturiert.
// Stunden und Betrag werden als Momentaufnahme mitgespeichert (siehe
// sql/26_migration_abrechnungen.sql).
async function markiereAbgerechnet(projektEintragId) {
  const z = reportZeilen().zeilen.find(x => x.projektEintragId === projektEintragId);
  if (!z) return;
  const nr = prompt(`Rechnungsnummer für ${z.contractor} (${monthLabel(reportMonth)})?\n\nKann leer bleiben.`, '');
  if (nr === null) return; // abgebrochen
  const eintrag = {
    placement_projekt_id: projektEintragId, placement_id: z.placementId, month: reportMonth,
    rechnungsnummer: nr.trim() || null,
    stunden: z.stunden, betrag: z.totalCharge,
    abgerechnet_am: new Date().toISOString(),
    abgerechnet_von: session && session.user ? session.user.email : null,
  };
  if (!await save(sb.from('abrechnungen').upsert(eintrag, { onConflict: 'placement_projekt_id,month' }), 'Abrechnung vermerken')) return;
  await loadAll();
}

// Sammelvermerk für einen Kunden - eine Kundenrechnung enthält in der Regel alle
// seine Positionen des Monats. Nur bei ausgewähltem Kunden angeboten, damit nicht
// versehentlich mehrere Rechnungen auf einmal als gestellt gelten.
async function markiereAlleAbgerechnet() {
  const offen = reportZeilen().zeilen.filter(z => !z.abr);
  if (!offen.length) return;
  const gesamt = offen.reduce((s, z) => s + z.totalCharge, 0);
  if (!confirm(`${offen.length} Position(en) über insgesamt ${fmtEUR2(gesamt)} für ${monthLabel(reportMonth)} als abgerechnet markieren?`)) return;
  const nr = prompt('Rechnungsnummer (gilt für alle Positionen, kann leer bleiben)', '');
  if (nr === null) return;
  const jetzt = new Date().toISOString();
  const eintraege = offen.map(z => ({
    placement_projekt_id: z.projektEintragId, placement_id: z.placementId, month: reportMonth,
    rechnungsnummer: nr.trim() || null,
    stunden: z.stunden, betrag: z.totalCharge,
    abgerechnet_am: jetzt,
    abgerechnet_von: session && session.user ? session.user.email : null,
  }));
  if (!await save(sb.from('abrechnungen').upsert(eintraege, { onConflict: 'placement_projekt_id,month' }), 'Abrechnungen vermerken')) return;
  await loadAll();
}

async function abrechnungZuruecknehmen(projektEintragId) {
  const abr = abrechnungFuer(projektEintragId, reportMonth);
  if (!abr) return;
  if (!confirm(`Vermerk "abgerechnet" für ${monthLabel(reportMonth)} entfernen? Die Position gilt danach wieder als offen.`)) return;
  if (!await save(sb.from('abrechnungen').delete().eq('id', abr.id), 'Abrechnung zurücknehmen')) return;
  await loadAll();
}

// Excel-Datei im Aufbau des bisherigen TimesheetPortal-Reports. Exportiert genau
// das, was in der Tabelle steht - inklusive gesetztem Kunden- und Offen-Filter.
function generateKundenReport() {
  if (typeof XLSX === 'undefined') { alert('Die Excel-Bibliothek konnte nicht geladen werden (CDN/Internetverbindung prüfen).'); return; }
  const { zeilen, warnungen } = reportZeilen();
  const sichtbar = reportNurOffen ? zeilen.filter(z => !z.abr) : zeilen;
  // Weggelassene Positionen IMMER melden, bevor die Datei entsteht. Ein Report,
  // dem stillschweigend Zeilen fehlen, ist schlimmer als gar keiner - er sieht
  // vollständig aus und geht so an den Kunden.
  if (warnungen.length) {
    const weiter = confirm(`${warnungen.length} Position(en) konnten nicht sicher berechnet werden und fehlen im Report:\n\n`
      + warnungen.map(w => '• ' + w).join('\n\n')
      + `\n\nTrotzdem herunterladen? Der Report ist dann unvollständig.`);
    if (!weiter) return;
  }
  if (!sichtbar.length) { alert('Keine Positionen für diesen Monat.'); return; }
  const rows = sichtbar.map(z => ({
    'Placement code': z.placementCode,
    'Contractor name': z.contractor,
    'Client name': z.ohneKunde ? '' : z.kundeName,
    'Placement description': z.placementBeschreibung,
    'Work quantity': z.menge,
    // Spaltennamen bleiben englisch wie im bisherigen Timesheet-Portal-Export -
    // die Datei geht so an den Kunden und soll dort wiedererkannt werden.
    'Rate code': z.projektNummer,
    'Rate description': z.projektName,
    'Units': z.einheit,
    'Pay rate': z.payRate,
    'Total pay': z.totalPay,
    'Charge rate': z.chargeRate,
    'Total charge': z.totalCharge,
    'Margin rate': round2(z.chargeRate - z.payRate),
    'Total margin': round2(z.totalCharge - z.totalPay),
    'Placement consultant': z.consultants,
    'Placement PO': z.poReferenz,
    'Abgerechnet am': z.abr ? String(z.abr.abgerechnet_am || '').slice(0, 10) : '',
    'Rechnungsnummer': z.abr ? (z.abr.rechnungsnummer || '') : '',
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Report');
  const gewaehlterKunde = reportKundeId ? kunde(reportKundeId) : null;
  const kundeSlug = (gewaehlterKunde ? gewaehlterKunde.name : 'Alle_Kunden').replace(/[^a-z0-9]+/gi, '_');
  XLSX.writeFile(wb, `Report_${kundeSlug}_${reportMonth}.xlsx`);
}

function blankPlacement() {
  return {
    id: null, _tempId: 'new-' + Math.random().toString(36).slice(2),
    status: 'Entwurf',
    // Mindestens ein Projekt - eine Vereinbarung ohne Projekt gibt es nicht.
    projekte: [blankPlacementProjekt()],
    rate_unit: 'stunde', projekttyp: 'contract', rechnungsname: '',
    start_date: '', end_date: '', wochenstunden: 40, pay_rate: 0, charge_rate: 0,
    deal_value: '', amount_ordered_hours: '', consultant1_id: '', consultant2_id: '',
    payment_terms: '', placement_code: '', placement_description: '',
    po_empfaenger: '', po_betrag: '', po_stunden_gesamt: '', po_referenz: '',
    po_pdf_path: null, po_pdf_filename: null,
    kunde_override_name: '', kunde_override_email: '', kunde_override_vat_id: '', kunde_override_adresse: '',
    contractor_invoice_email: '',
  };
}
function placementKey(pl) { return pl.id || pl._tempId; }

// Summe der freigegebenen (approved) Timesheet-Stunden eines Projekts, egal in welchem Monat -
// Basis für den "Abrechnungsstand" (abgerechnete Stunden gegen PO) am Placement.
function approvedHoursForProject(projectId) {
  return stundenIndex().proProjekt.get(projectId) || 0;
}

function openCandidateModal(id) {
  const cd = id ? candidate(id) : null;
  // Kopien, damit "Abbrechen" nichts hinterlässt. Die Projekte hängen
  // als eigene Liste am Placement (Migration 27); hat ein Placement noch keinen
  // Eintrag (Migration noch nicht gelaufen), wird einer aus den Altfeldern gebaut.
  const existing = id ? placementsOf(id).map(sp => {
    const kopie = { ...sp };
    const eigene = projekteVon(sp.id).map(pp => ({ ...pp }));
    kopie.projekte = eigene.length ? eigene : [Object.assign(blankPlacementProjekt(), {
      projekt_name: sp.projekt_name || '', projekt_nummer: sp.projekt_nummer || '',
    })];
    return kopie;
  }) : [];
  modalConfig = {
    type: 'candidate', id: id || null,
    values: cd ? { ...cd } : { org: activeOrg, contractor: '', freelancer_email: '', vat_id: '', kunde: '', kunde_id: '', status: 'Aktiv' },
    placements: existing.length ? existing : [blankPlacement()],
    advancedOpen: new Set(),
  };
  render();
}

// Liest die aktuellen Werte aller Placement-Karten aus dem DOM zurück in modalConfig.placements -
// muss vor jedem Re-Render (Karte hinzufügen/entfernen/Erweitert-Toggle) aufgerufen werden, sonst
// gingen bereits eingetragene Werte in anderen Karten verloren.
function syncPlacementsFromDOM(c) {
  const isPeax = activeOrg === 'peax';
  c.placements.forEach(pl => {
    const k = placementKey(pl);
    const el = id => document.getElementById(id + '_' + k);
    const artEl = el('pl_art');
    if (!artEl) return; // Karte nicht (mehr) im DOM - unverändert lassen
    (pl.projekte || []).forEach(pp => {
      const nEl = document.getElementById('pp_name_' + ppKey(pp));
      const nrEl = document.getElementById('pp_nummer_' + ppKey(pp));
      if (!nEl || !nrEl) return;
      pp.projekt_name = nEl.value.trim();
      pp.projekt_nummer = nrEl.value.trim();
    });
    const isPerm = artEl.value === 'perm';
    pl.projekttyp = isPerm ? 'perm' : 'contract';
    pl.rate_unit = el('pl_rateunit').value;
    pl.rechnungsname = el('pl_rechnungsname').value.trim() || null;
    pl.start_date = el('pl_start').value || null;
    pl.end_date = el('pl_ende').value || (isPerm ? pl.start_date : null);
    pl.pay_rate = Number(el('pl_payrate').value) || 0;
    pl.charge_rate = Number(el('pl_chargerate').value) || 0;
    pl.consultant1_id = el('pl_consultant1').value || null;
    pl.consultant2_id = el('pl_consultant2').value || null;
    if (isPeax) {
      const amountEl = el('pl_amountordered'), dealEl = el('pl_dealvalue');
      pl.amount_ordered_hours = amountEl && amountEl.value !== '' ? Number(amountEl.value) : null;
      pl.deal_value = dealEl && dealEl.value !== '' ? Number(dealEl.value) : null;
      pl.wochenstunden = 0;
    } else {
      const wochenEl = el('pl_wochenstunden');
      pl.wochenstunden = isPerm ? 0 : (wochenEl ? Number(wochenEl.value) || 0 : 0);
    }
    pl.placement_code = el('pl_code').value.trim() || null;
    pl.placement_description = el('pl_description').value.trim() || null;
    pl.payment_terms = el('pl_paymentterms').value.trim() || null;
    pl.po_empfaenger = el('pl_poempfaenger').value.trim() || null;
    pl.po_betrag = el('pl_pobetrag').value !== '' ? Number(el('pl_pobetrag').value) : null;
    pl.po_stunden_gesamt = el('pl_postunden').value !== '' ? Number(el('pl_postunden').value) : null;
    pl.po_referenz = el('pl_poreferenz').value.trim() || null;
    pl.kunde_override_name = el('pl_kov_name').value.trim() || null;
    pl.kunde_override_email = el('pl_kov_email').value.trim() || null;
    pl.kunde_override_vat_id = el('pl_kov_vat').value.trim() || null;
    pl.kunde_override_adresse = el('pl_kov_adresse').value.trim() || null;
    pl.contractor_invoice_email = el('pl_civemail').value.trim() || null;
  });
}

async function uploadPlacementPO(placementId, file) {
  if (!file) return;
  if (file.type !== 'application/pdf') { alert('Bitte eine PDF-Datei hochladen.'); return; }
  const path = `${activeOrg}/${placementId}/${Date.now()}_${file.name}`;
  const { error } = await sb.storage.from('placement-pos').upload(path, file, { upsert: true });
  if (error) { alert('Upload fehlgeschlagen: ' + error.message); return; }
  if (!await save(sb.from('placements').update({ po_pdf_path: path, po_pdf_filename: file.name }).eq('id', placementId), 'PO-Datei verknüpfen')) return;
  await loadAll();
}

async function viewPlacementPO(path) {
  const { data: signed, error } = await sb.storage.from('placement-pos').createSignedUrl(path, 3600);
  if (error || !signed) { alert('PDF konnte nicht geöffnet werden: ' + (error ? error.message : 'unbekannter Fehler')); return; }
  window.open(signed.signedUrl, '_blank');
}

        <button class="btn primary" id="modalSaveCandidate">Speichern</button>

  c.placements.forEach(pl => {
    const k = placementKey(pl);
