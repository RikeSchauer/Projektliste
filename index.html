<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projektliste – Freelancer Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f6fb; --card: #ffffff; --border: #e3e7ef; --text: #1f2430; --muted: #6b7280;
    --blue: #2563eb; --blue-bg: #eaf0fe;
    --teal: #0d9488; --teal-bg: #e6f7f5;
    --purple: #7c3aed; --purple-bg: #f2ebfe;
    --amber: #b45309; --amber-bg: #fef3e2;
    --green: #15803d; --green-bg: #e8f7ec;
    --red: #b91c1c; --red-bg: #fdeaea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  #app { max-width: 1900px; margin: 0 auto; padding: 20px 24px 60px; }
  header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .userbar { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  nav.tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  nav.tabs button { background: none; border: none; padding: 10px 16px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav.tabs button.active { color: var(--blue); border-bottom-color: var(--blue); }
  nav.tabs button:hover { color: var(--text); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(20,20,43,.03); }
  .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
  @media (max-width: 900px) { .grid-kpi { grid-template-columns: repeat(2, 1fr); } }
  .kpi { border-radius: 12px; padding: 14px 16px; border: 1px solid var(--border); }
  .kpi .label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .kpi .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .kpi .hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .kpi.blue { background: var(--blue-bg); } .kpi.blue .value { color: var(--blue); }
  .kpi.teal { background: var(--teal-bg); } .kpi.teal .value { color: var(--teal); }
  .kpi.purple { background: var(--purple-bg); } .kpi.purple .value { color: var(--purple); }
  .kpi.amber { background: var(--amber-bg); } .kpi.amber .value { color: var(--amber); }
  section.panel { margin-bottom: 22px; }
  section.panel h2 { font-size: 15px; margin: 0 0 12px; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
  tbody tr:hover { background: #fafbff; }
  table.projekte-table { font-size: 12.5px; }
  table.projekte-table th, table.projekte-table td { padding: 7px 8px; }
  table.projekte-table th:last-child, table.projekte-table td:last-child {
    position: sticky; right: 0; background: var(--card); box-shadow: -6px 0 6px -6px rgba(0,0,0,.12);
  }
  table.projekte-table tbody tr:hover td:last-child { background: #fafbff; }
  tr.inactive { opacity: .4; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .badge.Gut { background: var(--green-bg); color: var(--green); }
  .badge.Achtung { background: var(--amber-bg); color: var(--amber); }
  .badge.Kritisch { background: var(--red-bg); color: var(--red); }
  .badge.Aktiv { background: var(--green-bg); color: var(--green); }
  .badge.Pausiert { background: var(--amber-bg); color: var(--amber); }
  .badge.Beendet { background: #eee; color: #666; }
  .badge.Bevorstehend { background: var(--purple-bg); color: var(--purple); }
  .badge.Perm { background: var(--blue-bg); color: var(--blue); }
  .badge.Contract { background: #eee; color: #666; }
  .mini-badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; margin-left: 6px; vertical-align: middle; }
  .mini-badge.auto { background: var(--green-bg); color: var(--green); }
  .mini-badge.manuell { background: var(--amber-bg); color: var(--amber); }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar-filters { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: nowrap; }
  .toolbar-filters > * { flex: 0 0 auto; }
  .toolbar-filters label { white-space: nowrap; }
  .toolbar-filters select { padding: 7px 6px; }
  .toolbar-filters input[type=month] { padding: 7px 6px; }
  select, input[type=text], input[type=number], input[type=date], input[type=month], input[type=email], input[type=password] {
    font-size: 13px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text);
  }
  input.num-cell { width: 90px; padding: 5px 7px; }
  button.btn { font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; color: var(--text); }
  button.btn:hover { background: #f2f4f9; }
  button.btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  button.btn.primary:hover { background: #1d4ed8; }
  button.btn.danger { color: var(--red); }
  button.link { background: none; border: none; color: var(--blue); font-size: 12.5px; cursor: pointer; padding: 2px 4px; font-weight: 600; }
  button.link.danger { color: var(--red); }
  .chart-wrap { position: relative; height: 280px; }
  .overlay { position: fixed; inset: 0; background: rgba(20,20,43,.35); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-radius: 14px; padding: 22px 24px; width: 460px; max-width: 92vw; max-height: 88vh; overflow: auto; }
  .modal h3 { margin: 0 0 14px; font-size: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select { width: 100%; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .empty { color: var(--muted); font-size: 13px; padding: 18px 0; text-align: center; }
  footer.hint { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 24px; }
  .auth-wrap { max-width: 380px; margin: 80px auto; }
  .auth-wrap h1 { text-align: center; margin-bottom: 4px; }
  .auth-wrap p.sub { text-align: center; margin-bottom: 20px; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .auth-tabs button { flex: 1; }
  .banner { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
  .banner.error { background: var(--red-bg); color: var(--red); }
  .banner.info { background: var(--blue-bg); color: var(--blue); }
  @media print {
    header.top, nav.tabs, footer.hint, .no-print { display: none !important; }
    body { background: #fff; }
    #app { max-width: none; padding: 0; }
    .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
  }
</style>
</head>

<div id="app"></div>

<!-- Chart.js -->

<script>
/* ============================================================
   Supabase-Zugangsdaten
   ============================================================ */
const SUPABASE_URL = 'https://uevefmvbpznvuvhvkdwl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVldmVmbXZicHpudnV2aHZrZHdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMjUzMTYsImV4cCI6MjEwMDgwMTMxNn0.ewGSI6UcXpInCL1z9VTqcqsGxBPd5Aqt4YUMulrml5E';
/* ============================================================ */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MONTH_NAMES = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MONTH_NAMES_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];

let session = null;
let authMode = 'login'; // 'login' | 'signup'
let authError = '';
let authInfo = '';
let authBusy = false;

let data = { projects: [], entries: [], consultants: [], ki_vorschlaege: [] };
let activeTab = 'dashboard';
let dashMonth = 'all';
let sollMonth = currentMonthStr();
let istMonth = currentMonthStr();
let provMonth = currentMonthStr();
let trendChart = null;
let trendShow = { umsatz: true, kosten: true, rohertrag: true }; // steuert, welche Linien im Monatstrend gezeigt werden
let kundeChart = null;
// Feste Farbfolge für das Kunden-Tortendiagramm (wird bei mehr Kunden als Farben zyklisch wiederverwendet).
const PIE_COLORS = ['#2563eb', '#0d9488', '#7c3aed', '#b45309', '#15803d', '#b91c1c', '#db2777', '#0891b2', '#65a30d', '#9333ea', '#ea580c', '#0284c7'];
let modalConfig = null;
let realtimeChannel = null;
let reportConfig = null; // { consultantId } – wenn gesetzt, wird im Provisionen-Tab die Abrechnung statt der Übersicht gezeigt
let projFilterKunde = 'all';
let projFilterStatus = 'all';
let projFilterArt = 'all'; // 'all' | 'contract' | 'perm'
let projFilterStartMonat = ''; // 'YYYY-MM' oder '' = kein Filter
let projFilterEndeMonat = ''; // 'YYYY-MM' oder '' = kein Filter
let projSearch = ''; // Freitext-Suche über alle Spalten der Projekte-Tabelle (wie in Excel)
let projSort = 'kunde'; // 'kunde' | 'start_asc' | 'start_desc' | 'end_asc' | 'end_desc'
// Excel-artige Suche & Filter für SOLL- und IST-Tabellen, jeweils getrennt pro Kind ('soll'/'ist').
let entrySearch = { soll: '', ist: '' };
let entryFilterKunde = { soll: 'all', ist: 'all' };
let entryFilterArt = { soll: 'all', ist: 'all' };
let entryFilterStatus = { soll: 'all', ist: 'all' };
let kiFilterStatus = 'pending'; // 'pending' | 'approved' | 'rejected' | 'all' – Filter im Tab "KI-Vorschläge"

function currentMonthStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function fmtEUR(n) { return (n || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }); }
function fmtNum(n, digits) { return (n || 0).toLocaleString('de-DE', { maximumFractionDigits: digits ?? 1 }); }
function fmtPct(n) { return ((n || 0) * 100).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + '%'; }
function fmtDate(s) { if (!s) return '–'; const [y,m,d] = s.split('-'); return `${d}.${m}.${y}`; }

function project(id) { return data.projects.find(p => p.id === id); }
function margeH(p) { return (p.charge_h || 0) - (p.pay_h || 0); }
function margePct(p) { return p.charge_h ? margeH(p) / p.charge_h : 0; }

function isActiveInMonth(p, monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  const monthStart = new Date(y, m - 1, 1);
  const monthEnd = new Date(y, m, 0);
  const start = p.start_date ? new Date(p.start_date) : null;
  const ende = p.end_date ? new Date(p.end_date) : null;
  if (start && start > monthEnd) return false;
  if (ende && ende < monthStart) return false;
  return true;
}

function computedStatus(p) {
  if (p.status === 'Pausiert') return 'Pausiert';
  const today = new Date();
  const todayUTC = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
  const ps = parseDateUTC(p.start_date);
  const pe = parseDateUTC(p.end_date);
  if (ps !== null && ps > todayUTC) return 'Noch nicht aktiv';
  if (pe !== null && pe < todayUTC) return 'Beendet';
  return 'Aktiv';
}
function statusBadgeClass(status) { return status === 'Noch nicht aktiv' ? 'Bevorstehend' : status; }

// ---------- AUTOMATISCHE SOLL-BERECHNUNG (aus Projektlaufzeit) ----------

function round1(n) { return Math.round((n || 0) * 10) / 10; }
function parseDateUTC(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function daysInclusive(a, b) { return Math.round((b - a) / 86400000) + 1; }
function monthRangeUTC(monthStr) { const [y, m] = monthStr.split('-').map(Number); return [Date.UTC(y, m - 1, 1), Date.UTC(y, m, 0)]; }

function projectTotalSollHours(p) {
  if (p.projekttyp === 'perm') return p.start_date ? 1 : 0;
  const ps = parseDateUTC(p.start_date), pe = parseDateUTC(p.end_date);
  if (ps === null || pe === null || pe < ps) return 0;
  return round1((p.wochenstunden || 0) * daysInclusive(ps, pe) / 7);
}

function projectMonthSollHours(p, monthStr) {
  if (p.projekttyp === 'perm') {
    return (p.start_date && p.start_date.slice(0, 7) === monthStr) ? 1 : 0;
  }
  const ps = parseDateUTC(p.start_date), pe = parseDateUTC(p.end_date);
  if (ps === null || pe === null) return 0;
  const [ms, me] = monthRangeUTC(monthStr);
  const os = Math.max(ps, ms), oe = Math.min(pe, me);
  if (os > oe) return 0;
  return round1((p.wochenstunden || 0) * daysInclusive(os, oe) / 7);
}

function monthListForProject(p) {
  if (p.projekttyp === 'perm') return p.start_date ? [p.start_date.slice(0, 7)] : [];
  if (!p.start_date || !p.end_date) return [];
  const [sy, sm] = p.start_date.split('-').map(Number);
  const [ey, em] = p.end_date.split('-').map(Number);
  const out = []; let y = sy, m = sm, guard = 0;
  while ((y < ey || (y === ey && m <= em)) && guard < 240) {
    out.push(y + '-' + String(m).padStart(2, '0'));
    m++; if (m > 12) { m = 1; y++; }
    guard++;
  }
  return out;
}

async function syncAutoSoll(proj) {
  const months = monthListForProject(proj);
  const monthSet = new Set(months);
  const existing = data.entries.filter(e => e.project_id === proj.id && e.kind === 'soll');

  for (const m of months) {
    const hours = projectMonthSollHours(proj, m);
    const ex = existing.find(e => e.month === m);
    if (!ex) {
      await sb.from('entries').insert({ project_id: proj.id, kind: 'soll', month: m, stunden: hours, auto: true });
    } else if (ex.auto && Math.abs((ex.stunden || 0) - hours) > 0.05) {
      await sb.from('entries').update({ stunden: hours }).eq('id', ex.id);
    }
  }
  const stale = existing.filter(e => e.auto && !monthSet.has(e.month));
  for (const e of stale) {
    await sb.from('entries').delete().eq('id', e.id);
  }
  await loadAll();
}

async function recalcAllSoll() {
  for (const p of data.projects) {
    await syncAutoSoll(p);
  }
}

function computeEntry(e) {
  const p = project(e.project_id);
  const chargeH = p ? p.charge_h : 0;
  const payH = p ? p.pay_h : 0;
  const stunden = e.stunden || 0;
  const umsatz = stunden * chargeH;
  const kosten = stunden * payH;
  return { stunden, umsatz, kosten, rohertrag: umsatz - kosten };
}
function sumEntries(list) {
  return list.reduce((acc, e) => {
    const c = computeEntry(e);
    acc.stunden += c.stunden; acc.umsatz += c.umsatz; acc.kosten += c.kosten; acc.rohertrag += c.rohertrag;
    return acc;
  }, { stunden: 0, umsatz: 0, kosten: 0, rohertrag: 0 });
}
function entriesOf(kind) { return data.entries.filter(e => e.kind === kind); }

function customerBreakdown(sollEntries, istEntries) {
  const kunden = Array.from(new Set(data.projects.map(p => p.kunde))).sort();
  return kunden.map(k => {
    const projectIds = new Set(data.projects.filter(p => p.kunde === k).map(p => p.id));
    const soll = sumEntries(sollEntries.filter(e => projectIds.has(e.project_id)));
    const ist = sumEntries(istEntries.filter(e => projectIds.has(e.project_id)));
    return {
      kunde: k,
      sollUmsatz: soll.umsatz, istUmsatz: ist.umsatz,
      sollKosten: soll.kosten, istKosten: ist.kosten,
      sollRohertrag: soll.rohertrag, istRohertrag: ist.rohertrag,
    };
  });
}
function allMonthsUsed() {
  const set = new Set();
  data.entries.forEach(e => set.add(e.month));
  set.add(currentMonthStr());
  return Array.from(set).sort();
}
function statusFromErf(erf, hasSoll) {
  if (!hasSoll) return null;
  if (erf >= 0.9) return 'Gut';
  if (erf >= 0.8) return 'Achtung';
  return 'Kritisch';
}
function monthLabel(m) { const [y, mo] = m.split('-').map(Number); return MONTH_NAMES[mo - 1] + ' ' + y; }
function monthLabelEN(m) { const [y, mo] = m.split('-').map(Number); return MONTH_NAMES_EN[mo - 1] + ' ' + y; }

// ---------- PROVISIONEN ----------

function consultant(id) { return data.consultants.find(c => c.id === id); }
function consultantName(id) { const c = consultant(id); return c ? c.name : '–'; }

function consultantShareForProject(p, consultantId) {
  const c1 = p.consultant1_id, c2 = p.consultant2_id;
  const involved = c1 === consultantId || c2 === consultantId;
  if (!involved) return 0;
  if (c1 && c2 && c1 !== c2) return 0.5;
  return 1;
}

function attributedRevenue(consultantId, entries) {
  let total = 0;
  for (const e of entries) {
    const p = project(e.project_id);
    if (!p) continue;
    const share = consultantShareForProject(p, consultantId);
    if (share > 0) total += computeEntry(e).rohertrag * share;
  }
  return total;
}

function quarterOfMonth(monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  const q = Math.floor((m - 1) / 3) + 1;
  return { year: y, quarter: q };
}
function monthsInQuarter(year, quarter) {
  const startM = (quarter - 1) * 3 + 1;
  return [0, 1, 2].map(i => year + '-' + String(startM + i).padStart(2, '0'));
}
function quarterLabel(year, quarter) { return 'Q' + quarter + ' ' + year; }

function projectRowsForConsultant(consultantId, entries) {
  const rows = [];
  for (const e of entries) {
    const p = project(e.project_id);
    if (!p) continue;
    const share = consultantShareForProject(p, consultantId);
    if (share <= 0) continue;
    const c = computeEntry(e);
    rows.push({
      month: e.month, kunde: p.kunde, contractor: p.contractor,
      stunden: c.stunden, rohertragVoll: c.rohertrag, share, rohertragAnteil: c.rohertrag * share,
    });
  }
  return rows.sort((a, b) => a.month === b.month ? a.kunde.localeCompare(b.kunde) : a.month.localeCompare(b.month));
}

function consultantReportHTML() {
  const c = consultant(reportConfig.consultantId);
  if (!c) { reportConfig = null; return provisionenHTML(); }
  const istAll = entriesOf('ist');
  const monthEntries = istAll.filter(e => e.month === provMonth);
  const { year: qYear, quarter: qNum } = quarterOfMonth(provMonth);
  const qMonths = monthsInQuarter(qYear, qNum);
  const qEntries = istAll.filter(e => qMonths.includes(e.month));

  const actions = `
    <div class="toolbar no-print" style="justify-content:space-between;">
      <button class="btn" data-report-back="1">← Back to overview</button>
      <button class="btn primary" data-report-print="1">Print / Save as PDF</button>
    </div>`;

  if (!c.is_team_lead) {
    const rows = projectRowsForConsultant(c.id, monthEntries);
    const total = rows.reduce((s, r) => s + r.rohertragAnteil, 0);
    const commission = total * (c.rate || 0);
    return `
      <div class="card panel">
        ${actions}
        <h2 style="margin-bottom:2px;">Commission Statement – ${c.name}</h2>
        <div class="sub" style="margin-bottom:16px;">${monthLabelEN(provMonth)} · Rate ${fmtPct(c.rate)} on attributed actual gross profit</div>
        ${!rows.length ? '<div class="empty">No projects/actual hours this month.</div>' : `
        <div class="table-scroll">
        <table>
          <thead><tr><th>Client</th><th>Freelancer</th><th>Share</th><th>Actual Hours</th><th>Gross Profit (100%)</th><th>Attributed Gross Profit</th></tr></thead>
          <tbody>
            ${rows.map(r => `<tr>
              <td>${r.kunde}</td>
              <td>${r.contractor}</td>
              <td>${fmtPct(r.share)}</td>
              <td>${fmtNum(r.stunden, 1)}</td>
              <td>${fmtEUR(r.rohertragVoll)}</td>
              <td>${fmtEUR(r.rohertragAnteil)}</td>
            </tr>`).join('')}
          </tbody>
          <tfoot>
            <tr style="font-weight:700;"><td colspan="5">Total Attributed Gross Profit</td><td>${fmtEUR(total)}</td></tr>
            <tr style="font-weight:700;color:var(--blue);"><td colspan="5">Commission (${fmtPct(c.rate)})</td><td>${fmtEUR(commission)}</td></tr>
          </tfoot>
        </table>
        </div>`}
      </div>
    `;
  }

  const members = data.consultants.filter(m => m.team_lead_id === c.id);
  let teamTotal = 0;
  const memberBlocks = members.map(m => {
    const rows = projectRowsForConsultant(m.id, qEntries);
    const subtotal = rows.reduce((s, r) => s + r.rohertragAnteil, 0);
    teamTotal += subtotal;
    return `
      <h3 style="font-size:13.5px;margin:16px 0 8px;">${m.name}</h3>

function openConsultantModal(id) {
  const c = id ? consultant(id) : null;

function renderConsultantModal(c) {
  const v = c.values;
  const otherConsultants = data.consultants.filter(x => x.id !== c.id);
  const overlay = document.createElement('div');

  overlay.innerHTML = `
    <div class="modal">

        <div class="field"><label>Teil von Team (optional)</label>
          <select id="cf_team_lead_id">
            <option value="">– kein Team –</option>
            ${otherConsultants.filter(x => x.is_team_lead).map(x => `<option value="${x.id}" ${v.team_lead_id === x.id ? 'selected' : ''}>${x.name}</option>`).join('')}

      </div>
      <div class="field-row">
        <div class="field"><label>Ist Team-Lead?</label>
          <select id="cf_is_team_lead">

            <option value="true" ${v.is_team_lead ? 'selected' : ''}>Ja</option>
          </select>
        </div>
        <div class="field"><label>Team-Satz (quartalsweise, nur falls Team-Lead)</label><input type="number" step="0.01" id="cf_team_rate" value="${v.team_rate}"></div>
      </div>
      <div class="modal-actions">
        ${c.id ? '<button class="btn danger" id="modalDeleteConsultant">Löschen</button>' : ''}
        <button class="btn" id="modalCancelConsultant">Abbrechen</button>
        <button class="btn primary" id="modalSaveConsultant">Speichern</button>
      </div>
    </div>`;
  document.getElementById('app').appendChild(overlay);
  document.getElementById('modalCancelConsultant').addEventListener('click', () => { modalConfig = null; render(); });
  if (c.id) document.getElementById('modalDeleteConsultant').addEventListener('click', () => deleteConsultant(c.id));
  document.getElementById('modalSaveConsultant').addEventListener('click', async () => {
    const payload = {
      name: document.getElementById('cf_name').value.trim(),
      rate: Number(document.getElementById('cf_rate').value) || 0,
      is_team_lead: document.getElementById('cf_is_team_lead').value === 'true',
      team_rate: Number(document.getElementById('cf_team_rate').value) || 0,
      team_lead_id: document.getElementById('cf_team_lead_id').value || null,
    };
    if (c.id) await sb.from('consultants').update(payload).eq('id', c.id);
    else await sb.from('consultants').insert(payload);
    modalConfig = null;
    await loadAll();
  });
}

async function deleteConsultant(id) {
  if (!confirm('Consultant löschen? Zuweisungen an Projekten werden dabei entfernt (nicht die Projekte selbst).')) return;
  await sb.from('consultants').delete().eq('id', id);
  modalConfig = null;
  await loadAll();
}

// ---------- DATA LOADING ----------

async function loadAll() {
  const [{ data: projects, error: e1 }, { data: entries, error: e2 }, { data: consultants, error: e3 }, { data: kiVorschlaege, error: e4 }] = await Promise.all([
    sb.from('projects').select('*').order('created_at'),
    sb.from('entries').select('*'),
    sb.from('consultants').select('*').order('created_at'),
    sb.from('ki_vorschlaege').select('*').order('created_at', { ascending: false }),
  ]);
  if (e1 || e2 || e3) {
    console.error('load error', e1, e2, e3);
    renderError((e1 || e2 || e3).message);
    return;
  }
  if (e4) console.warn('ki_vorschlaege konnte nicht geladen werden (Migration ausgeführt?)', e4);
  data.projects = projects || [];
  data.entries = entries || [];
  data.consultants = consultants || [];
  data.ki_vorschlaege = kiVorschlaege || [];
  render();
}

function subscribeRealtime() {
  if (realtimeChannel) return;
  realtimeChannel = sb.channel('public:all-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'projects' }, () => loadAll())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'entries' }, () => loadAll())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'consultants' }, () => loadAll())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'ki_vorschlaege' }, () => loadAll())
    .subscribe();
}

// ---------- AUTH ----------

async function handleLogin(email, password) {
  authBusy = true; authError = ''; renderAuth();
  const { error } = await sb.auth.signInWithPassword({ email, password });
  authBusy = false;
  if (error) { authError = error.message; renderAuth(); }
}
const ALLOWED_EMAIL_DOMAIN = 'konzepthaus-consulting.com';
function isAllowedEmail(email) {
  return (email || '').toLowerCase().trim().endsWith('@' + ALLOWED_EMAIL_DOMAIN);
}

async function handleSignup(email, password) {
  authError = ''; authInfo = '';
  if (!isAllowedEmail(email)) {
    authError = `Registrierung ist nur mit einer @${ALLOWED_EMAIL_DOMAIN} E-Mail-Adresse möglich.`;
    renderAuth();
    return;
  }
  authBusy = true; renderAuth();
  const { data: res, error } = await sb.auth.signUp({ email, password });
  authBusy = false;
  if (error) { authError = error.message; renderAuth(); return; }
  if (res.session) return;
  authInfo = 'Konto erstellt. Falls E-Mail-Bestätigung aktiviert ist, bitte den Link in deinem Postfach öffnen und dich danach anmelden.';
  authMode = 'login';
  renderAuth();
}
async function handleLogout() {
  await sb.auth.signOut();
}

// ---------- RENDER: AUTH SCREEN ----------

function renderAuth() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="auth-wrap">
      <h1>Projektliste</h1>
      <p class="sub">Freelancer-Dashboard – gemeinsam bearbeitet</p>
      <div class="card">
        <div class="auth-tabs">
          <button class="btn ${authMode === 'login' ? 'primary' : ''}" id="tabLogin">Anmelden</button>
          <button class="btn ${authMode === 'signup' ? 'primary' : ''}" id="tabSignup">Registrieren</button>
        </div>
        ${authError ? `<div class="banner error">${authError}</div>` : ''}
        ${authInfo ? `<div class="banner info">${authInfo}</div>` : ''}
        <div class="field"><label>E-Mail</label><input type="email" id="authEmail"></div>
        <div class="field"><label>Passwort</label><input type="password" id="authPassword"></div>
        <button class="btn primary" id="authSubmit" style="width:100%;" ${authBusy ? 'disabled' : ''}>
          ${authBusy ? '…' : (authMode === 'login' ? 'Anmelden' : 'Konto erstellen')}
        </button>
      </div>
    </div>
  `;
  document.getElementById('tabLogin').addEventListener('click', () => { authMode = 'login'; authError=''; authInfo=''; renderAuth(); });
  document.getElementById('tabSignup').addEventListener('click', () => { authMode = 'signup'; authError=''; authInfo=''; renderAuth(); });
  document.getElementById('authSubmit').addEventListener('click', () => {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!email || !password) { authError = 'Bitte E-Mail und Passwort ausfüllen.'; renderAuth(); return; }
    if (authMode === 'login') handleLogin(email, password); else handleSignup(email, password);
  });
}

function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="auth-wrap">
      <div class="banner error">
        Verbindung zur Datenbank fehlgeschlagen: ${msg}<br><br>
        Prüfe, ob SUPABASE_URL und SUPABASE_ANON_KEY am Anfang der index.html korrekt eingetragen sind
        und ob das SQL-Setup (schema.sql) im Supabase-Projekt ausgeführt wurde.
      </div>
    </div>`;
}

function dashboardHTML() {
  const months = allMonthsUsed();
  const sollAll = entriesOf('soll');
  const istAll = entriesOf('ist');
  const sollEntries = dashMonth === 'all' ? sollAll : sollAll.filter(e => e.month === dashMonth);
  const istEntries = dashMonth === 'all' ? istAll : istAll.filter(e => e.month === dashMonth);
  const soll = sumEntries(sollEntries);
  const ist = sumEntries(istEntries);

  const aktiveFreelancer = data.projects.filter(p => computedStatus(p) === 'Aktiv').length;
  const margenContract = data.projects.filter(p => p.projekttyp !== 'perm').map(margeH).filter(v => v > 0);
  const avgMargeContract = margenContract.length ? margenContract.reduce((a, b) => a + b, 0) / margenContract.length : 0;
  const margenPerm = data.projects.filter(p => p.projekttyp === 'perm').map(margeH).filter(v => v > 0);
  const avgMargePerm = margenPerm.length ? margenPerm.reduce((a, b) => a + b, 0) / margenPerm.length : 0;
  const margeGesamtFaktor = ist.kosten > 0 ? ist.umsatz / ist.kosten : 0;

  const erfStunden = soll.stunden > 0 ? ist.stunden / soll.stunden : 0;
  const erfUmsatz = soll.umsatz > 0 ? ist.umsatz / soll.umsatz : 0;
  const erfRohertrag = soll.rohertrag > 0 ? ist.rohertrag / soll.rohertrag : 0;

  const rows = [
    { label: 'Stunden', soll: soll.stunden, ist: ist.stunden, erf: erfStunden, fmt: v => fmtNum(v, 0) + ' Std.' },
    { label: 'Umsatz', soll: soll.umsatz, ist: ist.umsatz, erf: erfUmsatz, fmt: fmtEUR },
    { label: 'Rohertrag', soll: soll.rohertrag, ist: ist.rohertrag, erf: erfRohertrag, fmt: fmtEUR },
  ];

  const monthOptions = ['<option value="all">Alle Monate</option>']
    .concat(months.map(m => `<option value="${m}" ${dashMonth === m ? 'selected' : ''}>${monthLabel(m)}</option>`)).join('');

  const perKunde = customerBreakdown(sollEntries, istEntries);

      <div class="kpi amber"><div class="label">Ø Marge (Perm)</div><div class="value">${fmtEUR(avgMargePerm)}</div><div class="hint">über alle Perm-Pauschalen &gt; 0</div></div>
      <div class="kpi blue"><div class="label">Umsatz / Kosten-Faktor (IST)</div><div class="value">${fmtNum(margeGesamtFaktor, 2)}×</div><div class="hint">IST-Umsatz ÷ IST-Kosten</div></div>
      <div class="kpi teal"><div class="label">Erfüllung Umsatz</div><div class="value">${fmtPct(erfUmsatz)}</div><div class="hint">IST ÷ SOLL</div></div>
    </div>
    <div class="card panel">
      <h2>SOLL / IST Vergleich</h2>

        <thead><tr><th>Bereich</th><th>SOLL</th><th>IST</th><th>Abweichung</th><th>Erfüllung</th><th>Status</th></tr></thead>
        <tbody>
          ${rows.map(r => {

            return `<tr>
              <td><strong>${r.label}</strong></td>

function setupChart() {
  const sel = document.getElementById('dashMonthSel');
  if (sel) sel.addEventListener('change', () => { dashMonth = sel.value; render(); });

  const kundeCtx = document.getElementById('kundeChart');
  if (kundeCtx) {
    const sollForChart = dashMonth === 'all' ? entriesOf('soll') : entriesOf('soll').filter(e => e.month === dashMonth);
    const istForChart = dashMonth === 'all' ? entriesOf('ist') : entriesOf('ist').filter(e => e.month === dashMonth);
    const perKundeForChart = customerBreakdown(sollForChart, istForChart);
    if (kundeChart) { kundeChart.destroy(); kundeChart = null; }
    if (perKundeForChart.length) {
      kundeChart = new Chart(kundeCtx, {
        type: 'pie',
        data: {
          labels: perKundeForChart.map(k => k.kunde),
          datasets: [{ data: perKundeForChart.map(k => k.istUmsatz), backgroundColor: perKundeForChart.map((k, i) => PIE_COLORS[i % PIE_COLORS.length]) }],
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } },
      });
    }
  }

  ['umsatz', 'kosten', 'rohertrag'].forEach(key => {
    const cb = document.getElementById('trendShow_' + key);
    if (cb) cb.addEventListener('change', () => { trendShow[key] = cb.checked; render(); });
  });
  const trendShowAllBtn = document.getElementById('trendShowAllBtn');
  if (trendShowAllBtn) trendShowAllBtn.addEventListener('click', () => { trendShow = { umsatz: true, kosten: true, rohertrag: true }; render(); });

  const months = allMonthsUsed();
  const istByMonth = months.map(m => sumEntries(entriesOf('ist').filter(e => e.month === m)));
  const sollByMonth = months.map(m => sumEntries(entriesOf('soll').filter(e => e.month === m)));
  const labels = months.map(monthLabel);
  const trendDatasetDefs = [
    { key: 'umsatz', label: 'Umsatz', color: '#2563eb', sollColor: '#9ca3af' },
    { key: 'kosten', label: 'Kosten', color: '#b91c1c', sollColor: '#6b7280' },
    { key: 'rohertrag', label: 'Rohertrag', color: '#15803d', sollColor: '#374151' },
  ];

  const ctx = document.getElementById('trendChart');
  if (trendChart) { trendChart.destroy(); trendChart = null; }
  if (ctx) {
    const activeDefs = trendDatasetDefs.filter(d => trendShow[d.key]);
    const datasets = [];
    activeDefs.forEach(d => {
      datasets.push({
        label: d.label + ' (IST)',
        data: istByMonth.map(v => v[d.key]),
        borderColor: d.color,
        backgroundColor: d.color,
        fill: false,
        tension: 0,
      });
      datasets.push({
        label: d.label + ' (SOLL)',
        data: sollByMonth.map(v => v[d.key]),
        borderColor: d.sollColor,
        backgroundColor: d.sollColor,
        borderDash: [6, 4],
        fill: false,
        tension: 0,
        pointRadius: 2,
      });
    });
    trendChart = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true } } },
    });
  }
}

}

function filteredSortedProjects() {
  let list = data.projects.slice();
  if (projFilterKunde !== 'all') list = list.filter(p => p.kunde === projFilterKunde);
  if (projFilterStatus !== 'all') list = list.filter(p => computedStatus(p) === projFilterStatus);
  if (projFilterArt !== 'all') list = list.filter(p => (p.projekttyp === 'perm' ? 'perm' : 'contract') === projFilterArt);
  if (projFilterStartMonat) list = list.filter(p => p.start_date && p.start_date.slice(0, 7) === projFilterStartMonat);
  if (projFilterEndeMonat) list = list.filter(p => p.end_date && p.end_date.slice(0, 7) === projFilterEndeMonat);
  if (projSearch.trim()) {
    const q = projSearch.trim().toLowerCase();
    list = list.filter(p => projectSearchText(p).includes(q));
  }

  const dateVal = (s, fallback) => s ? parseDateUTC(s) : fallback;
  if (projSort === 'start_asc') list.sort((a, b) => dateVal(a.start_date, Infinity) - dateVal(b.start_date, Infinity));
  else if (projSort === 'start_desc') list.sort((a, b) => dateVal(b.start_date, -Infinity) - dateVal(a.start_date, -Infinity));
  else if (projSort === 'end_asc') list.sort((a, b) => dateVal(a.end_date, Infinity) - dateVal(b.end_date, Infinity));
  else if (projSort === 'end_desc') list.sort((a, b) => dateVal(b.end_date, -Infinity) - dateVal(a.end_date, -Infinity));
  else list.sort((a, b) => a.kunde.localeCompare(b.kunde) || a.contractor.localeCompare(b.contractor));

  return list;
}

// ---------- SOLL / IST MONATSERFASSUNG ----------

function entryRows(kind, monthVal) {
  const entries = entriesOf(kind);
  const [monthStart, monthEnd] = monthRangeUTC(monthVal);
  return data.projects
    .filter(p => {
      const ps = parseDateUTC(p.start_date);
      if (ps !== null && ps > monthEnd) return false;
      const pe = parseDateUTC(p.end_date);
      if (pe !== null && pe < monthStart) {
        if (kind !== 'ist') return false;
        return entries.some(e => e.project_id === p.id && e.month === monthVal);
      }
      return true;
    })
    .map(p => {
      const active = isActiveInMonth(p, monthVal);
      const editable = active || kind === 'ist';
      const entry = entries.find(e => e.project_id === p.id && e.month === monthVal);
      const stunden = entry ? entry.stunden : '';
      const c = computeEntry({ project_id: p.id, stunden: entry ? entry.stunden : 0 });
      const badge = kind === 'soll' && entry ? `<span class="mini-badge ${entry.auto ? 'auto' : 'manuell'}">${entry.auto ? 'auto' : 'manuell'}</span>` : '';
      return { p, editable, entry, stunden, c, badge, status: computedStatus(p), isPerm: p.projekttyp === 'perm' };
    });
}

function entryRowSearchText(row) {
  return [

    row.stunden !== '' ? fmtNum(row.stunden, 1) : '',
    fmtEUR(row.c.umsatz), fmtEUR(row.c.kosten), fmtEUR(row.c.rohertrag),

function filteredEntryRows(kind, monthVal) {
  let rows = entryRows(kind, monthVal);
  const filterKunde = entryFilterKunde[kind];
  const filterArt = entryFilterArt[kind];
  const filterStatus = entryFilterStatus[kind];
  const search = entrySearch[kind];
  if (filterKunde !== 'all') rows = rows.filter(r => r.p.kunde === filterKunde);
  if (filterArt !== 'all') rows = rows.filter(r => (r.isPerm ? 'perm' : 'contract') === filterArt);
  if (filterStatus !== 'all') rows = rows.filter(r => r.status === filterStatus);
  if (search.trim()) {
    const q = search.trim().toLowerCase();
    rows = rows.filter(r => entryRowSearchText(r).includes(q));
  }
  return rows;
}

      <label style="font-size:12.5px;color:var(--muted);font-weight:600;">Monat:</label>
      <input type="month" id="monthPicker_${kind}" value="${monthVal}">
      ${kind === 'soll' ? '<span style="font-size:12px;color:var(--muted);">Werte werden automatisch aus der Projektlaufzeit berechnet – <span class="mini-badge auto">auto</span> = berechnet, <span class="mini-badge manuell">manuell</span> = von dir angepasst.</span>' : ''}
    </div>
    <div class="toolbar" style="margin-bottom:10px;">
      <input type="text" id="entrySearchInput_${kind}" placeholder="🔍 Suchen (Kunde, Contractor, Status, Zahlen …)" style="width:340px;" value="${search}">
      ${search ? `<button class="btn" id="entrySearchClearBtn_${kind}">✕ Suche leeren</button>` : ''}
    </div>
    <div class="toolbar-filters">
      <label style="font-size:12.5px;color:var(--muted);font-weight:600;">Art:</label>
      <select id="entryFilterArtSel_${kind}">
        <option value="all" ${filterArt === 'all' ? 'selected' : ''}>Alle</option>
        <option value="contract" ${filterArt === 'contract' ? 'selected' : ''}>Contract</option>
        <option value="perm" ${filterArt === 'perm' ? 'selected' : ''}>Perm</option>
      </select>
      <label style="font-size:12.5px;color:var(--muted);font-weight:600;">Kunde:</label>
      <select id="entryFilterKundeSel_${kind}">
        <option value="all">Alle</option>
        ${kundenOptions.map(k => `<option value="${k}" ${filterKunde === k ? 'selected' : ''}>${k}</option>`).join('')}
      </select>
      <label style="font-size:12.5px;color:var(--muted);font-weight:600;">Status:</label>
      <select id="entryFilterStatusSel_${kind}">
        <option value="all" ${filterStatus === 'all' ? 'selected' : ''}>Alle</option>
        ${['Noch nicht aktiv', 'Aktiv', 'Pausiert', 'Beendet'].map(s => `<option value="${s}" ${filterStatus === s ? 'selected' : ''}>${s}</option>`).join('')}
      </select>
      ${(filterKunde !== 'all' || filterArt !== 'all' || filterStatus !== 'all' || search) ? `<button class="btn" id="entryFilterResetBtn_${kind}">Filter zurücksetzen</button>` : ''}
    </div>
    <div class="card panel">
      <div class="table-scroll">
      <table>
        <thead><tr><th>Kunde</th><th>Contractor</th><th>Pay/h · Pauschale</th><th>Charge/h · Pauschale</th><th>Stunden</th><th>Umsatz</th><th>Kosten</th><th>Rohertrag</th></tr></thead>
        <tbody>
          ${rows.map(({ p, editable, stunden, c, badge }) => `
              <tr class="${editable ? '' : 'inactive'}">
                <td>${p.kunde}</td><td>${p.contractor}</td>
                <td>${fmtEUR(p.pay_h)}</td><td>${fmtEUR(p.charge_h)}</td>
                <td><input class="num-cell" type="number" min="0" step="1" data-kind="${kind}" data-pid="${p.id}" value="${stunden}" ${editable ? '' : 'disabled placeholder="–"'}>${badge}</td>
                <td>${fmtEUR(c.umsatz)}</td><td>${fmtEUR(c.kosten)}</td><td>${fmtEUR(c.rohertrag)}</td>
              </tr>`).join('')}
          ${!rows.length ? '<tr><td colspan="8" class="empty">Keine Projekte für diesen Filter.</td></tr>' : ''}
        </tbody>
        <tfoot>
          <tr style="font-weight:700;">
            <td colspan="4">Summe ${monthLabel(monthVal)}</td>
            <td>${fmtNum(totals.stunden, 0)}</td><td>${fmtEUR(totals.umsatz)}</td><td>${fmtEUR(totals.kosten)}</td><td>${fmtEUR(totals.rohertrag)}</td>
          </tr>
        </tfoot>
      </table>
      </div>
      ${!data.projects.length ? '<div class="empty">Erst Projekte im Tab "Projekte" anlegen.</div>' : ''}
    </div>
  `;
}

async function setEntry(kind, projectId, monthVal, stunden) {
  const existing = data.entries.find(e => e.project_id === projectId && e.kind === kind && e.month === monthVal);
  if (stunden === '' || stunden === null || isNaN(stunden)) {
    if (existing) await sb.from('entries').delete().eq('id', existing.id);
    if (kind === 'soll') {
      const proj = project(projectId);
      if (proj) { await syncAutoSoll(proj); return; }
    }
  } else if (existing) {
    const patch = { stunden };
    if (kind === 'soll') patch.auto = false;
    await sb.from('entries').update(patch).eq('id', existing.id);
  } else {
    const payload = { project_id: projectId, kind, month: monthVal, stunden };
    if (kind === 'soll') payload.auto = false;
    await sb.from('entries').insert(payload);
  }
  await loadAll();
}

// ---------- KI-VORSCHLÄGE (aus Weclapp-Rechnungen) ----------

function kiVorschlaegeHTML() {
  const counts = {
    pending: data.ki_vorschlaege.filter(v => v.status === 'pending').length,
    approved: data.ki_vorschlaege.filter(v => v.status === 'approved').length,
    rejected: data.ki_vorschlaege.filter(v => v.status === 'rejected').length,
  };
  const list = data.ki_vorschlaege
    .filter(v => kiFilterStatus === 'all' || v.status === kiFilterStatus)
    .sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));

  return `
    <div class="toolbar" style="justify-content:space-between;flex-wrap:wrap;">
      <div>
        <h2 style="margin:0 0 2px;">KI-Vorschläge aus Weclapp</h2>
        <div class="sub">Aus Eingangsrechnungen automatisch vorgeschlagene IST-Stunden – bitte vor der Übernahme prüfen und ggf. korrigieren.</div>
      </div>
      <div class="toolbar" style="margin:0;">
        <label style="font-size:12.5px;color:var(--muted);font-weight:600;">Status:</label>
        <select id="kiFilterStatusSel">
          <option value="pending" ${kiFilterStatus === 'pending' ? 'selected' : ''}>Offen (${counts.pending})</option>
          <option value="approved" ${kiFilterStatus === 'approved' ? 'selected' : ''}>Übernommen (${counts.approved})</option>
          <option value="rejected" ${kiFilterStatus === 'rejected' ? 'selected' : ''}>Abgelehnt (${counts.rejected})</option>
          <option value="all" ${kiFilterStatus === 'all' ? 'selected' : ''}>Alle</option>
        </select>
      </div>
    </div>
    <div class="card panel">
      ${!data.ki_vorschlaege.length ? '<div class="empty">Noch keine KI-Vorschläge vorhanden. Diese entstehen automatisch, sobald die Weclapp-Anbindung eingerichtet ist (siehe WECLAPP_KI_SETUP.md).</div>' : `
      <div class="table-scroll">
      <table>
        <thead><tr><th>Rechnung</th><th>Contractor (Weclapp)</th><th>Projekt</th><th>Monat</th><th>Stunden</th><th>Methode</th><th>Betrag</th><th>Hinweis</th><th>Status</th><th>Aktionen</th></tr></thead>
        <tbody>
          ${list.map(v => {
            const matched = v.project_id ? project(v.project_id) : null;
            const isPending = v.status === 'pending';
            return `
            <tr>
              <td>${v.rechnungsnummer || '–'}</td>
              <td>${v.contractor_raw || '–'}</td>
              <td>${isPending
                ? `<select data-vid="${v.id}" data-field="project"><option value="">– bitte wählen –</option>${data.projects.map(p => `<option value="${p.id}" ${v.project_id === p.id ? 'selected' : ''}>${p.kunde} – ${p.contractor}</option>`).join('')}</select>`
                : (matched ? `${matched.kunde} – ${matched.contractor}` : '<span class="empty" style="padding:0;">kein Projekt</span>')}</td>
              <td>${isPending ? `<input type="month" data-vid="${v.id}" data-field="month" value="${v.month || ''}">` : (v.month ? monthLabel(v.month) : '–')}</td>
              <td>${isPending ? `<input class="num-cell" type="number" step="0.5" min="0" data-vid="${v.id}" data-field="stunden" value="${v.stunden ?? ''}">` : fmtNum(v.stunden, 1)}</td>
              <td>${v.methode ? `<span class="mini-badge ${v.methode === 'extrahiert' ? 'auto' : 'manuell'}">${v.methode}</span>` : '–'}</td>
              <td>${v.betrag != null ? fmtEUR(v.betrag) : '–'}</td>
              <td style="white-space:normal;max-width:220px;">${v.notiz ? `<span class="empty" style="padding:0;text-align:left;display:block;">${v.notiz}</span>` : ''}</td>
              <td><span class="badge ${v.status === 'approved' ? 'Aktiv' : v.status === 'rejected' ? 'Kritisch' : 'Achtung'}">${v.status === 'approved' ? 'Übernommen' : v.status === 'rejected' ? 'Abgelehnt' : 'Offen'}</span></td>
              <td>${isPending
                ? `<button class="link" data-approve-ki="${v.id}">Übernehmen</button> <button class="link danger" data-reject-ki="${v.id}">Ablehnen</button>`
                : `<button class="link" data-reset-ki="${v.id}">Zurücksetzen</button>`}</td>
            </tr>`;
          }).join('')}
          ${!list.length ? '<tr><td colspan="10" class="empty">Keine Vorschläge in dieser Ansicht.</td></tr>' : ''}
        </tbody>
      </table>
      </div>`}
    </div>
  `;
}

async function approveKiVorschlag(id) {
  const projSel = document.querySelector(`[data-vid="${id}"][data-field="project"]`);
  const monthInp = document.querySelector(`[data-vid="${id}"][data-field="month"]`);
  const stundenInp = document.querySelector(`[data-vid="${id}"][data-field="stunden"]`);
  const projectId = projSel ? projSel.value : '';
  const monthVal = monthInp ? monthInp.value : '';
  const stunden = stundenInp && stundenInp.value !== '' ? Number(stundenInp.value) : NaN;
  if (!projectId || !monthVal || isNaN(stunden)) {
    alert('Bitte Projekt, Monat und Stunden ausfüllen, bevor du übernimmst.');
    return;
  }
  await setEntry('ist', projectId, monthVal, stunden);
  await sb.from('ki_vorschlaege').update({ status: 'approved', project_id: projectId, month: monthVal, stunden, reviewed_at: new Date().toISOString() }).eq('id', id);
  await loadAll();
}

async function rejectKiVorschlag(id) {
  await sb.from('ki_vorschlaege').update({ status: 'rejected', reviewed_at: new Date().toISOString() }).eq('id', id);
  await loadAll();
}

async function resetKiVorschlag(id) {
  await sb.from('ki_vorschlaege').update({ status: 'pending', reviewed_at: null }).eq('id', id);
  await loadAll();
}

// ---------- EVENTS ----------

function wireTabEvents() {
  const addBtn = document.getElementById('addProjectBtn');
  if (addBtn) addBtn.addEventListener('click', () => openProjectModal(null));
  const recalcBtn = document.getElementById('recalcSollBtn');
  if (recalcBtn) recalcBtn.addEventListener('click', async () => { recalcBtn.disabled = true; recalcBtn.textContent = 'Berechne…'; await recalcAllSoll(); });
  document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openProjectModal(b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteProject(b.dataset.del)));
  const projFilterKundeSel = document.getElementById('projFilterKundeSel');
  if (projFilterKundeSel) projFilterKundeSel.addEventListener('change', () => { projFilterKunde = projFilterKundeSel.value; render(); });
  const projFilterStatusSel = document.getElementById('projFilterStatusSel');
  if (projFilterStatusSel) projFilterStatusSel.addEventListener('change', () => { projFilterStatus = projFilterStatusSel.value; render(); });
  const projFilterArtSel = document.getElementById('projFilterArtSel');
  if (projFilterArtSel) projFilterArtSel.addEventListener('change', () => { projFilterArt = projFilterArtSel.value; render(); });
  const projFilterStartMonatInput = document.getElementById('projFilterStartMonatInput');
  if (projFilterStartMonatInput) projFilterStartMonatInput.addEventListener('change', () => { projFilterStartMonat = projFilterStartMonatInput.value; render(); });
  const projFilterEndeMonatInput = document.getElementById('projFilterEndeMonatInput');
  if (projFilterEndeMonatInput) projFilterEndeMonatInput.addEventListener('change', () => { projFilterEndeMonat = projFilterEndeMonatInput.value; render(); });
  const projSortSel = document.getElementById('projSortSel');
  if (projSortSel) projSortSel.addEventListener('change', () => { projSort = projSortSel.value; render(); });
  const projFilterResetBtn = document.getElementById('projFilterResetBtn');
  if (projFilterResetBtn) projFilterResetBtn.addEventListener('click', () => { projFilterKunde = 'all'; projFilterStatus = 'all'; projFilterArt = 'all'; projFilterStartMonat = ''; projFilterEndeMonat = ''; projSearch = ''; render(); });
  const projSearchInput = document.getElementById('projSearchInput');
  if (projSearchInput) {
    projSearchInput.addEventListener('input', () => {
      projSearch = projSearchInput.value;
      render();
      const freshInput = document.getElementById('projSearchInput');
      if (freshInput) {
        freshInput.focus();
        const pos = freshInput.value.length;
        freshInput.setSelectionRange(pos, pos);
      }
    });
  }
  const projSearchClearBtn = document.getElementById('projSearchClearBtn');
  if (projSearchClearBtn) projSearchClearBtn.addEventListener('click', () => { projSearch = ''; render(); });
  ['soll', 'ist'].forEach(kind => {
    const picker = document.getElementById('monthPicker_' + kind);
    if (picker) picker.addEventListener('change', () => { if (kind === 'soll') sollMonth = picker.value; else istMonth = picker.value; render(); });

    const entryFilterArtSel = document.getElementById('entryFilterArtSel_' + kind);
    if (entryFilterArtSel) entryFilterArtSel.addEventListener('change', () => { entryFilterArt[kind] = entryFilterArtSel.value; render(); });
    const entryFilterKundeSel = document.getElementById('entryFilterKundeSel_' + kind);
    if (entryFilterKundeSel) entryFilterKundeSel.addEventListener('change', () => { entryFilterKunde[kind] = entryFilterKundeSel.value; render(); });
    const entryFilterStatusSel = document.getElementById('entryFilterStatusSel_' + kind);
    if (entryFilterStatusSel) entryFilterStatusSel.addEventListener('change', () => { entryFilterStatus[kind] = entryFilterStatusSel.value; render(); });
    const entryFilterResetBtn = document.getElementById('entryFilterResetBtn_' + kind);
    if (entryFilterResetBtn) entryFilterResetBtn.addEventListener('click', () => {
      entryFilterKunde[kind] = 'all'; entryFilterArt[kind] = 'all'; entryFilterStatus[kind] = 'all'; entrySearch[kind] = ''; render();
    });
    const entrySearchInput = document.getElementById('entrySearchInput_' + kind);
    if (entrySearchInput) {
      entrySearchInput.addEventListener('input', () => {
        entrySearch[kind] = entrySearchInput.value;
        render();
        const freshInput = document.getElementById('entrySearchInput_' + kind);
        if (freshInput) {
          freshInput.focus();
          const pos = freshInput.value.length;
          freshInput.setSelectionRange(pos, pos);
        }
      });
    }
    const entrySearchClearBtn = document.getElementById('entrySearchClearBtn_' + kind);
    if (entrySearchClearBtn) entrySearchClearBtn.addEventListener('click', () => { entrySearch[kind] = ''; render(); });
  });
  const addConsultantBtn = document.getElementById('addConsultantBtn');
  if (addConsultantBtn) addConsultantBtn.addEventListener('click', () => openConsultantModal(null));
  document.querySelectorAll('[data-edit-consultant]').forEach(b => b.addEventListener('click', () => openConsultantModal(b.dataset.editConsultant)));
  document.querySelectorAll('[data-del-consultant]').forEach(b => b.addEventListener('click', () => deleteConsultant(b.dataset.delConsultant)));
  const kiFilterStatusSel = document.getElementById('kiFilterStatusSel');
  if (kiFilterStatusSel) kiFilterStatusSel.addEventListener('change', () => { kiFilterStatus = kiFilterStatusSel.value; render(); });
  document.querySelectorAll('[data-approve-ki]').forEach(b => b.addEventListener('click', () => approveKiVorschlag(b.dataset.approveKi)));
  document.querySelectorAll('[data-reject-ki]').forEach(b => b.addEventListener('click', () => rejectKiVorschlag(b.dataset.rejectKi)));
  document.querySelectorAll('[data-reset-ki]').forEach(b => b.addEventListener('click', () => resetKiVorschlag(b.dataset.resetKi)));
  const provPicker = document.getElementById('provMonthPicker');
  if (provPicker) provPicker.addEventListener('change', () => { provMonth = provPicker.value; reportConfig = null; render(); });
  document.querySelectorAll('[data-report]').forEach(b => b.addEventListener('click', () => { reportConfig = { consultantId: b.dataset.report }; render(); }));
  const reportBack = document.querySelector('[data-report-back]');
  if (reportBack) reportBack.addEventListener('click', () => { reportConfig = null; render(); });
  const reportPrint = document.querySelector('[data-report-print]');
  if (reportPrint) reportPrint.addEventListener('click', () => window.print());
  document.querySelectorAll('input[data-kind]').forEach(inp => {
    inp.addEventListener('change', () => {
      const kind = inp.dataset.kind;
      const pid = inp.dataset.pid;
      const monthVal = kind === 'soll' ? sollMonth : istMonth;
      const val = inp.value === '' ? '' : Number(inp.value);
      setEntry(kind, pid, monthVal, val);
    });
  });
}

// ---------- BOOTSTRAP ----------

sb.auth.onAuthStateChange((event, newSession) => {
  session = newSession;
  if (session) {
    renderAuth();
    document.getElementById('app').innerHTML = '<div class="empty">Lade…</div>';
    subscribeRealtime();
    loadAll();
  } else {
    if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
    renderAuth();
  }
});

sb.auth.getSession().then(({ data: { session: s } }) => {
  session = s;
  if (session) { document.getElementById('app').innerHTML = '<div class="empty">Lade…</div>'; subscribeRealtime(); loadAll(); }
  else renderAuth();
});
</script>
