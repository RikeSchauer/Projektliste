    if (c.advancedOpen.has(k)) c.advancedOpen.delete(k); else c.advancedOpen.add(k);
    render();
  }));

  document.getElementById('addPlacementBtn').addEventListener('click', () => {
    syncPlacementsFromDOM(c);
    c.placements.push(blankPlacement());
    render();
  });
  document.querySelectorAll('[data-remove-pl]').forEach(b => b.addEventListener('click', () => {
    syncPlacementsFromDOM(c);
    c.placements = c.placements.filter(pl => placementKey(pl) !== b.dataset.removePl);
    render();
  }));
  document.querySelectorAll('[data-generate-pl]').forEach(b => b.addEventListener('click', async () => {
    syncPlacementsFromDOM(c);
    const pl = c.placements.find(x => placementKey(x) === b.dataset.generatePl);
    if (pl) await generateProjectFromPlacement(c, pl);
  }));

  document.getElementById('modalCancelCandidate').addEventListener('click', () => { modalConfig = null; render(); });
  if (c.id) document.getElementById('modalDeleteCandidate').addEventListener('click', () => deleteCandidate(c.id));
  document.getElementById('modalSaveCandidate').addEventListener('click', async () => {
    syncPlacementsFromDOM(c);
    const kundeIdVal = document.getElementById('cd_kunde').value || null;
    if (!kundeIdVal) { alert('Bitte einen Kunden auswählen (im Tab "Kunden" ggf. zuerst anlegen).'); return; }
    const payload = {
      org: c.id ? c.values.org : activeOrg,
      contractor: document.getElementById('cd_contractor').value.trim(),
      freelancer_email: document.getElementById('cd_freelancer_email').value.trim() || null,
      ...(hatContractorVerknuepfung() && document.getElementById('cd_contractor_id')
        ? { contractor_id: document.getElementById('cd_contractor_id').value || null } : {}),
      vat_id: document.getElementById('cd_vat_id').value.trim() || null,
      kunde_id: kundeIdVal,
      kunde: kundeName(kundeIdVal),
      status: document.getElementById('cd_status').value,
    };
    let candidateId = c.id;
    const neuAngelegt = [], erzeugt = [], aktualisiert = [], uebersprungen = [];
    if (candidateId) {
      if (!await save(sb.from('candidates').update(payload).eq('id', candidateId), 'Kandidat')) return;
    } else {
      const inserted = await save(sb.from('candidates').insert(payload).select().single(), 'Kandidat');
      if (!inserted) return; // ohne Kandidat kein Platz für die Placements darunter
      candidateId = inserted.id;
    }
    if (candidateId) {
      const existingIds = new Set(c.id ? placementsOf(c.id).map(pl => pl.id) : []);
      const keptIds = new Set(c.placements.filter(pl => pl.id).map(pl => pl.id));
      // Beim Löschen wird abgebrochen statt weiterzumachen: sonst sind die
      // entfernten Placements teils weg und der Rest inkonsistent gespeichert.
      for (const oldId of existingIds) {
        if (!keptIds.has(oldId) && !await save(sb.from('placements').delete().eq('id', oldId), 'Placement entfernen')) return;
      }
      for (const pl of c.placements) {
        const plPayload = {
          candidate_id: candidateId, projekt_name: pl.projekt_name || null, projekt_nummer: pl.projekt_nummer || null,
          rate_unit: pl.rate_unit, projekttyp: pl.projekttyp, rechnungsname: pl.rechnungsname,
          start_date: pl.start_date, end_date: pl.end_date, wochenstunden: pl.wochenstunden,
          pay_rate: pl.pay_rate, charge_rate: pl.charge_rate, deal_value: pl.deal_value, amount_ordered_hours: pl.amount_ordered_hours,
          consultant1_id: pl.consultant1_id, consultant2_id: pl.consultant2_id, payment_terms: pl.payment_terms,
          placement_code: pl.placement_code, placement_description: pl.placement_description,
          po_empfaenger: pl.po_empfaenger, po_betrag: pl.po_betrag, po_stunden_gesamt: pl.po_stunden_gesamt, po_referenz: pl.po_referenz,
          kunde_override_name: pl.kunde_override_name, kunde_override_email: pl.kunde_override_email,
          kunde_override_vat_id: pl.kunde_override_vat_id, kunde_override_adresse: pl.kunde_override_adresse,
          contractor_invoice_email: pl.contractor_invoice_email,
        };
        if (pl.id) {
          if (!await save(sb.from('placements').update(plPayload).eq('id', pl.id), 'Placement')) return;
        } else {
          const plInserted = await save(sb.from('placements').insert(plPayload).select().single(), 'Placement');
          if (!plInserted) return;
          pl.id = plInserted.id;
          neuAngelegt.push(pl);
        }
      }

      // Aus jedem NEUEN Placement direkt eine Projektzeile machen, damit es ohne
      // weiteren Handgriff im Tab "Projekte" auftaucht.
      const org = c.id ? c.values.org : activeOrg;
      const contractorName = payload.contractor;
      for (const pl of neuAngelegt) {
        const grund = placementBereitFuerProjekt(pl, org);
        if (grund) { uebersprungen.push(`${pl.projekt_name || 'Placement ohne Namen'}: ${grund}`); continue; }
        const projPayload = projektPayloadAusPlacement(pl, org, kundeIdVal, contractorName);
        const proj = await save(sb.from('projects').insert(projPayload).select().single(), 'Projekt aus Placement');
        if (!proj) continue;
        if (await save(sb.from('placements').update({ linked_project_id: proj.id, status: 'Projekt erzeugt' }).eq('id', pl.id), 'Verknüpfung Placement → Projekt')) {
          pl.linked_project_id = proj.id;
          erzeugt.push(proj);
        }
      }

      // Bestehende Placements: Weicht die verknüpfte Projektzeile inzwischen ab,
      // wird nachgefragt statt stillschweigend zu überschreiben. Die Projektzeile
      // kann im Tab "Projekte" von Hand angepasst worden sein - das darf nicht
      // unbemerkt verlorengehen. Deshalb die Wahl: aktualisieren, ein neues
      // Projekt anlegen (z.B. bei einer Verlängerung zu neuen Konditionen) oder
      // alles so lassen.
      for (const pl of c.placements) {
        if (!pl.id || !pl.linked_project_id || neuAngelegt.includes(pl)) continue;
        const proj = project(pl.linked_project_id);
        if (!proj) continue;
        const projPayload = projektPayloadAusPlacement(pl, org, kundeIdVal, contractorName);
        const diff = projektAbweichungen(projPayload, proj);
        if (!diff.length) continue;
        const wahl = await frageDialog(
          'Placement geändert – was soll mit dem Projekt passieren?',
          `Placement "${pl.projekt_name || 'ohne Namen'}" weicht von der verknüpften Projektzeile ab:\n\n`
          + diff.map(d => '• ' + d).join('\n')
          + '\n\nDer Status der Projektzeile (Aktiv/Pausiert/…) bleibt in jedem Fall unangetastet.',
          [
            { key: 'update', label: 'Projektzeile aktualisieren' },
            { key: 'neu',    label: 'Neues Projekt anlegen' },
            { key: 'nichts', label: 'Nichts ändern' },
          ]);
        if (wahl === 'update') {
          if (await save(sb.from('projects').update(projPayload).eq('id', proj.id), 'Projektzeile aktualisieren')) {
            aktualisiert.push({ ...proj, ...projPayload });
          }
        } else if (wahl === 'neu') {
          const neuProj = await save(sb.from('projects').insert(projPayload).select().single(), 'Neues Projekt aus Placement');
          if (neuProj && await save(sb.from('placements').update({ linked_project_id: neuProj.id }).eq('id', pl.id), 'Verknüpfung Placement → Projekt')) {
            pl.linked_project_id = neuProj.id;
            erzeugt.push(neuProj);
          }
        }
      }
    }
    modalConfig = null;
    await loadAll();
    // SOLL-Stunden erst nach dem Neuladen berechnen - syncAutoSoll arbeitet auf data.
    for (const proj of erzeugt) await syncAutoSoll(proj);
    // Auch nach einer Änderung neu verteilen - Zeitraum oder bestellte Stunden
    // können sich geändert haben.
    for (const proj of aktualisiert) await syncAutoSoll(proj);
    if (erzeugt.length || aktualisiert.length || uebersprungen.length) {
      alert(
        (erzeugt.length ? `${erzeugt.length} Projekt(e) im Tab "Projekte" angelegt.\n` : '')
        + (aktualisiert.length ? `${aktualisiert.length} Projektzeile(n) aktualisiert.\n` : '')
        + (uebersprungen.length
            ? `\nNoch kein Projekt entstanden für:\n• ${uebersprungen.join('\n• ')}\n\n`
              + 'Diese Placements bleiben Entwurf. Sobald die Angaben vollständig sind, '
              + 'per "Projekt erzeugen" nachholen.'
            : ''));
    }
  });
}

async function deleteCandidate(id) {
  if (!confirm('Kandidat inkl. aller Placements aus dem CRM löschen? Bereits daraus erzeugte Projekte bleiben davon unberührt.')) return;
  if (!await save(sb.from('candidates').delete().eq('id', id), 'Kandidat löschen')) return;
  modalConfig = null;
  await loadAll();
}

// Erzeugt aus einem Placement einen echten Eintrag im Tab "Projekte" - Kunde/Contractor kommen
// vom übergeordneten Kandidaten, ALLE Konditionen (Zeitraum, Pay/Charge, Consultants, ...) vom
// Placement selbst. Übernimmt bewusst NUR die Felder, die es auch in der Tabelle "projects" gibt
// (PO/Zahlungsziel/Overrides bleiben CRM-only).
// Kleiner Auswahldialog mit mehreren Möglichkeiten - confirm() kann nur ja/nein.
// Gibt den Schlüssel der gewählten Möglichkeit zurück (oder null bei Abbruch).
// Hängt bewusst am body und nicht in #app, damit ein zwischenzeitliches render()
// ihn nicht wegräumt.
function frageDialog(titel, text, optionen) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.style.zIndex = 200;
    overlay.innerHTML = `
      <div class="modal" style="width:520px;">
        <h3>${esc(titel)}</h3>
        <div style="font-size:13px;line-height:1.55;white-space:pre-line;">${esc(text)}</div>
        <div class="modal-actions" style="flex-wrap:wrap;">
          ${optionen.map((o, i) => `<button class="btn ${i === 0 ? 'primary' : ''}" data-wahl="${esc(o.key)}">${esc(o.label)}</button>`).join('')}
        </div>
      </div>`;
    const fertig = (wahl) => { overlay.remove(); resolve(wahl); };
    overlay.querySelectorAll('[data-wahl]').forEach(b => b.addEventListener('click', () => fertig(b.dataset.wahl)));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) fertig(null); });
    document.body.appendChild(overlay);
  });
}

// Vergleicht einen Wert aus dem Placement mit dem aus der Projektzeile. Leer,
// null und undefined gelten als dasselbe; Zahlen werden als Zahlen verglichen,
// damit 70 und "70" nicht als Unterschied durchgehen.
function feldGleich(a, b) {
  const norm = v => (v === null || v === undefined || v === '') ? null : v;
  a = norm(a); b = norm(b);
  if (a === null && b === null) return true;
  if (a === null || b === null) return false;
  const za = Number(a), zb = Number(b);
  if (!isNaN(za) && !isNaN(zb)) return za === zb;
  return String(a) === String(b);
}

// Welche Felder weichen zwischen Placement und verknüpfter Projektzeile ab?
// status bleibt außen vor - der wird im Tab "Projekte" von Hand gepflegt
// (Pausiert o.ä.) und soll nicht vom Placement überschrieben werden.
function projektAbweichungen(payload, proj) {
  const namen = {
    kunde: 'Kunde', contractor: 'Contractor', projekttyp: 'Art', rechnungsname: 'Rechnungsname',
    start_date: 'Start', end_date: 'Ende', pay_h: 'Pay/h', charge_h: 'Charge/h',
    wochenstunden: 'Std./Woche', amount_ordered_hours: 'Bestellte Stunden', deal_value: 'Deal Value',
    consultant1_id: 'Consultant 1', consultant2_id: 'Consultant 2', kunde_id: null,
  };
  const out = [];
  for (const [feld, label] of Object.entries(namen)) {
    if (!label) continue;
    if (!(feld in payload)) continue;
    if (!feldGleich(payload[feld], proj[feld])) {
      const zeig = v => (v === null || v === undefined || v === '') ? '–'
        : (feld.endsWith('_id') ? consultantName(v) : String(v));
      out.push(`${label}: ${zeig(proj[feld])} → ${zeig(payload[feld])}`);
    }
  }
  return out;
}

// Baut die Projektzeile aus einem Placement. Bewusst ohne Zugriff auf das
// Formular, damit dieselbe Logik sowohl beim Knopf "Projekt erzeugen" als auch
// bei der Automatik beim Speichern verwendet werden kann.
function projektPayloadAusPlacement(pl, org, kundeIdVal, contractor) {
  const isPerm = pl.projekttyp === 'perm';
  const payload = {
    org, projekttyp: pl.projekttyp, kunde_id: kundeIdVal, kunde: kundeName(kundeIdVal), contractor,
    rechnungsname: pl.rechnungsname, start_date: pl.start_date, end_date: pl.end_date || (isPerm ? pl.start_date : null),
    pay_h: pl.pay_rate, charge_h: pl.charge_rate, consultant1_id: pl.consultant1_id, consultant2_id: pl.consultant2_id,
    status: 'Auto',
  };
  if (org === 'peax') { payload.amount_ordered_hours = pl.amount_ordered_hours; payload.deal_value = pl.deal_value; payload.wochenstunden = 0; }
  else payload.wochenstunden = isPerm ? 0 : (pl.wochenstunden || 0);
  return payload;
}

// Reicht ein Placement für eine sinnvolle Projektzeile? Ohne Startdatum kann die
// SOLL-Berechnung nichts verteilen, ohne Sätze wären Umsatz und Marge null - so
// eine Zeile würde im Dashboard und in den Auswertungen nur stören. Solche
// Placements bleiben Entwurf; das Projekt lässt sich später per Knopf erzeugen.
function placementBereitFuerProjekt(pl, org) {
  if (!pl.start_date) return 'kein Startdatum';
  const hatSatz = (pl.pay_rate || 0) > 0 || (pl.charge_rate || 0) > 0
    || (org === 'peax' && ((pl.deal_value || 0) > 0 || (pl.amount_ordered_hours || 0) > 0));
  if (!hatSatz) return 'keine Sätze hinterlegt';
  return null; // alles da
}

async function generateProjectFromPlacement(c, pl) {
  if (pl.linked_project_id && !confirm('Für dieses Placement wurde bereits ein Projekt erzeugt. Trotzdem ein weiteres, neues Projekt anlegen?')) return;
  const org = c.id ? c.values.org : activeOrg;
  const kundeIdVal = document.getElementById('cd_kunde') ? document.getElementById('cd_kunde').value : c.values.kunde_id;
  if (!kundeIdVal) { alert('Bitte zuerst einen Kunden auswählen.'); return; }
  const kundeNameVal = kundeName(kundeIdVal);
  const contractor = document.getElementById('cd_contractor') ? document.getElementById('cd_contractor').value.trim() : c.values.contractor;
  const payload = projektPayloadAusPlacement(pl, org, kundeIdVal, contractor);
  const { data: inserted, error } = await sb.from('projects').insert(payload).select().single();
  if (error) { alert(error.message); return; }
  pl.linked_project_id = inserted.id;
  pl.status = 'Projekt erzeugt';
  if (pl.id) {
    // Schlägt das fehl, existiert das Projekt bereits, das Placement weiß aber
    // nichts davon - deshalb hier explizit melden statt still weiterzulaufen.
    await save(sb.from('placements').update({ linked_project_id: inserted.id, status: 'Projekt erzeugt' }).eq('id', pl.id), 'Verknüpfung Placement → Projekt');
  } else {
    // Placement existiert noch nicht in der DB (neu angelegt, noch nicht gespeichert) - gleich
    // mit anlegen, damit die Verknüpfung nicht beim nächsten Speichern verloren geht.
    const plInserted = await save(sb.from('placements').insert({
      candidate_id: c.id, projekt_name: pl.projekt_name || null, projekt_nummer: pl.projekt_nummer || null,
      rate_unit: pl.rate_unit, projekttyp: pl.projekttyp, rechnungsname: pl.rechnungsname,
      start_date: pl.start_date, end_date: pl.end_date, wochenstunden: pl.wochenstunden,
      pay_rate: pl.pay_rate, charge_rate: pl.charge_rate, deal_value: pl.deal_value, amount_ordered_hours: pl.amount_ordered_hours,
      consultant1_id: pl.consultant1_id, consultant2_id: pl.consultant2_id, payment_terms: pl.payment_terms,
      placement_code: pl.placement_code, placement_description: pl.placement_description,
      po_empfaenger: pl.po_empfaenger, po_betrag: pl.po_betrag, po_stunden_gesamt: pl.po_stunden_gesamt, po_referenz: pl.po_referenz,
      kunde_override_name: pl.kunde_override_name, kunde_override_email: pl.kunde_override_email,
      kunde_override_vat_id: pl.kunde_override_vat_id, kunde_override_adresse: pl.kunde_override_adresse,
      contractor_invoice_email: pl.contractor_invoice_email,
      linked_project_id: inserted.id, status: 'Projekt erzeugt',
    }).select().single(), 'Placement anlegen');
    if (plInserted) pl.id = plInserted.id;
  }
  await loadAll();
  await syncAutoSoll(inserted);
  render();
}

// ---------- DATA LOADING ----------

// Supabase liefert pro Anfrage höchstens so viele Zeilen zurück, wie in den
// Projekteinstellungen unter API -> "Max rows" stehen (Standard: 1000) - und zwar
// STILL, ohne Fehler und ohne Hinweis. Ein einfaches select('*') hätte also ab der
// 1001. Zeile einfach Daten weggelassen: fehlende Stunden in Reports und in der
// Provisionsabrechnung, ohne dass es irgendwo auffällt.
//
// Deshalb wird hier seitenweise geladen, bis eine Seite nicht mehr voll ist. Bei
// den aktuellen Datenmengen ist das eine einzige Anfrage pro Tabelle - es kostet
// also nichts und wächst automatisch mit.
const PAGE_SIZE = 1000;

// schluessel: Spalte, die als eindeutiges zweites Sortierkriterium dient.
// Fast alle Tabellen heißen dort 'id' - consultant_rates hat aber keine
// id-Spalte, sondern consultant_id als Schlüssel. Wird hier die falsche Spalte
// sortiert, scheitert die ganze Abfrage und die Tabelle kommt leer zurück.
async function loadTable(name, orderCol, ascending, schluessel) {
  let from = 0;
  const alle = [];
  for (;;) {
    let q = sb.from(name).select('*');
    if (orderCol) q = q.order(orderCol, { ascending: ascending !== false });
    // Zweites Sortierkriterium: ohne eindeutige Reihenfolge könnten bei
    // gleichem created_at/month zwischen zwei Seiten Zeilen doppelt oder gar
    // nicht geliefert werden.
    q = q.order(schluessel || 'id', { ascending: true }).range(from, from + PAGE_SIZE - 1);
    const { data, error } = await q;
    if (error) return { data: null, error };
    alle.push(...(data || []));
    if (!data || data.length < PAGE_SIZE) break;
    from += PAGE_SIZE;
    if (from >= 200000) { // Notbremse gegen eine Endlosschleife
      console.warn(`${name}: mehr als 200.000 Zeilen - Rest wird nicht geladen.`);
      break;
    }
  }
  return { data: alle, error: null };
}

async function loadAll() {
  // allProjects/allConsultants kommen ungefiltert (RLS liefert automatisch nur die Firmen,
  // für die diese Person laut user_access Zugriff hat - bei Zugriff auf beide Firmen also
  // beide gemischt). data.projects/consultants werden danach auf activeOrg eingegrenzt,
  // data.allProjects bleibt firmenübergreifend für die KI-Vorschläge-Zuordnung erhalten.
  const [{ data: allProjects, error: e1 }, { data: entries, error: e2 }, { data: allConsultants, error: e3 }, { data: kiVorschlaege, error: e4 }, { data: teamMemberships, error: e5 }, { data: contractors, error: e6 }, { data: contractorProjects, error: e9 }, { data: timesheets, error: e7 }, { data: timesheetDays, error: e8 }, { data: candidates, error: e10 }, { data: candidateProjects, error: e11 }, { data: kunden, error: e12 }, { data: consultantRates, error: e13 }, { data: contractorAliase, error: e14 }] = await Promise.all([
    loadTable('projects', 'created_at'),
    loadTable('entries'),
    loadTable('consultants', 'created_at'),
    // ki_vorschlaege ist optional – falls die Tabelle (noch) nicht existiert (Migration nicht ausgeführt),
    // soll die App trotzdem normal weiterlaufen, nur der Tab "Eingangsrechnungen" bleibt dann leer.
    loadTable('ki_vorschlaege', 'created_at', false),
    // team_memberships ist ebenfalls optional (siehe migration_team_bonus.sql) - ohne die Migration
    // bleiben Team-Boni einfach leer, statt die App zum Absturz zu bringen.
    loadTable('team_memberships'),
    // contractors/contractor_projects/timesheets/timesheet_days sind ebenfalls optional (siehe
    // migration_contractor_timesheets.sql) - ohne die Migration bleibt der Tab "Timesheets"
    // einfach leer, statt die App zum Absturz zu bringen.
    loadTable('contractors', 'name'),
    loadTable('contractor_projects'),
    loadTable('timesheets', 'month', false),
    loadTable('timesheet_days'),
    // candidates/placements (CRM) sind ebenfalls optional (siehe migration_crm.sql,
    // migration_crm_subprojekte.sql und migration_placements.sql).
    loadTable('candidates', 'created_at', false),
    loadTable('placements', 'created_at', false),
    // kunden (CRM-Stammdaten pro Kunde) ist ebenfalls optional (siehe migration_kunden.sql).
    loadTable('kunden', 'name'),
    // consultant_rates ist admin-only (Migration 20). Für alle anderen kommt
    // hier eine leere Liste zurück - kein Fehler, kein Hinweis, die Sätze sind
    // für sie schlicht nicht vorhanden.
    loadTable('consultant_rates', null, true, 'consultant_id'),
    // Alias-Namen für den Weclapp-Abgleich (Migration 22) - optional wie die
    // anderen neueren Tabellen.
    loadTable('contractor_aliase'),
  ]);
  if (e1 || e2 || e3) {
    console.error('load error', e1, e2, e3);
    renderError((e1 || e2 || e3).message);
    return;
  }
  if (e4) console.warn('ki_vorschlaege konnte nicht geladen werden (Migration ausgeführt?)', e4);
  if (e5) console.warn('team_memberships konnte nicht geladen werden (migration_team_bonus.sql ausgeführt?)', e5);
  if (e6 || e7 || e8 || e9) console.warn('Contractor-Timesheets konnten nicht geladen werden (migration_contractor_timesheets.sql ausgeführt?)', e6, e7, e8, e9);
  if (e10 || e11) console.warn('CRM-Kandidaten konnten nicht geladen werden (migration_crm.sql/migration_crm_subprojekte.sql ausgeführt?)', e10, e11);
  if (e12) console.warn('Kunden-CRM konnte nicht geladen werden (migration_kunden.sql ausgeführt?)', e12);
  if (e13) console.warn('Provisionssätze konnten nicht geladen werden (20_migration_rollen.sql ausgeführt?)', e13);
  if (e14) console.warn('Alias-Namen konnten nicht geladen werden (22_migration_contractor_aliase.sql ausgeführt?)', e14);
  data.allProjects = allProjects || [];
  data.projects = data.allProjects.filter(p => p.org === activeOrg);
  const projectIds = new Set(data.projects.map(p => p.id));
  data.entries = (entries || []).filter(e => projectIds.has(e.project_id));
  // Ungefiltert für die Jahresübersicht im Tab "Finance": die braucht KH und peax
  // nebeneinander. Sonst gilt weiterhin die strikte Trennung - überall sonst wird
  // data.entries verwendet, das nur die aktive Firma enthält. RLS begrenzt das
  // hier ohnehin auf die Firmen, für die diese Person freigeschaltet ist.
  data.allEntries = entries || [];
  data.contractors = (contractors || []).filter(c => c.org === activeOrg);
  data.contractorAliase = contractorAliase || [];
  data.contractorProjects = (contractorProjects || []).filter(cp => projectIds.has(cp.project_id));
  data.timesheets = (timesheets || []).filter(t => projectIds.has(t.project_id));
  const timesheetIds = new Set(data.timesheets.map(t => t.id));
  data.timesheetDays = (timesheetDays || []).filter(d => timesheetIds.has(d.timesheet_id));
  data.candidates = (candidates || []).filter(cd => cd.org === activeOrg);
  const candidateIds = new Set(data.candidates.map(cd => cd.id));
  data.placements = (candidateProjects || []).filter(cp => candidateIds.has(cp.candidate_id));
  data.kunden = (kunden || []).filter(k => k.org === activeOrg);
  data.consultants = (allConsultants || []).filter(c => c.org === activeOrg);
  // Provisionssätze liegen seit Migration 20 in einer eigenen, nur für Admins
  // lesbaren Tabelle. Für alle anderen kommt hier schlicht nichts zurück - und
  // zwar von der Datenbank verweigert, nicht vom Frontend versteckt. Die Sätze
  // werden in die Consultant-Objekte gemischt, damit der restliche Code
  // unverändert mit c.rate / c.team_rate arbeiten kann.
  const satzVon = new Map((consultantRates || []).map(r => [r.consultant_id, r]));
  const satzRein = (c) => {
    const r = satzVon.get(c.id);
    return Object.assign(c, {
      rate: r ? r.rate : null,
      team_rate: r ? r.team_rate : null,
      team_rate_period: r ? r.team_rate_period : 'quarterly',
    });
  };
  // Auf der ungefilterten Liste, nicht auf data.consultants: das sind dieselben
  // Objekte (filter kopiert nicht), damit sind beide Sichten versorgt.
  (allConsultants || []).forEach(satzRein);
  data.ki_vorschlaege = kiVorschlaege || [];
  data.team_memberships = teamMemberships || [];
  render();
}

// Ermittelt, auf welche Firma(en) diese E-Mail-Adresse laut Tabelle user_access Zugriff hat
// (RLS liefert dort ohnehin nur die eigenen Zeilen zurück, siehe migration_multi_org.sql).
// Merkt sich die zuletzt gewählte Firma im Browser (localStorage), damit man nach einem
// Reload nicht immer wieder auf die erste Firma zurückfällt.
async function initOrgAccess() {
  // role kommt seit Migration 20 dazu. Fällt die Abfrage deswegen auf die Nase
  // (Migration noch nicht ausgeführt), wird ohne role weitergemacht - dann ist
  // niemand Admin und Finance bleibt für alle unsichtbar. Lieber zu streng als
  // zu offen.
  let { data: rows, error } = await sb.from('user_access').select('org, role');
  if (error) {
    console.warn('user_access mit role nicht lesbar (Migration 20 ausgeführt?) - versuche ohne', error);
    ({ data: rows, error } = await sb.from('user_access').select('org'));
  }
  if (error) { console.error('user_access konnte nicht geladen werden', error); allowedOrgs = []; activeOrg = null; istAdmin = false; return; }
  allowedOrgs = Array.from(new Set((rows || []).map(r => r.org)));
  istAdmin = (rows || []).some(r => r.role === 'admin');
  const saved = localStorage.getItem('activeOrg');
  activeOrg = allowedOrgs.includes(saved) ? saved : (allowedOrgs[0] || null);
}

function setActiveOrg(org) {
  if (!allowedOrgs.includes(org) || org === activeOrg) return;
  activeOrg = org;
  localStorage.setItem('activeOrg', org);
  loadAll();
}

// ---------- AUTH ----------

async function handleLogin(email, password) {
  authBusy = true; authError = ''; renderAuth();
  const { error } = await sb.auth.signInWithPassword({ email, password });
  authBusy = false;
  if (error) { authError = error.message; renderAuth(); }
}
// Nur @konzepthaus-consulting.com (KH) oder @peaxagency.com (peax) dürfen sich registrieren.
// Das ist nur die Frontend-Vorabprüfung für eine sofortige, freundliche Fehlermeldung – die
// eigentliche Absicherung läuft serverseitig über einen Datenbank-Trigger auf auth.users
// (siehe migration_email_domains.sql), da der anon key öffentlich ist und Registrierungen
// theoretisch auch direkt über die Supabase-API versucht werden könnten. Derselbe Trigger
// trägt bei der Registrierung automatisch den passenden Firmen-Zugriff in user_access ein
// (peaxagency.com -> peax, konzepthaus-consulting.com -> kh) - nur Zugriff auf BEIDE Firmen
// (wie bei Rike) muss weiterhin von Hand per SQL Editor ergänzt werden.
const ALLOWED_EMAIL_DOMAINS = ['konzepthaus-consulting.com', 'peaxagency.com'];
function isAllowedEmail(email) {
  const e = (email || '').toLowerCase().trim();
  return ALLOWED_EMAIL_DOMAINS.some(d => e.endsWith('@' + d));
}

async function handleSignup(email, password) {
  authError = ''; authInfo = '';
  if (!isAllowedEmail(email)) {
    authError = `Registrierung ist nur mit einer @${ALLOWED_EMAIL_DOMAINS.join(' oder @')} E-Mail-Adresse möglich.`;
    renderAuth();
    return;
  }
  authBusy = true; renderAuth();
  const { data: res, error } = await sb.auth.signUp({ email, password });
  authBusy = false;
  if (error) { authError = error.message; renderAuth(); return; }
  if (res.session) return; // logged in immediately (email confirmation disabled)
  authInfo = 'Konto erstellt. Falls E-Mail-Bestätigung aktiviert ist, bitte den Link in deinem Postfach öffnen und dich danach anmelden.';
  authMode = 'login';
  renderAuth();
}
async function handleLogout() {
  await sb.auth.signOut();
}

function renderAuth() {
  document.body.dataset.org = '';
  const app = document.getElementById('app');
  app.innerHTML = `

      <p class="sub">Freelancer-Dashboard – gemeinsam bearbeitet</p>
      <div class="card">
        <div class="auth-tabs">
          <button class="btn ${authMode === 'login' ? 'primary' : ''}" id="tabLogin">Anmelden</button>
          <button class="btn ${authMode === 'signup' ? 'primary' : ''}" id="tabSignup">Registrieren</button>
        </div>
        ${authError ? `<div class="banner error">${esc(authError)}</div>` : ''}
        ${authInfo ? `<div class="banner info">${esc(authInfo)}</div>` : ''}
        ${inviteEmail && authMode === 'signup' ? `<div class="banner info">Persönlicher Einladungslink für <strong>${esc(inviteEmail)}</strong> – einfach ein Passwort wählen und Konto erstellen.</div>` : ''}
        <div class="field"><label>E-Mail</label><input type="email" id="authEmail" value="${esc(inviteEmail && authMode === 'signup' ? inviteEmail : '')}"></div>
        <div class="field"><label>Passwort</label><input type="password" id="authPassword"></div>
        <button class="btn primary" id="authSubmit" style="width:100%;" ${authBusy ? 'disabled' : ''}>
          ${authBusy ? '…' : (authMode === 'login' ? 'Anmelden' : 'Konto erstellen')}
        </button>
      </div>
    </div>
  `;
  document.getElementById('tabLogin').addEventListener('click', () => { authMode = 'login'; authError=''; authInfo=''; renderAuth(); });
  document.getElementById('tabSignup').addEventListener('click', () => { authMode = 'signup'; authError=''; authInfo=''; renderAuth(); });
  document.getElementById('authSubmit').addEventListener('click', () => {

    const password = document.getElementById('authPassword').value;
    if (!email || !password) { authError = 'Bitte E-Mail und Passwort ausfüllen.'; renderAuth(); return; }

  });
}

function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="auth-wrap">

}

        ${activeOrg === 'peax'

  app.querySelectorAll('nav.tabs button[data-tab]').forEach(b => b.addEventListener('click', () => {
    activeTab = b.dataset.tab; reportConfig = null; offenesMenu = null; render();
  }));
  // Oberbegriff angeklickt: Menü auf- oder zuklappen, ohne den Reiter zu wechseln.
  app.querySelectorAll('nav.tabs button[data-navgroup]').forEach(b => b.addEventListener('click', (ev) => {
    ev.stopPropagation();
    offenesMenu = (offenesMenu === b.dataset.navgroup) ? null : b.dataset.navgroup;

  const content = document.getElementById('tab-content');
  // Sicherheitsnetz: Wer den Reiter nicht sehen darf, landet auf dem Dashboard -

  if (!darfTab(activeTab)) activeTab = 'dashboard';

  else if (activeTab === 'ist') content.innerHTML = monthEntryHTML('ist');

  else if (activeTab === 'timesheets') content.innerHTML = timesheetsHTML();
  else if (activeTab === 'kunden') content.innerHTML = kundenHTML();
  else if (activeTab === 'crm') content.innerHTML = crmHTML();
  else if (activeTab === 'placements') content.innerHTML = placementsHTML();
  else if (activeTab === 'bank') content.innerHTML = bankHTML();

  wireTabEvents();
  if (activeTab === 'dashboard') setupChart();
  if (modalConfig && modalConfig.type === 'project') renderModal();
  if (modalConfig && modalConfig.type === 'consultant') renderConsultantModal(modalConfig);
  if (modalConfig && modalConfig.type === 'contractor') renderContractorModal(modalConfig);
  if (modalConfig && modalConfig.type === 'candidate') renderCandidateModal(modalConfig);
  if (modalConfig && modalConfig.type === 'kunde') renderKundeModal(modalConfig);
}

function dashboardHTML() {
  const months = allMonthsUsed();
  const sollAll = entriesOf('soll');
  const istAll = entriesOf('ist');
  const sollEntries = dashMonth === 'all' ? sollAll : sollAll.filter(e => e.month === dashMonth);
  const istEntries = dashMonth === 'all' ? istAll : istAll.filter(e => e.month === dashMonth);
  const soll = sumEntries(sollEntries);
  const ist = sumEntries(istEntries);

  const aktiveFreelancer = data.projects.filter(p => computedStatus(p) === 'Aktiv').length;
  // Marge/h für Contract- und Perm-Projekte getrennt, da bei Perm die "Marge" die gesamte
  // Pauschale abbildet und mit echten Stundensätzen nicht vergleichbar/mischbar ist.
  const margenContract = data.projects.filter(p => p.projekttyp !== 'perm').map(margeH).filter(v => v > 0);
  const avgMargeContract = margenContract.length ? margenContract.reduce((a, b) => a + b, 0) / margenContract.length : 0;
  const margenPerm = data.projects.filter(p => p.projekttyp === 'perm').map(margeH).filter(v => v > 0);
  const avgMargePerm = margenPerm.length ? margenPerm.reduce((a, b) => a + b, 0) / margenPerm.length : 0;
  const margeGesamtFaktor = ist.kosten > 0 ? ist.umsatz / ist.kosten : 0;

  const erfStunden = soll.stunden > 0 ? ist.stunden / soll.stunden : 0;
  const erfUmsatz = soll.umsatz > 0 ? ist.umsatz / soll.umsatz : 0;
  const erfRohertrag = soll.rohertrag > 0 ? ist.rohertrag / soll.rohertrag : 0;

  const rows = [
    { label: 'Stunden', soll: soll.stunden, ist: ist.stunden, erf: erfStunden, fmt: v => fmtNum(v, 0) + ' Std.' },
    { label: 'Umsatz', soll: soll.umsatz, ist: ist.umsatz, erf: erfUmsatz, fmt: fmtEUR },
    { label: 'Rohertrag', soll: soll.rohertrag, ist: ist.rohertrag, erf: erfRohertrag, fmt: fmtEUR },

  const monthOptions = ['<option value="all">Alle Monate</option>']
    .concat(months.map(m => `<option value="${m}" ${dashMonth === m ? 'selected' : ''}>${monthLabel(m)}</option>`)).join('');

  const perKunde = customerBreakdown(sollEntries, istEntries);

  return `

      <div class="kpi amber"><div class="label">Ø Marge/h (Contract)</div><div class="value">${fmtEUR(avgMargeContract)}</div><div class="hint">über alle Contract-Sätze &gt; 0</div></div>
      <div class="kpi amber"><div class="label">Ø Marge (Perm)</div><div class="value">${fmtEUR(avgMargePerm)}</div><div class="hint">über alle Perm-Pauschalen &gt; 0</div></div>
      <div class="kpi blue"><div class="label">Umsatz / Kosten-Faktor (IST)</div><div class="value">${fmtNum(margeGesamtFaktor, 2)}×</div><div class="hint">IST-Umsatz ÷ IST-Kosten</div></div>
      <div class="kpi teal"><div class="label">Erfüllung Umsatz</div><div class="value">${fmtPct(erfUmsatz)}</div><div class="hint">IST ÷ SOLL</div></div>
    </div>
    <div class="card panel">
      <h2>SOLL / IST Vergleich</h2>
      <table>
        <thead><tr><th>Bereich</th><th>SOLL</th><th>IST</th><th>Abweichung</th><th>Erfüllung</th><th>Status</th></tr></thead>
        <tbody>
          ${rows.map(r => {
            const abw = r.ist - r.soll;
            const st = statusFromErf(r.erf, r.soll > 0);
            return `<tr>
              <td><strong>${r.label}</strong></td>
              <td>${r.fmt(r.soll)}</td>

              <td style="color:${abw < 0 ? 'var(--red)' : 'var(--green)'}">${abw >= 0 ? '+' : ''}${r.fmt(abw)}</td>
              <td>${r.soll > 0 ? fmtPct(r.erf) : '–'}</td>

      <h2 style="font-size:15px;margin:0 0 12px;">Umsatz pro Kunde ${dashMonth === 'all' ? '(alle Monate)' : '(' + monthLabel(dashMonth) + ')'}</h2>

  `;

function setupChart() {
  const sel = document.getElementById('dashMonthSel');
  if (sel) sel.addEventListener('change', () => { dashMonth = sel.value; render(); });

  // Kunden-Tortendiagramm: IST-Umsatz-Verteilung über alle Kunden, innerhalb des oben gewählten Zeitraums.
  const kundeCtx = document.getElementById('kundeChart');
  if (kundeCtx) {
    const sollForChart = dashMonth === 'all' ? entriesOf('soll') : entriesOf('soll').filter(e => e.month === dashMonth);
    const istForChart = dashMonth === 'all' ? entriesOf('ist') : entriesOf('ist').filter(e => e.month === dashMonth);
    const perKundeForChart = customerBreakdown(sollForChart, istForChart);
    if (kundeChart) { kundeChart.destroy(); kundeChart = null; }
    if (perKundeForChart.length) {
      kundeChart = new Chart(kundeCtx, {
        type: 'pie',
        data: {
          labels: perKundeForChart.map(k => k.kunde),
          datasets: [{ data: perKundeForChart.map(k => k.istUmsatz), backgroundColor: perKundeForChart.map((k, i) => PIE_COLORS[i % PIE_COLORS.length]) }],
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } },
      });
    }
  }

  // Checkboxen zur Auswahl, welche Kennzahlen im Monatstrend gezeigt werden (einzeln oder alle).
  ['umsatz', 'kosten', 'rohertrag'].forEach(key => {
    const cb = document.getElementById('trendShow_' + key);
    if (cb) cb.addEventListener('change', () => { trendShow[key] = cb.checked; render(); });
  });
  const trendShowAllBtn = document.getElementById('trendShowAllBtn');
  if (trendShowAllBtn) trendShowAllBtn.addEventListener('click', () => { trendShow = { umsatz: true, kosten: true, rohertrag: true }; render(); });

  // Monatstrend als Liniendiagramm: Umsatz, Kosten und Rohertrag (jeweils IST) in eigenen Farben,
  // zusätzlich SOLL als gestrichelte Linie in einem Grauton je Kennzahl (heller/dunkler), damit man
  // IST vs. SOLL für alle drei Kennzahlen auf einen Blick vergleichen kann.
  // tension: 0 = gerade Linien zwischen den echten Monatswerten, damit zwischen Monaten ohne
  // Daten keine unsinnigen "Hügel" durch Kurvenglättung entstehen.
  const months = allMonthsUsed();
  const istByMonth = months.map(m => sumEntries(entriesOf('ist').filter(e => e.month === m)));
  const sollByMonth = months.map(m => sumEntries(entriesOf('soll').filter(e => e.month === m)));
  const labels = months.map(monthLabel);
  const trendDatasetDefs = [
    // IST kräftig, SOLL blass daneben - unterschieden wird über Helligkeit,
    // nicht über die Farbe. Rot bleibt nur für die Kosten, weil es dort eine
    // Aussage trägt.
    { key: 'umsatz', label: 'Umsatz', color: '#1a1a1a', sollColor: '#c8c8c8' },
    { key: 'kosten', label: 'Kosten', color: '#c0392b', sollColor: '#e8bdb7' },
    { key: 'rohertrag', label: 'Rohertrag', color: '#2f7d4f', sollColor: '#bcd6c6' },
  ];

  const ctx = document.getElementById('trendChart');
  if (trendChart) { trendChart.destroy(); trendChart = null; }
  if (ctx) {
    const activeDefs = trendDatasetDefs.filter(d => trendShow[d.key]);
    const datasets = [];
    activeDefs.forEach(d => {
      datasets.push({
        label: d.label + ' (IST)',
        data: istByMonth.map(v => v[d.key]),
        borderColor: d.color,
        backgroundColor: d.color,
        fill: false,
        tension: 0,
      });
      datasets.push({
        label: d.label + ' (SOLL)',
        data: sollByMonth.map(v => v[d.key]),
        borderColor: d.sollColor,
        backgroundColor: d.sollColor,
        borderDash: [6, 4],
        fill: false,
        tension: 0,
        pointRadius: 2,
      });
    });
    trendChart = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true } } },
    });
  }
}

// Baut einen durchsuchbaren Text aus genau den Werten, die auch in der Projekte-Tabelle
// angezeigt werden (Art, Kunde, Contractor, Daten, Zahlen, Consultants, Status) – so findet
// die Suche wie in Excel jedes Wort, das irgendwo in der Zeile sichtbar ist.
function projectSearchText(p) {
  const isPerm = p.projekttyp === 'perm';
  return [
    isPerm ? 'Perm' : 'Contract',
    p.kunde,
    p.contractor,
    p.rechnungsname,
    fmtDate(p.start_date),
    fmtDate(p.end_date),
    isPerm ? '' : p.wochenstunden,
    isPerm ? '1 Std. Pauschale' : fmtNum(projectTotalSollHours(p), 1),
    fmtEUR(p.pay_h),
    fmtEUR(p.charge_h),
    fmtEUR(margeH(p)),
    fmtPct(margePct(p)),
    [p.consultant1_id, p.consultant2_id].filter(Boolean).map(consultantName).join(' '),
    computedStatus(p),
  ].join(' ').toLowerCase();
}

// Sortiert und filtert die Projektliste für die Projekte-Ansicht. Kunden werden dabei
// immer alphabetisch einsortiert (bzw. per Sortier-Dropdown auch nach Start/Ende).
function filteredSortedProjects() {
  let list = data.projects.slice();
  if (projFilterKunde !== 'all') list = list.filter(p => p.kunde === projFilterKunde);
  if (projFilterStatus !== 'all') list = list.filter(p => computedStatus(p) === projFilterStatus);
  if (projFilterArt !== 'all') list = list.filter(p => (p.projekttyp === 'perm' ? 'perm' : 'contract') === projFilterArt);
  if (projFilterStartMonat) list = list.filter(p => p.start_date && p.start_date.slice(0, 7) === projFilterStartMonat);
  if (projFilterEndeMonat) list = list.filter(p => p.end_date && p.end_date.slice(0, 7) === projFilterEndeMonat);
  if (projSearch.trim()) {
    const q = projSearch.trim().toLowerCase();
    list = list.filter(p => projectSearchText(p).includes(q));
  }

  const dateVal = (s, fallback) => s ? parseDateUTC(s) : fallback;
  if (projSort === 'start_asc') list.sort((a, b) => dateVal(a.start_date, Infinity) - dateVal(b.start_date, Infinity));
  else if (projSort === 'start_desc') list.sort((a, b) => dateVal(b.start_date, -Infinity) - dateVal(a.start_date, -Infinity));
  else if (projSort === 'end_asc') list.sort((a, b) => dateVal(a.end_date, Infinity) - dateVal(b.end_date, Infinity));
  else if (projSort === 'end_desc') list.sort((a, b) => dateVal(b.end_date, -Infinity) - dateVal(a.end_date, -Infinity));
  else list.sort((a, b) => a.kunde.localeCompare(b.kunde) || a.contractor.localeCompare(b.contractor));

  return list;
}

// peax arbeitet beim SOLL anders als KH: statt automatisch aus Std./Woche x Laufzeit
// berechnet zu werden, wird die insgesamt bestellte Stundenzahl einmalig manuell im
// Projekt eingetragen (amount_ordered_hours). "Verbleibend" wird deshalb hier live
// berechnet (bestellt minus Summe aller bisher erfassten IST-Stunden dieses Projekts),
// statt gespeichert zu werden - so bleibt es automatisch aktuell, auch wenn neue
// IST-Stunden über die KI-Vorschläge aus Weclapp dazukommen.
function amountLeftHours(p) {
  if (p.amount_ordered_hours == null) return null;
  const used = data.entries.filter(e => e.kind === 'ist' && e.project_id === p.id).reduce((s, e) => s + (e.stunden || 0), 0);
  return round1(p.amount_ordered_hours - used);
}

    // Neue Projekte gehören automatisch zur aktuell angezeigten Firma (activeOrg) - kein
    // eigenes Auswahlfeld dafür, damit hier nichts versehentlich der falschen Firma

  render();
}

      const amountOrderedEl = document.getElementById('f_amountordered');
      const dealValueEl = document.getElementById('f_dealvalue');
      payload.amount_ordered_hours = amountOrderedEl && amountOrderedEl.value !== '' ? Number(amountOrderedEl.value) : null;
      payload.deal_value = dealValueEl && dealValueEl.value !== '' ? Number(dealValueEl.value) : null;
    }
    let proj = null;
    if (c.id) {
      proj = await save(sb.from('projects').update(payload).eq('id', c.id).select().single(), 'Projekt');
    } else {
      proj = await save(sb.from('projects').insert(payload).select().single(), 'Projekt');
    }
    if (!proj) return; // Modal offen lassen, damit die Eingaben nicht verloren gehen
    if (proj) {
      // Contractor-Zugang (n:m, siehe contractor_projects) - Mehrfachauswahl, da z.B. bei
      // Siemens mehrere Contractors am selben Projekt arbeiten.
      const checkedIds = Array.from(document.querySelectorAll('.f_contractor_project:checked')).map(el => el.value);
      const existingIds = new Set(c.id ? data.contractorProjects.filter(cp => cp.project_id === c.id).map(cp => cp.contractor_id) : []);
      const toRemove = Array.from(existingIds).filter(id => !checkedIds.includes(id));
      const toAdd = checkedIds.filter(id => !existingIds.has(id));
      let fehler = 0;
      for (const contractorId of toRemove) if (!await save(sb.from('contractor_projects').delete().eq('project_id', proj.id).eq('contractor_id', contractorId), 'Contractor-Zuordnung', true)) fehler++;
      for (const contractorId of toAdd) if (!await save(sb.from('contractor_projects').insert({ project_id: proj.id, contractor_id: contractorId }), 'Contractor-Zuordnung', true)) fehler++;
      if (fehler) alert(`Das Projekt wurde gespeichert, aber ${fehler} Contractor-Zuordnung(en) nicht. Details in der Browser-Konsole.`);
    }
    modalConfig = null;
    await loadAll();
    // Auch bei peax wird das SOLL automatisch aus der Projektlaufzeit berechnet - nur die
    // Grundlage ist anders (amount_ordered_hours statt Std./Woche, siehe projectMonthSollHours).
    if (proj) await syncAutoSoll(proj);
  });
}

// ---------- SOLL / IST MONATSERFASSUNG ----------

// Baut für einen gegebenen Monat/Kind (soll/ist) pro Projekt eine Zeile mit allen angezeigten
// Werten (inkl. berechnetem Umsatz/Kosten/Rohertrag) – Basis sowohl für die Tabelle als auch
// für die Excel-artige Volltextsuche und die Filter.
function entryRows(kind, monthVal) {
  const entries = entriesOf(kind);
  const [monthStart, monthEnd] = monthRangeUTC(monthVal);
  return data.projects
    .filter(p => {
      // Projekte, die erst nach diesem Monat starten, werden für diesen Monat gar nicht erst
      // angezeigt (macht keinen Sinn, z.B. im Januar einen Contractor zu sehen, der erst zum
      // 01.02. startet).
      const ps = parseDateUTC(p.start_date);
      if (ps !== null && ps > monthEnd) return false;
      // Projekte, die vor diesem Monat schon beendet wurden: nur noch anzeigen, wenn es für
      // genau diesen Monat bereits einen IST-Eintrag gibt (z.B. ein paar Reststunden kurz nach
      // Vertragsende). So verschwinden alte, bereits erfasste Werte nicht, aber ein beendeter
      // Contractor taucht nicht dauerhaft in jedem künftigen Monat als leere Zeile auf.
      const pe = parseDateUTC(p.end_date);
      if (pe !== null && pe < monthStart) {
        if (kind !== 'ist') return false;
        return entries.some(e => e.project_id === p.id && e.month === monthVal);
      }
      return true;
    })
    .map(p => {
      const active = isActiveInMonth(p, monthVal);
      // IST-Stunden sollen auch nachträglich für bereits beendete Contractor eintragbar sein
      // (echte geleistete Stunden können außerhalb des geplanten Projektfensters liegen).
      // Nur bei SOLL bleibt die Sperre, da SOLL automatisch aus der Projektlaufzeit berechnet wird.
      const editable = active || kind === 'ist';
      const entry = entries.find(e => e.project_id === p.id && e.month === monthVal);
      const stunden = entry ? entry.stunden : '';
      const c = computeEntry({ project_id: p.id, stunden: entry ? entry.stunden : 0 });
      const badge = kind === 'soll' && entry ? `<span class="mini-badge ${entry.auto ? 'auto' : 'manuell'}">${entry.auto ? 'auto' : 'manuell'}</span>` : '';
      return { p, editable, entry, stunden, c, badge, status: computedStatus(p), isPerm: p.projekttyp === 'perm' };
    });
}

// Durchsuchbarer Text pro Zeile – analog zur Projekte-Suche, inkl. der für diesen Monat
// berechneten Stunden/Umsatz/Kosten/Rohertrag, damit man z.B. auch nach Beträgen suchen kann.
function entryRowSearchText(row) {
  return [
    row.isPerm ? 'Perm' : 'Contract',
    row.p.kunde, row.p.contractor,
    fmtEUR(row.p.pay_h), fmtEUR(row.p.charge_h),
    row.stunden !== '' ? fmtNum(row.stunden, 1) : '',
    fmtEUR(row.c.umsatz), fmtEUR(row.c.kosten), fmtEUR(row.c.rohertrag),
    row.status,
  ].join(' ').toLowerCase();
}

function filteredEntryRows(kind, monthVal) {
  let rows = entryRows(kind, monthVal);
  const filterKunde = entryFilterKunde[kind];
  const filterArt = entryFilterArt[kind];
  const filterStatus = entryFilterStatus[kind];
  const search = entrySearch[kind];
  if (filterKunde !== 'all') rows = rows.filter(r => r.p.kunde === filterKunde);
  if (filterArt !== 'all') rows = rows.filter(r => (r.isPerm ? 'perm' : 'contract') === filterArt);
  if (filterStatus !== 'all') rows = rows.filter(r => r.status === filterStatus);
  if (search.trim()) {
    const q = search.trim().toLowerCase();
    rows = rows.filter(r => entryRowSearchText(r).includes(q));
  }
  return rows;
}

        <tbody>
          ${rows.map(({ p, editable, stunden, c, badge }) => `
              <tr class="${editable ? '' : 'inactive'}">
                <td>${esc(p.kunde)}</td><td>${esc(p.contractor)}</td>

          </tr>
        </tfoot>

}

async function setEntry(kind, projectId, monthVal, stunden) {
  const existing = data.entries.find(e => e.project_id === projectId && e.kind === kind && e.month === monthVal);
  if (stunden === '' || stunden === null || isNaN(stunden)) {
    if (existing && !await save(sb.from('entries').delete().eq('id', existing.id), 'Stundenwert löschen')) return;
    if (kind === 'soll') {
      const proj = project(projectId);
      if (proj) { await syncAutoSoll(proj); return; }
    }
  } else if (existing) {
    const patch = { stunden };
    if (kind === 'soll') patch.auto = false; // manuelle Änderung überschreibt die Automatik
    if (!await save(sb.from('entries').update(patch).eq('id', existing.id), 'Stundenwert')) return;
  } else {
    const payload = { project_id: projectId, kind, month: monthVal, stunden };
    if (kind === 'soll') payload.auto = false;
    if (!await save(sb.from('entries').insert(payload), 'Stundenwert')) return;
  }
  await loadAll();
}

// ---------- KI-VORSCHLÄGE (aus Weclapp-Rechnungen) ----------

// Zeigt von der KI aus Weclapp-Eingangsrechnungen vorgeschlagene IST-Einträge (Contractor, Monat,
// Stunden) zur Prüfung an. Erst nach "Übernehmen" wird daraus ein echter IST-Eintrag – die KI
// schreibt nie direkt in die entries-Tabelle. Kommt aus einer separaten Supabase Edge Function
// (siehe edge-functions/weclapp-sync und WECLAPP_KI_SETUP.md), die diese Tabelle befüllt.

// Direktlink zur Original-Rechnung in Weclapp, damit man beim Prüfen eines Vorschlags die
// tatsächliche Rechnung danebenlegen kann. source_ref ist die Weclapp-purchaseInvoice-ID.
function weclappInvoiceUrl(v) {
  if (v.source !== 'weclapp' || !v.source_ref) return null;
  // encodeURIComponent, weil source_ref aus Weclapp kommt und hier in eine URL
  // eingebaut wird - sonst könnte ein Sonderzeichen darin das Ziel des Links
  // verändern. esc() kommt zusätzlich beim Einsetzen ins href-Attribut dazu.
  return `${WECLAPP_WEB_URL}/app/purchase-invoice/${encodeURIComponent(v.source_ref)}`;
}

async function approveKiVorschlag(id) {
  const projSel = document.querySelector(`[data-vid="${id}"][data-field="project"]`);
  const monthInp = document.querySelector(`[data-vid="${id}"][data-field="month"]`);
  const stundenInp = document.querySelector(`[data-vid="${id}"][data-field="stunden"]`);
  const projectId = projSel ? projSel.value : '';
  const monthVal = monthInp ? monthInp.value : '';
  const stunden = stundenInp && stundenInp.value !== '' ? Number(stundenInp.value) : NaN;
  if (!projectId || !monthVal || isNaN(stunden)) {
    alert('Bitte Projekt, Monat und Stunden ausfüllen, bevor du übernimmst.');
    return;
  }
  await setEntry('ist', projectId, monthVal, stunden);
  if (!await save(sb.from('ki_vorschlaege').update({ status: 'approved', project_id: projectId, month: monthVal, stunden, reviewed_at: new Date().toISOString() }).eq('id', id), 'Vorschlag übernehmen')) return;
  await loadAll();
}

async function rejectKiVorschlag(id) {
  if (!await save(sb.from('ki_vorschlaege').update({ status: 'rejected', reviewed_at: new Date().toISOString() }).eq('id', id), 'Vorschlag ablehnen')) return;
  await loadAll();
}

async function resetKiVorschlag(id) {
  if (!await save(sb.from('ki_vorschlaege').update({ status: 'pending', reviewed_at: null }).eq('id', id), 'Vorschlag zurücksetzen')) return;
  await loadAll();
}

function wireTabEvents() {
  const addBtn = document.getElementById('addProjectBtn');
  if (addBtn) addBtn.addEventListener('click', () => openProjectModal(null));
  const recalcBtn = document.getElementById('recalcSollBtn');
  if (recalcBtn) recalcBtn.addEventListener('click', async () => { recalcBtn.disabled = true; recalcBtn.textContent = 'Berechne…'; await recalcAllSoll(); });
  document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openProjectModal(b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteProject(b.dataset.del)));
  const projFilterKundeSel = document.getElementById('projFilterKundeSel');
  if (projFilterKundeSel) projFilterKundeSel.addEventListener('change', () => { projFilterKunde = projFilterKundeSel.value; render(); });
  const projFilterStatusSel = document.getElementById('projFilterStatusSel');
  if (projFilterStatusSel) projFilterStatusSel.addEventListener('change', () => { projFilterStatus = projFilterStatusSel.value; render(); });
  const projFilterArtSel = document.getElementById('projFilterArtSel');
  if (projFilterArtSel) projFilterArtSel.addEventListener('change', () => { projFilterArt = projFilterArtSel.value; render(); });
  const projFilterStartMonatInput = document.getElementById('projFilterStartMonatInput');
  if (projFilterStartMonatInput) projFilterStartMonatInput.addEventListener('change', () => { projFilterStartMonat = projFilterStartMonatInput.value; render(); });
  const projFilterEndeMonatInput = document.getElementById('projFilterEndeMonatInput');
  if (projFilterEndeMonatInput) projFilterEndeMonatInput.addEventListener('change', () => { projFilterEndeMonat = projFilterEndeMonatInput.value; render(); });
  const projSortSel = document.getElementById('projSortSel');
  if (projSortSel) projSortSel.addEventListener('change', () => { projSort = projSortSel.value; render(); });
  const projFilterResetBtn = document.getElementById('projFilterResetBtn');
  if (projFilterResetBtn) projFilterResetBtn.addEventListener('click', () => { projFilterKunde = 'all'; projFilterStatus = 'all'; projFilterArt = 'all'; projFilterStartMonat = ''; projFilterEndeMonat = ''; projSearch = ''; render(); });
  const projSearchInput = document.getElementById('projSearchInput');
  if (projSearchInput) {
    // Live-Filterung bei jedem Tastendruck (wie in Excel). Da render() die gesamte Tab-HTML
    // neu aufbaut, geht der Fokus sonst nach jedem Zeichen verloren – deshalb Fokus/Cursor
    // direkt nach dem Neu-Rendern wiederherstellen.
    projSearchInput.addEventListener('input', () => {
      projSearch = projSearchInput.value;
      render();
      const freshInput = document.getElementById('projSearchInput');
      if (freshInput) {
        freshInput.focus();
        const pos = freshInput.value.length;
        freshInput.setSelectionRange(pos, pos);
      }
    });
  }
  const projSearchClearBtn = document.getElementById('projSearchClearBtn');
  if (projSearchClearBtn) projSearchClearBtn.addEventListener('click', () => { projSearch = ''; render(); });
  ['soll', 'ist'].forEach(kind => {
    const picker = document.getElementById('monthPicker_' + kind);
    if (picker) picker.addEventListener('change', () => { if (kind === 'soll') sollMonth = picker.value; else istMonth = picker.value; render(); });

    const entryFilterArtSel = document.getElementById('entryFilterArtSel_' + kind);
    if (entryFilterArtSel) entryFilterArtSel.addEventListener('change', () => { entryFilterArt[kind] = entryFilterArtSel.value; render(); });
    const entryFilterKundeSel = document.getElementById('entryFilterKundeSel_' + kind);
    if (entryFilterKundeSel) entryFilterKundeSel.addEventListener('change', () => { entryFilterKunde[kind] = entryFilterKundeSel.value; render(); });
    const entryFilterStatusSel = document.getElementById('entryFilterStatusSel_' + kind);
    if (entryFilterStatusSel) entryFilterStatusSel.addEventListener('change', () => { entryFilterStatus[kind] = entryFilterStatusSel.value; render(); });
    const entryFilterResetBtn = document.getElementById('entryFilterResetBtn_' + kind);
    if (entryFilterResetBtn) entryFilterResetBtn.addEventListener('click', () => {
      entryFilterKunde[kind] = 'all'; entryFilterArt[kind] = 'all'; entryFilterStatus[kind] = 'all'; entrySearch[kind] = ''; render();
    });
    const entrySearchInput = document.getElementById('entrySearchInput_' + kind);
    if (entrySearchInput) {
      // Live-Filterung bei jedem Tastendruck (wie in Excel), inkl. Fokus-/Cursor-Wiederherstellung
      // nach dem Neu-Rendern (siehe projSearchInput weiter oben für die gleiche Logik).
      entrySearchInput.addEventListener('input', () => {
        entrySearch[kind] = entrySearchInput.value;
        render();
        const freshInput = document.getElementById('entrySearchInput_' + kind);
        if (freshInput) {
          freshInput.focus();
          const pos = freshInput.value.length;
          freshInput.setSelectionRange(pos, pos);
        }
      });
    }
    const entrySearchClearBtn = document.getElementById('entrySearchClearBtn_' + kind);
    if (entrySearchClearBtn) entrySearchClearBtn.addEventListener('click', () => { entrySearch[kind] = ''; render(); });
  });
  const addConsultantBtn = document.getElementById('addConsultantBtn');
  if (addConsultantBtn) addConsultantBtn.addEventListener('click', () => openConsultantModal(null));
  document.querySelectorAll('[data-edit-consultant]').forEach(b => b.addEventListener('click', () => openConsultantModal(b.dataset.editConsultant)));
  document.querySelectorAll('[data-del-consultant]').forEach(b => b.addEventListener('click', () => deleteConsultant(b.dataset.delConsultant)));
  const kiFilterStatusSel = document.getElementById('kiFilterStatusSel');
  if (kiFilterStatusSel) kiFilterStatusSel.addEventListener('change', () => { kiFilterStatus = kiFilterStatusSel.value; render(); });

  const bankJahrSel = document.getElementById('bankJahrSel');
  if (bankJahrSel) bankJahrSel.addEventListener('change', () => { bankJahr = Number(bankJahrSel.value); render(); });
  const bankExportBtn = document.getElementById('bankExportBtn');
  if (bankExportBtn) bankExportBtn.addEventListener('click', exportBankReport);
  document.querySelectorAll('[data-approve-ki]').forEach(b => b.addEventListener('click', () => approveKiVorschlag(b.dataset.approveKi)));
  document.querySelectorAll('[data-reject-ki]').forEach(b => b.addEventListener('click', () => rejectKiVorschlag(b.dataset.rejectKi)));
  document.querySelectorAll('[data-reset-ki]').forEach(b => b.addEventListener('click', () => resetKiVorschlag(b.dataset.resetKi)));
  const provPicker = document.getElementById('provMonthPicker');
  if (provPicker) provPicker.addEventListener('change', () => { provMonth = provPicker.value; reportConfig = null; render(); });
  document.querySelectorAll('[data-report]').forEach(b => b.addEventListener('click', () => { reportConfig = { consultantId: b.dataset.report }; render(); }));
  const reportBack = document.querySelector('[data-report-back]');
  if (reportBack) reportBack.addEventListener('click', () => { reportConfig = null; render(); });
  const reportPrint = document.querySelector('[data-report-print]');
  if (reportPrint) reportPrint.addEventListener('click', () => window.print());
  document.querySelectorAll('input[data-kind]').forEach(inp => {
    inp.addEventListener('change', () => {
      const kind = inp.dataset.kind;
      const pid = inp.dataset.pid;
      const monthVal = kind === 'soll' ? sollMonth : istMonth;
      const val = inp.value === '' ? '' : Number(inp.value);
      setEntry(kind, pid, monthVal, val);
    });
  });
  const addContractorBtn = document.getElementById('addContractorBtn');
  if (addContractorBtn) addContractorBtn.addEventListener('click', () => openContractorModal(null));
  document.querySelectorAll('[data-edit-contractor]').forEach(b => b.addEventListener('click', () => openContractorModal(b.dataset.editContractor)));
  document.querySelectorAll('[data-del-contractor]').forEach(b => b.addEventListener('click', () => deleteContractor(b.dataset.delContractor)));
  document.querySelectorAll('[data-copy-invite]').forEach(b => b.addEventListener('click', async () => {
    const c = contractor(b.dataset.copyInvite);
    if (!c || !c.email) return;
    const link = location.origin + location.pathname + '?invite=' + encodeURIComponent(c.email);
    try {
      await navigator.clipboard.writeText(link);
      const old = b.textContent; b.textContent = 'Kopiert!'; setTimeout(() => { b.textContent = old; }, 1500);
    } catch (e) {
      prompt('Link kopieren (Strg/Cmd+C):', link);
    }
  }));
  const tsFilterStatusSel = document.getElementById('tsFilterStatusSel');
  if (tsFilterStatusSel) tsFilterStatusSel.addEventListener('change', () => { tsFilterStatus = tsFilterStatusSel.value; render(); });
  document.querySelectorAll('[data-approve-ts]').forEach(b => b.addEventListener('click', () => approveTimesheetAdmin(b.dataset.approveTs)));
  document.querySelectorAll('[data-reject-ts]').forEach(b => b.addEventListener('click', () => rejectTimesheetAdmin(b.dataset.rejectTs)));
  const addCandidateBtn = document.getElementById('addCandidateBtn');
  if (addCandidateBtn) addCandidateBtn.addEventListener('click', () => openCandidateModal(null));
  document.querySelectorAll('[data-edit-candidate]').forEach(b => b.addEventListener('click', () => openCandidateModal(b.dataset.editCandidate)));
  document.querySelectorAll('[data-del-candidate]').forEach(b => b.addEventListener('click', () => deleteCandidate(b.dataset.delCandidate)));
  document.querySelectorAll('[data-view-candidate-pl]').forEach(b => b.addEventListener('click', () => openCandidateModal(b.dataset.viewCandidatePl)));
  document.querySelectorAll('[data-view-kunde-pl]').forEach(b => b.addEventListener('click', () => openKundeModal(b.dataset.viewKundePl)));
  const addKundeBtn = document.getElementById('addKundeBtn');
  if (addKundeBtn) addKundeBtn.addEventListener('click', () => openKundeModal(null));
  document.querySelectorAll('[data-edit-kunde]').forEach(b => b.addEventListener('click', () => openKundeModal(b.dataset.editKunde)));
  document.querySelectorAll('[data-del-kunde]').forEach(b => b.addEventListener('click', () => deleteKunde(b.dataset.delKunde)));
  const reportKundeSel = document.getElementById('reportKundeSel');
  if (reportKundeSel) reportKundeSel.addEventListener('change', () => { reportKundeId = reportKundeSel.value; render(); });
  const reportMonthPicker = document.getElementById('reportMonthPicker');
  if (reportMonthPicker) reportMonthPicker.addEventListener('change', () => { reportMonth = reportMonthPicker.value; render(); });
  const generateKundenReportBtn = document.getElementById('generateKundenReportBtn');
  if (generateKundenReportBtn) generateKundenReportBtn.addEventListener('click', () => generateKundenReport());
}

// ---------- CONTRACTOR-PORTAL (externe Freelancer, siehe migration_contractor_timesheets.sql) ----------
// Läuft komplett getrennt von der internen App oben - ausschließlich über die dort angelegten
// SECURITY DEFINER-Funktionen (sb.rpc(...)), nie über direkten Tabellenzugriff, damit ein
// Contractor rein technisch gar nicht an andere Daten kommen kann.

// Prüft, ob die eingeloggte E-Mail zu einem Contractor gehört (kein interner Zugriff nötig).
async function initContractorAccess() {
  const { data: rows, error } = await sb.rpc('my_contractor_profile');
  if (error) { console.error('Contractor-Profil konnte nicht geladen werden (migration_contractor_timesheets.sql ausgeführt?)', error); return false; }
  if (!rows || !rows.length) return false;
  contractorProfile = rows[0];
  return true;
}

async function loadContractorPortal() {
  const { data: projects, error } = await sb.rpc('my_timesheet_projects');
  if (error) console.error('Projekte des Contractors konnten nicht geladen werden', error);
  contractorProjects = projects || [];
  if (!contractorProjects.find(p => p.project_id === contractorProjectId)) {
    contractorProjectId = contractorProjects.length ? contractorProjects[0].project_id : null;
  }
  await loadContractorTimesheet();
}

async function loadContractorTimesheet() {
  if (!contractorProjectId) { contractorTimesheet = null; contractorDays = []; renderContractorPortal(); return; }
  const { data: tsRows, error } = await sb.rpc('my_timesheet', { p_project_id: contractorProjectId, p_month: contractorMonth });
  if (error) { console.error('Timesheet konnte nicht geladen werden', error); contractorTimesheet = null; contractorDays = []; renderContractorPortal(); return; }
  contractorTimesheet = (tsRows && tsRows[0]) || null;
  if (!contractorTimesheet) { contractorDays = []; renderContractorPortal(); return; }
  const { data: dayRows, error: dayErr } = await sb.rpc('my_timesheet_days', { p_timesheet_id: contractorTimesheet.timesheet_id });
  if (dayErr) console.error('Tageswerte konnten nicht geladen werden', dayErr);
  contractorDays = dayRows || [];
  renderContractorPortal();
}

function renderContractorPortal() {
  document.body.dataset.org = contractorProfile ? contractorProfile.org : '';
  const app = document.getElementById('app');
  const status = contractorTimesheet ? contractorTimesheet.status : 'draft';
  const locked = status === 'submitted' || status === 'approved';
  const days = daysOfMonth(contractorMonth);
  const dayMap = new Map(contractorDays.map(d => [d.day, d.stunden]));
  const total = contractorDays.reduce((s, d) => s + (Number(d.stunden) || 0), 0);

  app.innerHTML = `
    <header class="top">
      <div class="brand-row">
        ${contractorProfile && contractorProfile.org === 'peax'
          ? `<div class="peax-wordmark">peax<span class="tag">A Konzepthaus Brand</span></div>`
          : `<div class="kh-wordmark">KONZEPT<br>HAUS</div>`}
        <div>
          <h1>Mein Timesheet</h1>
          <div class="sub">${esc(contractorProfile ? contractorProfile.name : '')} – ${esc(session.user.email)}</div>
        </div>
      </div>
      <div class="userbar"><button class="btn" id="logoutBtn">Abmelden</button></div>
    </header>
    <div class="card panel" style="max-width:640px;">
      ${!contractorProjects.length ? '<div class="empty">Für dich ist noch kein Projekt hinterlegt. Bitte bei Rike melden.</div>' : `
      <div class="toolbar-filters" style="margin-bottom:16px;">
        <label style="font-size:12.5px;color:var(--muted);font-weight:600;">Projekt / Kunde:</label>
        <select id="tsProjectSel">
          ${contractorProjects.map(p => `<option value="${p.project_id}" ${p.project_id === contractorProjectId ? 'selected' : ''}>${esc(p.projektname ? p.kunde + ' – ' + p.projektname : p.kunde)}</option>`).join('')}
        </select>
        <label style="font-size:12.5px;color:var(--muted);font-weight:600;">Monat:</label>
        <input type="month" id="tsMonthInput" value="${contractorMonth}">
      </div>
      <div style="margin-bottom:14px;">
        <span class="mini-badge ${status === 'approved' ? 'auto' : (status === 'rejected' ? '' : 'manuell')}" style="font-size:11px;">${TS_STATUS_LABEL[status]}</span>
        ${status === 'rejected' && contractorTimesheet.review_note ? `<div class="banner error" style="margin-top:10px;">Grund der Ablehnung: ${esc(contractorTimesheet.review_note)}</div>` : ''}
        ${locked ? `<div class="empty" style="text-align:left;padding:6px 0;">${status === 'approved' ? 'Freigegeben – keine Änderung mehr möglich.' : 'Eingereicht – wird geprüft, solange keine Änderung möglich.'}</div>` : ''}
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Tag</th><th>Wochentag</th><th>Stunden</th></tr></thead>
          <tbody>
            ${days.map(d => `<tr>
              <td>${fmtDate(d.date)}</td><td>${d.weekday}</td>
              <td><input class="num-cell" type="number" min="0" step="0.5" data-day="${d.date}" value="${dayMap.has(d.date) ? dayMap.get(d.date) : ''}" ${locked ? 'disabled' : ''}></td>
            </tr>`).join('')}
          </tbody>
          <tfoot><tr style="font-weight:700;"><td colspan="2">Summe</td><td>${fmtNum(total, 1)}</td></tr></tfoot>
        </table>
      </div>
      <div class="modal-actions" style="justify-content:flex-start;margin-top:16px;">
        <button class="btn primary" id="tsSubmitBtn" ${locked || !total ? 'disabled' : ''}>Timesheet einreichen</button>
      </div>
      `}
    </div>
    <footer class="hint">Deine Eingaben werden automatisch gespeichert. Nach dem Einreichen prüft das Team deine Stunden und gibt sie frei.</footer>
  `;
  document.getElementById('logoutBtn').addEventListener('click', handleLogout);
  const projectSel = document.getElementById('tsProjectSel');
  if (projectSel) projectSel.addEventListener('change', () => { contractorProjectId = projectSel.value; loadContractorTimesheet(); });
  const monthInput = document.getElementById('tsMonthInput');
  if (monthInput) monthInput.addEventListener('change', () => { contractorMonth = monthInput.value; loadContractorTimesheet(); });
  app.querySelectorAll('input[data-day]').forEach(inp => {
    inp.addEventListener('change', async () => {
      const val = inp.value === '' ? 0 : Number(inp.value);
      const { error } = await sb.rpc('set_timesheet_day', { p_timesheet_id: contractorTimesheet.timesheet_id, p_day: inp.dataset.day, p_stunden: val });
      if (error) { alert(error.message); }
      await loadContractorTimesheet();
    });
  });
  const submitBtn = document.getElementById('tsSubmitBtn');
  if (submitBtn) submitBtn.addEventListener('click', async () => {
    const { error } = await sb.rpc('submit_timesheet', { p_timesheet_id: contractorTimesheet.timesheet_id });
    if (error) { alert(error.message); return; }
    await loadContractorTimesheet();
  });
}

function subscribeContractorRealtime() {
  if (realtimeChannel) return;
  realtimeChannel = sb.channel('public:contractor-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'timesheets' }, () => loadContractorTimesheet())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'timesheet_days' }, () => loadContractorTimesheet())
    .subscribe();
}

// ---------- BOOTSTRAP ----------

async function startApp() {
  document.getElementById('app').innerHTML = '<div class="empty">Lade…</div>';
  await initOrgAccess();
  if (!allowedOrgs.length) {
    const isContractor = await initContractorAccess();
    if (isContractor) { subscribeContractorRealtime(); await loadContractorPortal(); return; }
    renderNoAccess();
    return;
  }
  subscribeRealtime();
  await loadAll();
}

sb.auth.onAuthStateChange((event, newSession) => {
  session = newSession;
  if (session) {
    renderAuth(); // clears any stale auth screen instantly, then app takes over
    startApp();
  } else {
    if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
    allowedOrgs = []; activeOrg = null;
    contractorProfile = null; contractorProjects = []; contractorProjectId = null; contractorTimesheet = null; contractorDays = [];
    renderAuth();
  }
});

sb.auth.getSession().then(({ data: { session: s } }) => {
  session = s;
  if (session) startApp();
  else renderAuth();
});
</script>
