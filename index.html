<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projektliste – Freelancer Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f6fb; --card: #ffffff; --border: #e3e7ef; --text: #1f2430; --muted: #6b7280;
    --blue: #2563eb; --blue-bg: #eaf0fe;
    --teal: #0d9488; --teal-bg: #e6f7f5;
    --purple: #7c3aed; --purple-bg: #f2ebfe;
    --amber: #b45309; --amber-bg: #fef3e2;
    --green: #15803d; --green-bg: #e8f7ec;
    --red: #b91c1c; --red-bg: #fdeaea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  #app { max-width: 1180px; margin: 0 auto; padding: 20px 24px 60px; }
  header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .userbar { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  nav.tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  nav.tabs button { background: none; border: none; padding: 10px 16px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav.tabs button.active { color: var(--blue); border-bottom-color: var(--blue); }
  nav.tabs button:hover { color: var(--text); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(20,20,43,.03); }
  .grid-kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  @media (max-width: 900px) { .grid-kpi { grid-template-columns: repeat(2, 1fr); } }
  .kpi { border-radius: 12px; padding: 14px 16px; border: 1px solid var(--border); }
  .kpi .label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .kpi .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .kpi .hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .kpi.blue { background: var(--blue-bg); } .kpi.blue .value { color: var(--blue); }
  .kpi.teal { background: var(--teal-bg); } .kpi.teal .value { color: var(--teal); }
  .kpi.purple { background: var(--purple-bg); } .kpi.purple .value { color: var(--purple); }
  .kpi.amber { background: var(--amber-bg); } .kpi.amber .value { color: var(--amber); }
  section.panel { margin-bottom: 22px; }
  section.panel h2 { font-size: 15px; margin: 0 0 12px; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
  tbody tr:hover { background: #fafbff; }
  tr.inactive { opacity: .4; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .badge.Gut { background: var(--green-bg); color: var(--green); }
  .badge.Achtung { background: var(--amber-bg); color: var(--amber); }
  .badge.Kritisch { background: var(--red-bg); color: var(--red); }
  .badge.Aktiv { background: var(--green-bg); color: var(--green); }
  .badge.Pausiert { background: var(--amber-bg); color: var(--amber); }
  .badge.Beendet { background: #eee; color: #666; }
  .mini-badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; margin-left: 6px; vertical-align: middle; }
  .mini-badge.auto { background: var(--green-bg); color: var(--green); }
  .mini-badge.manuell { background: var(--amber-bg); color: var(--amber); }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  select, input[type=text], input[type=number], input[type=date], input[type=month], input[type=email], input[type=password] {
    font-size: 13px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text);
  }
  input.num-cell { width: 90px; padding: 5px 7px; }
  button.btn { font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; color: var(--text); }
  button.btn:hover { background: #f2f4f9; }
  button.btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  button.btn.primary:hover { background: #1d4ed8; }
  button.btn.danger { color: var(--red); }
  button.link { background: none; border: none; color: var(--blue); font-size: 12.5px; cursor: pointer; padding: 2px 4px; font-weight: 600; }
  button.link.danger { color: var(--red); }
  .chart-wrap { position: relative; height: 280px; }
  .overlay { position: fixed; inset: 0; background: rgba(20,20,43,.35); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-radius: 14px; padding: 22px 24px; width: 460px; max-width: 92vw; max-height: 88vh; overflow: auto; }
  .modal h3 { margin: 0 0 14px; font-size: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select { width: 100%; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .empty { color: var(--muted); font-size: 13px; padding: 18px 0; text-align: center; }
  footer.hint { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 24px; }
  .auth-wrap { max-width: 380px; margin: 80px auto; }
  .auth-wrap h1 { text-align: center; margin-bottom: 4px; }
  .auth-wrap p.sub { text-align: center; margin-bottom: 20px; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .auth-tabs button { flex: 1; }
  .banner { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
  .banner.error { background: var(--red-bg); color: var(--red); }
  .banner.info { background: var(--blue-bg); color: var(--blue); }
</style>
</head>
<body>
<div id="app"></div>

<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>

<script>
/* ============================================================
   Supabase-Zugangsdaten
   ============================================================ */
const SUPABASE_URL = 'https://uevefmvbpznvuvhvkdwl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVldmVmbXZicHpudnV2aHZrZHdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMjUzMTYsImV4cCI6MjEwMDgwMTMxNn0.ewGSI6UcXpInCL1z9VTqcqsGxBPd5Aqt4YUMulrml5E';
/* ============================================================ */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MONTH_NAMES = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

let session = null;
let authMode = 'login'; // 'login' | 'signup'
let authError = '';
let authInfo = '';
let authBusy = false;

let data = { projects: [], entries: [], consultants: [] };
let activeTab = 'dashboard';
let dashMonth = 'all';
let sollMonth = currentMonthStr();
let istMonth = currentMonthStr();
let provMonth = currentMonthStr();
let trendMetric = 'umsatz';
let trendChart = null;
let modalConfig = null;
let realtimeChannel = null;

function currentMonthStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function fmtEUR(n) { return (n || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }); }
function fmtNum(n, digits) { return (n || 0).toLocaleString('de-DE', { maximumFractionDigits: digits ?? 1 }); }
function fmtPct(n) { return ((n || 0) * 100).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + '%'; }
function fmtDate(s) { if (!s) return '–'; const [y,m,d] = s.split('-'); return `${d}.${m}.${y}`; }

function project(id) { return data.projects.find(p => p.id === id); }
function margeH(p) { return (p.charge_h || 0) - (p.pay_h || 0); }
function margePct(p) { return p.charge_h ? margeH(p) / p.charge_h : 0; }

function isActiveInMonth(p, monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  const monthStart = new Date(y, m - 1, 1);
  const monthEnd = new Date(y, m, 0);
  const start = p.start_date ? new Date(p.start_date) : null;
  const ende = p.end_date ? new Date(p.end_date) : null;
  if (start && start > monthEnd) return false;
  if (ende && ende < monthStart) return false;
  return true;
}

// ---------- AUTOMATISCHE SOLL-BERECHNUNG (aus Projektlaufzeit) ----------

function round1(n) { return Math.round((n || 0) * 10) / 10; }
function parseDateUTC(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function daysInclusive(a, b) { return Math.round((b - a) / 86400000) + 1; }
function monthRangeUTC(monthStr) { const [y, m] = monthStr.split('-').map(Number); return [Date.UTC(y, m - 1, 1), Date.UTC(y, m, 0)]; }

// Gesamte "bestellte" Stunden über die komplette Projektlaufzeit (Wochenstunden x Wochen)
function projectTotalSollHours(p) {
  const ps = parseDateUTC(p.start_date), pe = parseDateUTC(p.end_date);
  if (ps === null || pe === null || pe < ps) return 0;
  return round1((p.wochenstunden || 0) * daysInclusive(ps, pe) / 7);
}

// Anteil der Gesamtstunden, der auf einen bestimmten Monat entfällt (nach Tagesüberlappung)
function projectMonthSollHours(p, monthStr) {
  const ps = parseDateUTC(p.start_date), pe = parseDateUTC(p.end_date);
  if (ps === null || pe === null) return 0;
  const [ms, me] = monthRangeUTC(monthStr);
  const os = Math.max(ps, ms), oe = Math.min(pe, me);
  if (os > oe) return 0;
  return round1((p.wochenstunden || 0) * daysInclusive(os, oe) / 7);
}

function monthListForProject(p) {
  if (!p.start_date || !p.end_date) return [];
  const [sy, sm] = p.start_date.split('-').map(Number);
  const [ey, em] = p.end_date.split('-').map(Number);
  const out = []; let y = sy, m = sm, guard = 0;
  while ((y < ey || (y === ey && m <= em)) && guard < 240) {
    out.push(y + '-' + String(m).padStart(2, '0'));
    m++; if (m > 12) { m = 1; y++; }
    guard++;
  }
  return out;
}

// Gleicht die SOLL-Einträge eines Projekts mit der berechneten Monatsverteilung ab.
// Manuell überschriebene Monate (auto === false) werden dabei nicht angetastet.
async function syncAutoSoll(proj) {
  const months = monthListForProject(proj);
  const monthSet = new Set(months);
  const existing = data.entries.filter(e => e.project_id === proj.id && e.kind === 'soll');

  for (const m of months) {
    const hours = projectMonthSollHours(proj, m);
    const ex = existing.find(e => e.month === m);
    if (!ex) {
      await sb.from('entries').insert({ project_id: proj.id, kind: 'soll', month: m, stunden: hours, auto: true });
    } else if (ex.auto && Math.abs((ex.stunden || 0) - hours) > 0.05) {
      await sb.from('entries').update({ stunden: hours }).eq('id', ex.id);
    }
  }
  const stale = existing.filter(e => e.auto && !monthSet.has(e.month));
  for (const e of stale) {
    await sb.from('entries').delete().eq('id', e.id);
  }
  await loadAll();
}

async function recalcAllSoll() {
  for (const p of data.projects) {
    await syncAutoSoll(p);
  }
}

function computeEntry(e) {
  const p = project(e.project_id);
  const chargeH = p ? p.charge_h : 0;
  const payH = p ? p.pay_h : 0;
  const stunden = e.stunden || 0;
  const umsatz = stunden * chargeH;
  const kosten = stunden * payH;
  return { stunden, umsatz, kosten, rohertrag: umsatz - kosten };
}
function sumEntries(list) {
  return list.reduce((acc, e) => {
    const c = computeEntry(e);
    acc.stunden += c.stunden; acc.umsatz += c.umsatz; acc.kosten += c.kosten; acc.rohertrag += c.rohertrag;
    return acc;
  }, { stunden: 0, umsatz: 0, kosten: 0, rohertrag: 0 });
}
function entriesOf(kind) { return data.entries.filter(e => e.kind === kind); }

// Gruppiert SOLL- und IST-Zahlen nach Kunde: Umsatz (Stunden x Charge/h), Kosten (Stunden x Pay/h)
// und Rohertrag (Umsatz - Kosten), summiert über alle Projekte des Kunden.
function customerBreakdown(sollEntries, istEntries) {
  const kunden = Array.from(new Set(data.projects.map(p => p.kunde))).sort();
  return kunden.map(k => {
    const projectIds = new Set(data.projects.filter(p => p.kunde === k).map(p => p.id));
    const soll = sumEntries(sollEntries.filter(e => projectIds.has(e.project_id)));
    const ist = sumEntries(istEntries.filter(e => projectIds.has(e.project_id)));
    return {
      kunde: k,
      sollUmsatz: soll.umsatz, istUmsatz: ist.umsatz,
      sollKosten: soll.kosten, istKosten: ist.kosten,
      sollRohertrag: soll.rohertrag, istRohertrag: ist.rohertrag,
    };
  });
}
function allMonthsUsed() {
  const set = new Set();
  data.entries.forEach(e => set.add(e.month));
  set.add(currentMonthStr());
  return Array.from(set).sort();
}
function statusFromErf(erf, hasSoll) {
  if (!hasSoll) return null;
  if (erf >= 0.9) return 'Gut';
  if (erf >= 0.8) return 'Achtung';
  return 'Kritisch';
}
function monthLabel(m) { const [y, mo] = m.split('-').map(Number); return MONTH_NAMES[mo - 1] + ' ' + y; }

// ---------- PROVISIONEN ----------

function consultant(id) { return data.consultants.find(c => c.id === id); }
function consultantName(id) { const c = consultant(id); return c ? c.name : '–'; }

// Umsatz, der einem Consultant aus einem Projekt zugerechnet wird: voll, wenn er alleine
// oder mit sich selbst in beiden Rollen zugewiesen ist; halb, wenn zwei unterschiedliche
// Consultants am Projekt hängen.
function consultantShareForProject(p, consultantId) {
  const c1 = p.consultant1_id, c2 = p.consultant2_id;
  const involved = c1 === consultantId || c2 === consultantId;
  if (!involved) return 0;
  if (c1 && c2 && c1 !== c2) return 0.5;
  return 1;
}

// Summe des einem Consultant zugerechneten Rohertrags (Umsatz - Kosten = Stunden x Marge/h) über
// eine Liste von Entries (z.B. alle IST-Einträge eines Monats). Provision wird auf Rohertrag berechnet, nicht auf Umsatz.
function attributedRevenue(consultantId, entries) {
  let total = 0;
  for (const e of entries) {
    const p = project(e.project_id);
    if (!p) continue;
    const share = consultantShareForProject(p, consultantId);
    if (share > 0) total += computeEntry(e).rohertrag * share;
  }
  return total;
}

function quarterOfMonth(monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  const q = Math.floor((m - 1) / 3) + 1;
  return { year: y, quarter: q };
}
function monthsInQuarter(year, quarter) {
  const startM = (quarter - 1) * 3 + 1;
  return [0, 1, 2].map(i => year + '-' + String(startM + i).padStart(2, '0'));
}
function quarterLabel(year, quarter) { return 'Q' + quarter + ' ' + year; }

function provisionenHTML() {
  const istAll = entriesOf('ist');
  const monthEntries = istAll.filter(e => e.month === provMonth);
  const teamLeads = data.consultants.filter(c => c.is_team_lead);
  const individuals = data.consultants.filter(c => !c.is_team_lead);
  const { year: qYear, quarter: qNum } = quarterOfMonth(provMonth);
  const qMonths = monthsInQuarter(qYear, qNum);
  const qEntries = istAll.filter(e => qMonths.includes(e.month));

  return `
    <div class="card panel">
      <div class="toolbar" style="justify-content:space-between;">
        <h2 style="margin:0;">Consultants</h2>
        <button class="btn primary" id="addConsultantBtn">+ Neuer Consultant</button>
      </div>
      ${!data.consultants.length ? '<div class="empty">Noch keine Consultants angelegt.</div>' : `
      <div class="table-scroll">
      <table>
        <thead><tr><th>Name</th><th>Provisionssatz</th><th>Team-Lead</th><th>Team-Satz (Quartal)</th><th>Teil von Team</th><th></th></tr></thead>
        <tbody>
          ${data.consultants.map(c => `
            <tr>
              <td>${c.name}</td>
              <td>${fmtPct(c.rate)}</td>
              <td>${c.is_team_lead ? '<span class="badge Aktiv">Ja</span>' : '–'}</td>
              <td>${c.is_team_lead ? fmtPct(c.team_rate) : '–'}</td>
              <td>${c.team_lead_id ? consultantName(c.team_lead_id) : '–'}</td>
              <td><button class="link" data-edit-consultant="${c.id}">Bearbeiten</button> <button class="link danger" data-del-consultant="${c.id}">Löschen</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
      </div>`}
    </div>

    <div class="card panel">
      <div class="toolbar" style="justify-content:space-between;">
        <h2 style="margin:0;">Monatliche Provision (individuell, IST-Rohertrag)</h2>
        <div class="toolbar" style="margin:0;">
          <label style="font-size:12.5px;color:var(--muted);font-weight:600;">Monat:</label>
          <input type="month" id="provMonthPicker" value="${provMonth}">
        </div>
      </div>
      ${!individuals.length ? '<div class="empty">Keine individuellen Consultants (ohne Team-Lead-Status) angelegt.</div>' : `
      <div class="table-scroll">
      <table>
        <thead><tr><th>Consultant</th><th>Zugerechneter Rohertrag</th><th>Satz</th><th>Provision ${monthLabel(provMonth)}</th></tr></thead>
        <tbody>
          ${individuals.map(c => {
            const rev = attributedRevenue(c.id, monthEntries);
            const commission = rev * (c.rate || 0);
            return `<tr>
              <td><strong>${c.name}</strong></td>
              <td>${fmtEUR(rev)}</td>
              <td>${fmtPct(c.rate)}</td>
              <td>${fmtEUR(commission)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>`}
    </div>

    <div class="card panel">
      <h2>Team-Provision (Quartal) – ${quarterLabel(qYear, qNum)}</h2>
      <div class="empty" style="padding-top:0;text-align:left;">Team-Leads erhalten statt der monatlichen 15% einen eigenen Satz auf den IST-Rohertrag ihres gesamten Teams, summiert über das Quartal (${qMonths.map(monthLabel).join(', ')}).</div>
      ${!teamLeads.length ? '<div class="empty">Kein Team-Lead angelegt.</div>' : `
      <div class="table-scroll">
      <table>
        <thead><tr><th>Team-Lead</th><th>Team-Mitglieder</th><th>Team-Rohertrag (Quartal)</th><th>Satz</th><th>Provision ${quarterLabel(qYear, qNum)}</th></tr></thead>
        <tbody>
          ${teamLeads.map(lead => {
            const members = data.consultants.filter(c => c.team_lead_id === lead.id);
            const teamRev = members.reduce((sum, m) => sum + attributedRevenue(m.id, qEntries), 0);
            const commission = teamRev * (lead.team_rate || 0);
            return `<tr>
              <td><strong>${lead.name}</strong></td>
              <td>${members.length ? members.map(m => m.name).join(', ') : '<span class="empty" style="padding:0;">keine Mitglieder zugewiesen</span>'}</td>
              <td>${fmtEUR(teamRev)}</td>
              <td>${fmtPct(lead.team_rate)}</td>
              <td>${fmtEUR(commission)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>`}
    </div>
  `;
}

function openConsultantModal(id) {
  const c = id ? consultant(id) : null;
  modalConfig = {
    type: 'consultant', id: id || null,
    values: c ? { ...c } : { name: '', rate: 0.15, is_team_lead: false, team_rate: 0.05, team_lead_id: '' },
  };
  render();
}

function renderConsultantModal(c) {
  const v = c.values;
  const otherConsultants = data.consultants.filter(x => x.id !== c.id);
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${c.id ? 'Consultant bearbeiten' : 'Neuer Consultant'}</h3>
      <div class="field"><label>Name</label><input type="text" id="cf_name" value="${v.name || ''}"></div>
      <div class="field-row">
        <div class="field"><label>Provisionssatz (monatlich, individuell)</label><input type="number" step="0.01" id="cf_rate" value="${v.rate}"></div>
        <div class="field"><label>Teil von Team (optional)</label>
          <select id="cf_team_lead_id">
            <option value="">– kein Team –</option>
            ${otherConsultants.filter(x => x.is_team_lead).map(x => `<option value="${x.id}" ${v.team_lead_id === x.id ? 'selected' : ''}>${x.name}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Ist Team-Lead?</label>
          <select id="cf_is_team_lead">
            <option value="false" ${!v.is_team_lead ? 'selected' : ''}>Nein</option>
            <option value="true" ${v.is_team_lead ? 'selected' : ''}>Ja</option>
          </select>
        </div>
        <div class="field"><label>Team-Satz (quartalsweise, nur falls Team-Lead)</label><input type="number" step="0.01" id="cf_team_rate" value="${v.team_rate}"></div>

        ${c.id ? '<button class="btn danger" id="modalDeleteConsultant">Löschen</button>' : ''}

        <button class="btn primary" id="modalSaveConsultant">Speichern</button>
      </div>
    </div>`;
  document.getElementById('app').appendChild(overlay);
  document.getElementById('modalCancelConsultant').addEventListener('click', () => { modalConfig = null; render(); });
  if (c.id) document.getElementById('modalDeleteConsultant').addEventListener('click', () => deleteConsultant(c.id));
  document.getElementById('modalSaveConsultant').addEventListener('click', async () => {
    const payload = {
      name: document.getElementById('cf_name').value.trim(),
      rate: Number(document.getElementById('cf_rate').value) || 0,
      is_team_lead: document.getElementById('cf_is_team_lead').value === 'true',
      team_rate: Number(document.getElementById('cf_team_rate').value) || 0,
      team_lead_id: document.getElementById('cf_team_lead_id').value || null,
    };
    if (c.id) await sb.from('consultants').update(payload).eq('id', c.id);
    else await sb.from('consultants').insert(payload);
    modalConfig = null;
    await loadAll();
  });
}

async function deleteConsultant(id) {
  if (!confirm('Consultant löschen? Zuweisungen an Projekten werden dabei entfernt (nicht die Projekte selbst).')) return;
  await sb.from('consultants').delete().eq('id', id);
  modalConfig = null;
  await loadAll();
}

// ---------- DATA LOADING ----------

async function loadAll() {
  const [{ data: projects, error: e1 }, { data: entries, error: e2 }, { data: consultants, error: e3 }] = await Promise.all([
    sb.from('projects').select('*').order('created_at'),
    sb.from('entries').select('*'),
    sb.from('consultants').select('*').order('created_at'),
  ]);
  if (e1 || e2 || e3) {
    console.error('load error', e1, e2, e3);
    renderError((e1 || e2 || e3).message);
    return;
  }
  data.projects = projects || [];
  data.entries = entries || [];
  data.consultants = consultants || [];
  render();
}

function subscribeRealtime() {
  if (realtimeChannel) return;
  realtimeChannel = sb.channel('public:all-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'projects' }, () => loadAll())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'entries' }, () => loadAll())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'consultants' }, () => loadAll())
    .subscribe();
}

// ---------- AUTH ----------

async function handleLogin(email, password) {
  authBusy = true; authError = ''; renderAuth();
  const { error } = await sb.auth.signInWithPassword({ email, password });
  authBusy = false;
  if (error) { authError = error.message; renderAuth(); }
}
async function handleSignup(email, password) {
  authBusy = true; authError = ''; authInfo = ''; renderAuth();
  const { data: res, error } = await sb.auth.signUp({ email, password });
  authBusy = false;
  if (error) { authError = error.message; renderAuth(); return; }
  if (res.session) return; // logged in immediately (email confirmation disabled)
  authInfo = 'Konto erstellt. Falls E-Mail-Bestätigung aktiviert ist, bitte den Link in deinem Postfach öffnen und dich danach anmelden.';
  authMode = 'login';
  renderAuth();
}
async function handleLogout() {
  await sb.auth.signOut();
}

function renderAuth() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="auth-wrap">
      <h1>Projektliste</h1>
      <p class="sub">Freelancer-Dashboard – gemeinsam bearbeitet</p>
      <div class="card">
        <div class="auth-tabs">
          <button class="btn ${authMode === 'login' ? 'primary' : ''}" id="tabLogin">Anmelden</button>
          <button class="btn ${authMode === 'signup' ? 'primary' : ''}" id="tabSignup">Registrieren</button>
        </div>
        ${authError ? `<div class="banner error">${authError}</div>` : ''}
        ${authInfo ? `<div class="banner info">${authInfo}</div>` : ''}
        <div class="field"><label>E-Mail</label><input type="email" id="authEmail"></div>
        <div class="field"><label>Passwort</label><input type="password" id="authPassword"></div>
        <button class="btn primary" id="authSubmit" style="width:100%;" ${authBusy ? 'disabled' : ''}>
          ${authBusy ? '…' : (authMode === 'login' ? 'Anmelden' : 'Konto erstellen')}
        </button>
      </div>
    </div>
  `;
  document.getElementById('tabLogin').addEventListener('click', () => { authMode = 'login'; authError=''; authInfo=''; renderAuth(); });
  document.getElementById('tabSignup').addEventListener('click', () => { authMode = 'signup'; authError=''; authInfo=''; renderAuth(); });
  document.getElementById('authSubmit').addEventListener('click', () => {

  });
}

function renderError(msg) {

function setupChart() {
  const sel = document.getElementById('dashMonthSel');
  if (sel) sel.addEventListener('change', () => { dashMonth = sel.value; render(); });
  const metricSel = document.getElementById('trendMetricSel');
  if (metricSel) metricSel.addEventListener('change', () => { trendMetric = metricSel.value; render(); });

  const months = allMonthsUsed();
  const sollAll = entriesOf('soll'), istAll = entriesOf('ist');
  const sollByMonth = months.map(m => sumEntries(sollAll.filter(e => e.month === m)));
  const istByMonth = months.map(m => sumEntries(istAll.filter(e => e.month === m)));
  const labels = months.map(monthLabel);
  const key = trendMetric;

  const ctx = document.getElementById('trendChart');
  if (!ctx) return;
  if (trendChart) { trendChart.destroy(); trendChart = null; }
  trendChart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [
      { label: 'SOLL', data: sollByMonth.map(v => v[key]), backgroundColor: '#93b4fb' },
      { label: 'IST', data: istByMonth.map(v => v[key]), backgroundColor: '#0d9488' },
    ]},
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true } } }
  });
}

}

async function setEntry(kind, projectId, monthVal, stunden) {
  const existing = data.entries.find(e => e.project_id === projectId && e.kind === kind && e.month === monthVal);
  if (stunden === '' || stunden === null || isNaN(stunden)) {
    if (existing) await sb.from('entries').delete().eq('id', existing.id);
    if (kind === 'soll') {
      const proj = project(projectId);
      if (proj) { await syncAutoSoll(proj); return; }
    }
  } else if (existing) {
    const patch = { stunden };
    if (kind === 'soll') patch.auto = false; // manuelle Änderung überschreibt die Automatik
    await sb.from('entries').update(patch).eq('id', existing.id);
  } else {
    const payload = { project_id: projectId, kind, month: monthVal, stunden };
    if (kind === 'soll') payload.auto = false;
    await sb.from('entries').insert(payload);
  }
  await loadAll();
}

// ---------- EVENTS ----------

function wireTabEvents() {
  const addBtn = document.getElementById('addProjectBtn');
  if (addBtn) addBtn.addEventListener('click', () => openProjectModal(null));
  const recalcBtn = document.getElementById('recalcSollBtn');
  if (recalcBtn) recalcBtn.addEventListener('click', async () => { recalcBtn.disabled = true; recalcBtn.textContent = 'Berechne…'; await recalcAllSoll(); });
  document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openProjectModal(b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteProject(b.dataset.del)));
  ['soll', 'ist'].forEach(kind => {
    const picker = document.getElementById('monthPicker_' + kind);
    if (picker) picker.addEventListener('change', () => { if (kind === 'soll') sollMonth = picker.value; else istMonth = picker.value; render(); });
  });
  const addConsultantBtn = document.getElementById('addConsultantBtn');
  if (addConsultantBtn) addConsultantBtn.addEventListener('click', () => openConsultantModal(null));
  document.querySelectorAll('[data-edit-consultant]').forEach(b => b.addEventListener('click', () => openConsultantModal(b.dataset.editConsultant)));
  document.querySelectorAll('[data-del-consultant]').forEach(b => b.addEventListener('click', () => deleteConsultant(b.dataset.delConsultant)));
  const provPicker = document.getElementById('provMonthPicker');
  if (provPicker) provPicker.addEventListener('change', () => { provMonth = provPicker.value; render(); });
  document.querySelectorAll('input[data-kind]').forEach(inp => {
    inp.addEventListener('change', () => {
      const kind = inp.dataset.kind;
      const pid = inp.dataset.pid;
      const monthVal = kind === 'soll' ? sollMonth : istMonth;
      const val = inp.value === '' ? '' : Number(inp.value);
      setEntry(kind, pid, monthVal, val);
    });
  });
}

// ---------- BOOTSTRAP ----------

sb.auth.onAuthStateChange((event, newSession) => {
  session = newSession;
  if (session) {
    renderAuth(); // clears any stale auth screen instantly, then app takes over
    document.getElementById('app').innerHTML = '<div class="empty">Lade…</div>';
    subscribeRealtime();
    loadAll();
  } else {
    if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
    renderAuth();
  }
});

sb.auth.getSession().then(({ data: { session: s } }) => {
  session = s;
  if (session) { document.getElementById('app').innerHTML = '<div class="empty">Lade…</div>'; subscribeRealtime(); loadAll(); }
  else renderAuth();
});
</script>
