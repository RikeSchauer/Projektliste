<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projektliste – Freelancer Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f6fb; --card: #ffffff; --border: #e3e7ef; --text: #1f2430; --muted: #6b7280;
    --blue: #2563eb; --blue-bg: #eaf0fe;
    --teal: #0d9488; --teal-bg: #e6f7f5;
    --purple: #7c3aed; --purple-bg: #f2ebfe;
    --amber: #b45309; --amber-bg: #fef3e2;
    --green: #15803d; --green-bg: #e8f7ec;
    --red: #b91c1c; --red-bg: #fdeaea;
    /* Marken-Design: KH = Gelb, peax = Orange/Rot (wie auf den Rechnungsvorlagen).
       --accent-bar ist der reine Markenfarbton (für den Header-Balken/Badges),
       --accent-ink ist eine textlesbare Variante davon (für Links, aktive Tabs, Buttons) -
       bei KH ist reines Gelb auf Weiß kaum lesbar, deshalb dort ein dunkleres Gold als Ink. */
    --accent-bar: #FFEC14; --accent-ink: #92720b; --accent-bg: #fdf6d8;
  }
  body[data-org="peax"] { --accent-bar: #FE4700; --accent-ink: #FE4700; --accent-bg: #ffece3; }
  * { box-sizing: border-box; }
  body { margin: 6px 0 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: 6px; background: var(--accent-bar); z-index: 100; }
  #app { max-width: 1900px; margin: 0 auto; padding: 20px 24px 60px; }
  header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .brand-row { display: flex; align-items: center; gap: 14px; }
  .peax-wordmark { font-size: 26px; font-weight: 300; letter-spacing: -.5px; color: var(--text); line-height: 1; }
  .peax-wordmark .tag { display: block; font-size: 9px; font-weight: 700; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  .kh-wordmark { font-size: 17px; font-weight: 800; letter-spacing: .02em; color: var(--text); line-height: 1.05; padding-left: 10px; border-left: 6px solid var(--accent-bar); }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .userbar { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  nav.tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  nav.tabs button { background: none; border: none; padding: 10px 16px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav.tabs button.active { color: var(--accent-ink); border-bottom-color: var(--accent-ink); }
  nav.tabs button:hover { color: var(--text); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(20,20,43,.03); }
  .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
  @media (max-width: 900px) { .grid-kpi { grid-template-columns: repeat(2, 1fr); } }
  .kpi { border-radius: 12px; padding: 14px 16px; border: 1px solid var(--border); }
  .kpi .label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .kpi .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .kpi .hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .kpi.blue { background: var(--blue-bg); } .kpi.blue .value { color: var(--blue); }
  .kpi.teal { background: var(--teal-bg); } .kpi.teal .value { color: var(--teal); }
  .kpi.purple { background: var(--purple-bg); } .kpi.purple .value { color: var(--purple); }
  .kpi.amber { background: var(--amber-bg); } .kpi.amber .value { color: var(--amber); }
  section.panel { margin-bottom: 22px; }
  section.panel h2 { font-size: 15px; margin: 0 0 12px; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
  tbody tr:hover { background: #fafbff; }
  table.projekte-table { font-size: 12.5px; }
  table.projekte-table th, table.projekte-table td { padding: 7px 8px; }
  table.projekte-table th:last-child, table.projekte-table td:last-child {
    position: sticky; right: 0; background: var(--card); box-shadow: -6px 0 6px -6px rgba(0,0,0,.12);

  table.projekte-table tbody tr:hover td:last-child { background: #fafbff; }
  tr.inactive { opacity: .4; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .badge.Gut { background: var(--green-bg); color: var(--green); }
  .badge.Achtung { background: var(--amber-bg); color: var(--amber); }
  .badge.Kritisch { background: var(--red-bg); color: var(--red); }

  .badge.Pausiert { background: var(--amber-bg); color: var(--amber); }
  .badge.Beendet { background: #eee; color: #666; }
  .badge.Bevorstehend { background: var(--purple-bg); color: var(--purple); }
  .badge.Perm { background: var(--blue-bg); color: var(--blue); }

  .mini-badge.auto { background: var(--green-bg); color: var(--green); }
  .mini-badge.manuell { background: var(--amber-bg); color: var(--amber); }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar-filters { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: nowrap; }
  .toolbar-filters > * { flex: 0 0 auto; }
  .toolbar-filters label { white-space: nowrap; }
  .toolbar-filters select { padding: 7px 6px; }
  .toolbar-filters input[type=month] { padding: 7px 6px; }
  select, input[type=text], input[type=number], input[type=date], input[type=month], input[type=email], input[type=password] {

  button.btn { font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; color: var(--text); }

  button.btn.danger { color: var(--red); }
  button.link { background: none; border: none; color: var(--accent-ink); font-size: 12.5px; cursor: pointer; padding: 2px 4px; font-weight: 600; }
  button.link.danger { color: var(--red); }

  .overlay { position: fixed; inset: 0; background: rgba(20,20,43,.35); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-radius: 14px; padding: 22px 24px; width: 460px; max-width: 92vw; max-height: 88vh; overflow: auto; }
  .modal h3 { margin: 0 0 14px; font-size: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select { width: 100%; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .empty { color: var(--muted); font-size: 13px; padding: 18px 0; text-align: center; }
  footer.hint { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 24px; }
  .auth-wrap { max-width: 380px; margin: 80px auto; }
  .auth-wrap h1 { text-align: center; margin-bottom: 4px; }
  .auth-wrap p.sub { text-align: center; margin-bottom: 20px; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .auth-tabs button { flex: 1; }
  .banner { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
  .banner.error { background: var(--red-bg); color: var(--red); }
  .banner.info { background: var(--blue-bg); color: var(--blue); }
  @media print {
    header.top, nav.tabs, footer.hint, .no-print { display: none !important; }
    body { background: #fff; }
    #app { max-width: none; padding: 0; }
    .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
  }
</style>

<script>
/* ============================================================

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVldmVmbXZicHpudnV2aHZrZHdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMjUzMTYsImV4cCI6MjEwMDgwMTMxNn0.ewGSI6UcXpInCL1z9VTqcqsGxBPd5Aqt4YUMulrml5E';
/* ============================================================ */
// Basis-URL des Weclapp-Webapp (nicht die API) – nur für Direktlinks zu Rechnungen im

const MONTH_NAMES = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MONTH_NAMES_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// Personalisierter Einladungslink für Contractors (?invite=<email> in der URL, siehe
// "Link kopieren" bei den Contractors im Tab "Timesheets") - öffnet die Registrierung

let data = { projects: [], allProjects: [], entries: [], consultants: [], ki_vorschlaege: [], team_memberships: [], contractors: [], contractorProjects: [], timesheets: [], timesheetDays: [], candidates: [], candidateProjects: [], kunden: [] };
// Contractor-Portal (externe Freelancer, die NUR ihr eigenes Timesheet sehen - siehe
// migration_contractor_timesheets.sql). Komplett getrennt vom internen App-Zustand oben.
let contractorProfile = null;
let contractorProjects = [];
let contractorProjectId = null;
let contractorMonth = currentMonthStr(); // function-Deklaration ist gehoisted, daher hier schon nutzbar
let contractorTimesheet = null;
let contractorDays = [];
const TS_STATUS_LABEL = { draft: 'Entwurf', submitted: 'Eingereicht', approved: 'Freigegeben', rejected: 'Abgelehnt' };
let tsFilterStatus = 'submitted';
// Mehrfirmen-Unterstützung (KH + peax): allowedOrgs kommt aus der Tabelle user_access
// (welche Firmen darf diese E-Mail-Adresse sehen - siehe migration_multi_org.sql).
// activeOrg ist die aktuell angezeigte Firma; data.projects/entries/consultants werden
// in loadAll() darauf gefiltert. data.allProjects bleibt firmenübergreifend (alles, worauf
// die Person laut RLS Zugriff hat) - wird nur für die KI-Vorschläge-Projektauswahl gebraucht,
// weil ein Vorschlag dort wahlweise einem KH- oder peax-Projekt zugeordnet werden kann.
let allowedOrgs = [];
let activeOrg = null;
const ORG_LABELS = { kh: 'KH', peax: 'peax' };
let activeTab = 'dashboard';
let dashMonth = 'all';
let sollMonth = currentMonthStr();
let istMonth = currentMonthStr();
let provMonth = currentMonthStr();
let trendChart = null;
let trendShow = { umsatz: true, kosten: true, rohertrag: true }; // steuert, welche Linien im Monatstrend gezeigt werden
let kundeChart = null;
// Feste Farbfolge für das Kunden-Tortendiagramm (wird bei mehr Kunden als Farben zyklisch wiederverwendet).
const PIE_COLORS = ['#2563eb', '#0d9488', '#7c3aed', '#b45309', '#15803d', '#b91c1c', '#db2777', '#0891b2', '#65a30d', '#9333ea', '#ea580c', '#0284c7'];
let modalConfig = null;
let realtimeChannel = null;
let reportConfig = null; // { consultantId } – wenn gesetzt, wird im Provisionen-Tab die Abrechnung statt der Übersicht gezeigt
let projFilterKunde = 'all';
let projFilterStatus = 'all';
let projFilterArt = 'all'; // 'all' | 'contract' | 'perm'
let projFilterStartMonat = ''; // 'YYYY-MM' oder '' = kein Filter
let projFilterEndeMonat = ''; // 'YYYY-MM' oder '' = kein Filter
let projSearch = ''; // Freitext-Suche über alle Spalten der Projekte-Tabelle (wie in Excel)
let projSort = 'kunde'; // 'kunde' | 'start_asc' | 'start_desc' | 'end_asc' | 'end_desc'
// Excel-artige Suche & Filter für SOLL- und IST-Tabellen, jeweils getrennt pro Kind ('soll'/'ist').
let entrySearch = { soll: '', ist: '' };
let entryFilterKunde = { soll: 'all', ist: 'all' };
let entryFilterArt = { soll: 'all', ist: 'all' };
let entryFilterStatus = { soll: 'all', ist: 'all' };
let kiFilterStatus = 'pending'; // 'pending' | 'approved' | 'rejected' | 'all' – Filter im Tab "KI-Vorschläge"
let reportKundeId = ''; // ausgewählter Kunde für den Excel-Report im Tab "Kunden"
let reportMonth = currentMonthStr();

function currentMonthStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function fmtEUR(n) { return (n || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }); }
function fmtNum(n, digits) { return (n || 0).toLocaleString('de-DE', { maximumFractionDigits: digits ?? 1 }); }
function fmtPct(n) { return ((n || 0) * 100).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + '%'; }
function fmtDate(s) { if (!s) return '–'; const [y,m,d] = s.split('-'); return `${d}.${m}.${y}`; }

// Sucht bewusst über data.allProjects (nicht nur die aktuelle Firma), damit ein
// KI-Vorschlag, der einem Projekt der anderen Firma zugeordnet wurde, trotzdem
// korrekt angezeigt wird. Für alle anderen Stellen (Dashboard/Projekte/SOLL/IST/
// Provisionen, die ohnehin nur mit data.projects der aktuellen Firma arbeiten)
// liefert das dieselben Ergebnisse, weil IDs eindeutig sind.
function project(id) { return data.allProjects.find(p => p.id === id); }
function margeH(p) { return (p.charge_h || 0) - (p.pay_h || 0); }
function margePct(p) { return p.charge_h ? margeH(p) / p.charge_h : 0; }

function isActiveInMonth(p, monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  const monthStart = new Date(y, m - 1, 1);
  const monthEnd = new Date(y, m, 0);
  const start = p.start_date ? new Date(p.start_date) : null;
  const ende = p.end_date ? new Date(p.end_date) : null;
  if (start && start > monthEnd) return false;
  if (ende && ende < monthStart) return false;
  return true;
}

// Status wird automatisch aus der Projektlaufzeit erkannt: "Noch nicht aktiv" (Start liegt in der
// Zukunft), "Beendet" (Ende liegt in der Vergangenheit) oder sonst "Aktiv". "Pausiert" ist die einzige
// manuelle Ausnahme – wird sie im Projekt gesetzt, überschreibt sie die automatische Erkennung.
function computedStatus(p) {
  if (p.status === 'Pausiert') return 'Pausiert';
  const today = new Date();
  const todayUTC = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
  const ps = parseDateUTC(p.start_date);
  const pe = parseDateUTC(p.end_date);
  if (ps !== null && ps > todayUTC) return 'Noch nicht aktiv';
  if (pe !== null && pe < todayUTC) return 'Beendet';
  return 'Aktiv';
}
// CSS-Klassennamen dürfen keine Leerzeichen enthalten, daher eigene Klasse für "Noch nicht aktiv".
function statusBadgeClass(status) { return status === 'Noch nicht aktiv' ? 'Bevorstehend' : status; }

// ---------- AUTOMATISCHE SOLL-BERECHNUNG (aus Projektlaufzeit) ----------

function round1(n) { return Math.round((n || 0) * 10) / 10; }
function parseDateUTC(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function daysInclusive(a, b) { return Math.round((b - a) / 86400000) + 1; }
function monthRangeUTC(monthStr) { const [y, m] = monthStr.split('-').map(Number); return [Date.UTC(y, m - 1, 1), Date.UTC(y, m, 0)]; }

// Liste aller Kalendertage eines Monats (für das Contractor-Timesheet: ein Eingabefeld pro Tag).
function daysOfMonth(monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const out = [];
  for (let d = 1; d <= last; d++) {
    const date = monthStr + '-' + String(d).padStart(2, '0');
    const weekday = new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('de-DE', { weekday: 'short', timeZone: 'UTC' });
    out.push({ date, weekday });
  }
  return out;
}

// Gesamte "bestellte" Stunden über die komplette Projektlaufzeit. Bei KH: Std./Woche x Wochen.
// Bei peax gibt es kein Std./Woche - dort steht die Gesamtstundenzahl bereits direkt in
// amount_ordered_hours (wird beim Verteilen auf Monate weiter unten anteilig nach Tagen aufgeteilt).
// Bei Perm-Projekten (Pauschalhonorar statt Stundenabrechnung) zählt immer genau 1 Stunde,
// damit Umsatz = Stunden x Charge/h weiterhin die volle Rechnungssumme ergibt.
function projectTotalSollHours(p) {
  if (p.projekttyp === 'perm') return p.start_date ? 1 : 0;
  const ps = parseDateUTC(p.start_date), pe = parseDateUTC(p.end_date);
  if (ps === null || pe === null || pe < ps) return 0;
  if (p.org === 'peax') return round1(p.amount_ordered_hours || 0);
  return round1((p.wochenstunden || 0) * daysInclusive(ps, pe) / 7);
}

// Anteil der Gesamtstunden, der auf einen bestimmten Monat entfällt (nach Tagesüberlappung).
// Bei Perm-Projekten fällt die gesamte 1 Stunde in den Monat des Startdatums (= Placement-Monat).
// Bei peax wird dafür die bestellte Gesamtstundenzahl (amount_ordered_hours) gleichmäßig über die
// Kalendertage der Projektlaufzeit verteilt (Tage im Monat / Gesamttage x Gesamtstunden) - das
// Gegenstück zu Std./Woche x Tage/7 bei KH, nur eben ausgehend von der Gesamtzahl statt einer Wochenrate.
function projectMonthSollHours(p, monthStr) {
  if (p.projekttyp === 'perm') {
    return (p.start_date && p.start_date.slice(0, 7) === monthStr) ? 1 : 0;
  }
  const ps = parseDateUTC(p.start_date), pe = parseDateUTC(p.end_date);
  if (ps === null || pe === null || pe < ps) return 0;
  const [ms, me] = monthRangeUTC(monthStr);
  const os = Math.max(ps, ms), oe = Math.min(pe, me);
  if (os > oe) return 0;
  const overlapDays = daysInclusive(os, oe);
  if (p.org === 'peax') {
    if (p.amount_ordered_hours == null) return 0;
    const totalDays = daysInclusive(ps, pe);
    if (!totalDays) return 0;
    return round1(p.amount_ordered_hours * overlapDays / totalDays);
  }
  return round1((p.wochenstunden || 0) * overlapDays / 7);
}

function monthListForProject(p) {
  if (p.projekttyp === 'perm') return p.start_date ? [p.start_date.slice(0, 7)] : [];
  if (!p.start_date || !p.end_date) return [];
  const [sy, sm] = p.start_date.split('-').map(Number);
  const [ey, em] = p.end_date.split('-').map(Number);
  const out = []; let y = sy, m = sm, guard = 0;
  while ((y < ey || (y === ey && m <= em)) && guard < 240) {
    out.push(y + '-' + String(m).padStart(2, '0'));
    m++; if (m > 12) { m = 1; y++; }
    guard++;
  }
  return out;
}

// Gleicht die SOLL-Einträge eines Projekts mit der berechneten Monatsverteilung ab.
// Manuell überschriebene Monate (auto === false) werden dabei nicht angetastet.
async function syncAutoSoll(proj) {
  const months = monthListForProject(proj);
  const monthSet = new Set(months);
  const existing = data.entries.filter(e => e.project_id === proj.id && e.kind === 'soll');

  for (const m of months) {
    const hours = projectMonthSollHours(proj, m);
    const ex = existing.find(e => e.month === m);
    if (!ex) {
      await sb.from('entries').insert({ project_id: proj.id, kind: 'soll', month: m, stunden: hours, auto: true });
    } else if (ex.auto && Math.abs((ex.stunden || 0) - hours) > 0.05) {
      await sb.from('entries').update({ stunden: hours }).eq('id', ex.id);
    }
  }
  const stale = existing.filter(e => e.auto && !monthSet.has(e.month));
  for (const e of stale) {
    await sb.from('entries').delete().eq('id', e.id);
  }
  await loadAll();
}

async function recalcAllSoll() {
  for (const p of data.projects) {
    await syncAutoSoll(p);
  }
}

function computeEntry(e) {
  const p = project(e.project_id);
  const chargeH = p ? p.charge_h : 0;
  const payH = p ? p.pay_h : 0;
  const stunden = e.stunden || 0;
  const umsatz = stunden * chargeH;
  const kosten = stunden * payH;
  return { stunden, umsatz, kosten, rohertrag: umsatz - kosten };
}
function sumEntries(list) {
  return list.reduce((acc, e) => {
    const c = computeEntry(e);
    acc.stunden += c.stunden; acc.umsatz += c.umsatz; acc.kosten += c.kosten; acc.rohertrag += c.rohertrag;
    return acc;
  }, { stunden: 0, umsatz: 0, kosten: 0, rohertrag: 0 });
}
function entriesOf(kind) { return data.entries.filter(e => e.kind === kind); }

// Gruppiert SOLL- und IST-Zahlen nach Kunde: Umsatz (Stunden x Charge/h), Kosten (Stunden x Pay/h)
// und Rohertrag (Umsatz - Kosten), summiert über alle Projekte des Kunden.
function customerBreakdown(sollEntries, istEntries) {
  const kunden = Array.from(new Set(data.projects.map(p => p.kunde))).sort();
  return kunden.map(k => {
    const projectIds = new Set(data.projects.filter(p => p.kunde === k).map(p => p.id));
    const soll = sumEntries(sollEntries.filter(e => projectIds.has(e.project_id)));
    const ist = sumEntries(istEntries.filter(e => projectIds.has(e.project_id)));
    return {
      kunde: k,
      sollUmsatz: soll.umsatz, istUmsatz: ist.umsatz,
      sollKosten: soll.kosten, istKosten: ist.kosten,
      sollRohertrag: soll.rohertrag, istRohertrag: ist.rohertrag,
    };
  });
}
function allMonthsUsed() {
  const set = new Set();
  data.entries.forEach(e => set.add(e.month));
  set.add(currentMonthStr());
  return Array.from(set).sort();
}
function statusFromErf(erf, hasSoll) {
  if (!hasSoll) return null;
  if (erf >= 0.9) return 'Gut';
  if (erf >= 0.8) return 'Achtung';
  return 'Kritisch';
}
function monthLabel(m) { const [y, mo] = m.split('-').map(Number); return MONTH_NAMES[mo - 1] + ' ' + y; }
function monthLabelEN(m) { const [y, mo] = m.split('-').map(Number); return MONTH_NAMES_EN[mo - 1] + ' ' + y; }

// ---------- PROVISIONEN ----------

function consultant(id) { return data.consultants.find(c => c.id === id); }
function consultantName(id) { const c = consultant(id); return c ? c.name : '–'; }

// Umsatz, der einem Consultant aus einem Projekt zugerechnet wird: voll, wenn er alleine
// oder mit sich selbst in beiden Rollen zugewiesen ist; halb, wenn zwei unterschiedliche
// Consultants am Projekt hängen.
function consultantShareForProject(p, consultantId) {
  const c1 = p.consultant1_id, c2 = p.consultant2_id;
  const involved = c1 === consultantId || c2 === consultantId;
  if (!involved) return 0;
  if (c1 && c2 && c1 !== c2) return 0.5;
  return 1;
}

// Summe des einem Consultant zugerechneten Rohertrags (Umsatz - Kosten = Stunden x Marge/h) über
// eine Liste von Entries (z.B. alle IST-Einträge eines Monats). Provision wird auf Rohertrag berechnet, nicht auf Umsatz.
function attributedRevenue(consultantId, entries) {
  let total = 0;
  for (const e of entries) {
    const p = project(e.project_id);
    if (!p) continue;
    const share = consultantShareForProject(p, consultantId);
    if (share > 0) total += computeEntry(e).rohertrag * share;
  }
  return total;
}

function quarterOfMonth(monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  const q = Math.floor((m - 1) / 3) + 1;
  return { year: y, quarter: q };
}
function monthsInQuarter(year, quarter) {
  const startM = (quarter - 1) * 3 + 1;
  return [0, 1, 2].map(i => year + '-' + String(startM + i).padStart(2, '0'));
}
function quarterLabel(year, quarter) { return 'Q' + quarter + ' ' + year; }
function monthsInYear(year) { return Array.from({ length: 12 }, (_, i) => year + '-' + String(i + 1).padStart(2, '0')); }
function yearOfMonth(monthStr) { return Number(monthStr.split('-')[0]); }

// Team-Mitglieder eines Team-Leads, aus team_memberships (nicht mehr über ein einzelnes
// team_lead_id-Feld auf dem Mitglied) - so kann eine Person gleichzeitig bei mehreren
// Team-Boni mitzählen (z.B. bei peax Erik/Georg bei Sam UND bei Valentin).
function teamMembersOf(leadId) {
  const ids = new Set(data.team_memberships.filter(tm => tm.team_lead_id === leadId).map(tm => tm.member_id));
  return data.consultants.filter(c => ids.has(c.id));
}

// Zeitraum-Fenster für den Team-Bonus eines Leads, je nach team_rate_period
// ('quarterly' oder 'yearly'), bezogen auf den im Provisionen-Tab gewählten Monat.
function periodWindowFor(lead, refMonth) {
  if (lead.team_rate_period === 'yearly') {
    const year = yearOfMonth(refMonth);
    return { months: monthsInYear(year), label: String(year) };
  }
  const { year, quarter } = quarterOfMonth(refMonth);
  return { months: monthsInQuarter(year, quarter), label: quarterLabel(year, quarter) };
}

// Detail-Zeilen (pro Projekt/Freelancer) für die Provisionsabrechnung eines Consultants,
// über eine gegebene Liste von IST-Einträgen (Monat oder ganzes Quartal).
function projectRowsForConsultant(consultantId, entries) {
  const rows = [];
  for (const e of entries) {
    const p = project(e.project_id);
    if (!p) continue;
    const share = consultantShareForProject(p, consultantId);
    if (share <= 0) continue;
    const c = computeEntry(e);
    rows.push({
      month: e.month, kunde: p.kunde, contractor: p.contractor,
      stunden: c.stunden, rohertragVoll: c.rohertrag, share, rohertragAnteil: c.rohertrag * share,
    });
  }
  return rows.sort((a, b) => a.month === b.month ? a.kunde.localeCompare(b.kunde) : a.month.localeCompare(b.month));
}

        <div class="field-row">
          <div class="field"><label>Team-Satz</label><input type="number" step="0.01" id="cf_team_rate" value="${v.team_rate}"></div>
          <div class="field"><label>Abrechnungszeitraum</label>
            <select id="cf_team_rate_period">
              <option value="quarterly" ${v.team_rate_period !== 'yearly' ? 'selected' : ''}>Pro Quartal</option>
              <option value="yearly" ${v.team_rate_period === 'yearly' ? 'selected' : ''}>Einmal pro Jahr</option>

          <div style="display:flex;flex-wrap:wrap;gap:10px;border:1px solid var(--border);border-radius:8px;padding:10px;">
            ${otherConsultants.length ? otherConsultants.map(x => `
              <label style="display:flex;align-items:center;gap:5px;font-size:13px;font-weight:400;margin:0;">
                <input type="checkbox" class="cf_team_member" value="${x.id}" ${currentMemberIds.has(x.id) ? 'checked' : ''}> ${x.name}
              </label>`).join('') : '<span class="empty" style="padding:0;">keine anderen Consultants vorhanden</span>'}
          </div>
          <div class="empty" style="text-align:left;padding:6px 0 0;">Eine Person kann gleichzeitig bei mehreren Team-Leads als Mitglied angehakt sein - ihr Rohertrag zählt dann unabhängig bei jedem Bonus mit.</div>
        </div>

      <div class="modal-actions">
        ${c.id ? '<button class="btn danger" id="modalDeleteConsultant">Löschen</button>' : ''}
        <button class="btn" id="modalCancelConsultant">Abbrechen</button>
        <button class="btn primary" id="modalSaveConsultant">Speichern</button>
      </div>
    </div>`;
  document.getElementById('app').appendChild(overlay);

  const isTeamLeadSel = document.getElementById('cf_is_team_lead');
  const teamLeadFields = document.getElementById('cf_team_lead_fields');
  isTeamLeadSel.addEventListener('change', () => {
    teamLeadFields.style.display = isTeamLeadSel.value === 'true' ? '' : 'none';

  document.getElementById('modalCancelConsultant').addEventListener('click', () => { modalConfig = null; render(); });
  if (c.id) document.getElementById('modalDeleteConsultant').addEventListener('click', () => deleteConsultant(c.id));
  document.getElementById('modalSaveConsultant').addEventListener('click', async () => {
    const payload = {
      org: c.id ? c.values.org : activeOrg, // Firma steht fest, sobald der Consultant existiert
      name: document.getElementById('cf_name').value.trim(),
      rate: Number(document.getElementById('cf_rate').value) || 0,
      is_team_lead: document.getElementById('cf_is_team_lead').value === 'true',
      team_rate: Number(document.getElementById('cf_team_rate').value) || 0,
      team_rate_period: document.getElementById('cf_team_rate_period').value === 'yearly' ? 'yearly' : 'quarterly',
    };
    const checkedMemberIds = Array.from(document.querySelectorAll('.cf_team_member:checked')).map(el => el.value);
    let consultantId = c.id;
    if (c.id) {
      await sb.from('consultants').update(payload).eq('id', c.id);
    } else {
      const { data: inserted } = await sb.from('consultants').insert(payload).select().single();
      consultantId = inserted ? inserted.id : null;

    // Team-Mitgliedschaften abgleichen (nur relevant, falls dieser Consultant Team-Lead ist) -
    // bestehende entfernen, die nicht mehr angehakt sind, neue hinzufügen. Falls die Migration

    if (consultantId) {

// Bewusst eine eigene, kleine Verwaltung getrennt von den Consultants oben - siehe Kommentar
// am Anfang von migration_contractor_timesheets.sql für den Unterschied.

function contractor(id) { return data.contractors.find(c => c.id === id); }
function contractorName(id) { const c = contractor(id); return c ? c.name : '–'; }

function openContractorModal(id) {

    pickerSearch: '', pickerExpanded: new Set(), pickerChecked: null, pickerExpandedInit: false,
  };
  render();
}

function renderContractorModal(c) {
  const v = c.values;
  // Die Kunde/Projekt-Auswahl kommt bewusst aus dem CRM (Tab "CRM"), nicht direkt aus dem
  // Tab "Projekte": dort werden die konkreten Subprojekte pro Kunde angelegt (candidates.kunde
  // + candidates.projekt_name) - das Projekte-Sheet selbst ist zu allgemein gefasst, um darauf
  // ein Timesheet sinnvoll aufzuteilen. Ein Kandidat muss dafür schon per "Projekt erzeugen" im
  // CRM mit einem echten Projekt verknüpft sein (candidates.linked_project_id) - erst dann kann
  // ein Contractor auch tatsächlich Stunden dagegen buchen (contractor_projects zeigt technisch
  // weiterhin auf projects.id, die Anzeige/Gruppierung kommt aber aus den CRM-Kandidaten).
  const assignedIds = c.id ? new Set(data.contractorProjects.filter(cp => cp.contractor_id === c.id).map(cp => cp.project_id)) : new Set();
  if (!c.pickerChecked) c.pickerChecked = new Set(assignedIds);

  // Leaf-Elemente sind die CRM-Subprojekte (candidate_projects), gruppiert nach dem Kunden
  // ihres jeweiligen Kandidaten (kunde_id, nicht mehr nach Textvergleich - vermeidet die
  // früheren Gruppierungs-Doppler durch Tippfehler/Leerzeichen im Freitext) - nicht die
  // Kandidaten selbst, da ein Kandidat mehrere Subprojekte beim selben Kunden haben kann.
  const byKunde = new Map();
  data.candidateProjects.forEach(sp => {
    const cd = candidate(sp.candidate_id);
    if (!cd || !cd.kunde_id) return;
    const key = cd.kunde_id;
    if (!byKunde.has(key)) byKunde.set(key, []);
    byKunde.get(key).push({ sp, cd });
  });

  const nameNorm = (v.name || '').trim().toLowerCase();
  const suggestedKunden = new Set();
  if (nameNorm) data.candidates.forEach(cd => { if (cd.kunde_id && (cd.contractor || '').trim().toLowerCase() === nameNorm) suggestedKunden.add(cd.kunde_id); });
  // Kunden von bereits angehakten Projekten (auch wenn gerade erst über die Suche
  // dazugewählt) bleiben immer sichtbar, damit eine Auswahl nicht verschwindet, sobald
  // die Suche wieder leer ist.
  const checkedKunden = new Set();
  data.candidateProjects.forEach(sp => { if (sp.linked_project_id && c.pickerChecked.has(sp.linked_project_id)) { const cd = candidate(sp.candidate_id); if (cd && cd.kunde_id) checkedKunden.add(cd.kunde_id); } });
  // Standardmäßig (ohne Suche) nur die zu diesem Contractor passenden Kunden zeigen - nicht
  // die komplette Kundenliste der Firma. Andere Kunden findet man über die Suche.
  const defaultKunden = new Set([...suggestedKunden, ...checkedKunden]);
  if (!c.pickerExpandedInit) { defaultKunden.forEach(k => c.pickerExpanded.add(k)); c.pickerExpandedInit = true; }

  const search = (c.pickerSearch || '').trim().toLowerCase();
  const kundenList = Array.from(byKunde.keys()).sort((a, b) => kundeName(a).localeCompare(kundeName(b)))
    .filter(kid => search ? kundeName(kid).toLowerCase().includes(search) : defaultKunden.has(kid));

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${c.id ? 'Contractor bearbeiten' : 'Neuer Contractor'}</h3>
      <div class="field"><label>Name</label><input type="text" id="ctf_name" value="${v.name || ''}"></div>
      <div class="field"><label>E-Mail (für den Timesheet-Login)</label><input type="text" id="ctf_email" value="${v.email || ''}" placeholder="freelancer@beispiel.com"></div>
      <div class="empty" style="text-align:left;padding:0 0 8px;">Sobald hier eine E-Mail hinterlegt ist, kann sich die Person auf der normalen Login-Seite mit "Registrieren" selbst einen Zugang anlegen (mit genau dieser E-Mail) und sieht danach nur ihr eigenes Timesheet.</div>
      <div class="field">
        <label>Kunde / Subprojekte aus dem CRM (worauf dieser Contractor Stunden buchen darf)</label>
        <input type="text" id="ctf_picker_search" placeholder="🔍 weiteren Kunden suchen…" value="${c.pickerSearch || ''}" style="width:100%;margin-bottom:8px;">
        <div style="display:flex;flex-direction:column;gap:2px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;max-height:260px;overflow:auto;">
          ${kundenList.length ? kundenList.map(kid => {
            const itemsOfKunde = byKunde.get(kid);
            const checkedCount = itemsOfKunde.filter(({ sp }) => sp.linked_project_id && c.pickerChecked.has(sp.linked_project_id)).length;
            const expanded = c.pickerExpanded.has(kid) || !!search;
            const isSuggested = suggestedKunden.has(kid);
            return `
            <div>
              <div data-toggle-kunde="${kid}" style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:5px 2px;font-weight:600;font-size:13px;">
                <span style="display:inline-block;width:14px;">${expanded ? '▾' : '▸'}</span>
                <span>${kundeName(kid)}</span>
                ${checkedCount ? `<span class="mini-badge manuell">${checkedCount}</span>` : ''}
                ${isSuggested ? `<span class="mini-badge auto">Vorschlag</span>` : ''}
              </div>
              ${expanded ? `
              <div style="padding-left:26px;display:flex;flex-direction:column;gap:4px;margin-bottom:4px;">
                ${itemsOfKunde.map(({ sp, cd }) => sp.linked_project_id ? `
                  <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;margin:0;">
                    <input type="checkbox" class="ctf_project" value="${sp.linked_project_id}" ${c.pickerChecked.has(sp.linked_project_id) ? 'checked' : ''}> ${sp.projekt_name || cd.contractor}${sp.projekt_nummer ? ' (#' + sp.projekt_nummer + ')' : ''}
                  </label>` : `
                  <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;margin:0;color:var(--muted);" title="Im CRM erst auf 'Projekt erzeugen' klicken, bevor darauf gebucht werden kann">
                    <input type="checkbox" disabled> ${sp.projekt_name || cd.contractor}${sp.projekt_nummer ? ' (#' + sp.projekt_nummer + ')' : ''} (noch kein Projekt erzeugt)
                  </label>`).join('')}
              </div>` : ''}
            </div>`;
          }).join('') : `<span class="empty" style="padding:0;">${search ? 'keine passenden Kunden' : 'kein passender Kunde anhand des Namens gefunden – oben nach dem Kunden suchen'}</span>`}
        </div>
        <div class="empty" style="text-align:left;padding:6px 0 0;">Subprojekte werden im Tab "CRM" pro Kunde angelegt. Es werden nur die zum Namen passenden Kunden angezeigt - über die Suche oben findest du auch andere.</div>
      </div>
      <div class="modal-actions">
        ${c.id ? '<button class="btn danger" id="modalDeleteContractor">Löschen</button>' : ''}
        <button class="btn" id="modalCancelContractor">Abbrechen</button>
        <button class="btn primary" id="modalSaveContractor">Speichern</button>
      </div>
    </div>`;
  document.getElementById('app').appendChild(overlay);

  // Aktuelle Checkbox-Auswahl im modalConfig sichern, bevor ein Re-Render (Suche/Aufklappen)
  // den DOM neu aufbaut - sonst gingen bereits gesetzte Haken bei versteckten/eingeklappten
  // Zeilen verloren.
  function syncChecked() {
    document.querySelectorAll('.ctf_project').forEach(el => { if (el.checked) c.pickerChecked.add(el.value); else c.pickerChecked.delete(el.value); });
  }
  document.querySelectorAll('.ctf_project').forEach(cb => cb.addEventListener('change', syncChecked));
  document.querySelectorAll('[data-toggle-kunde]').forEach(el => el.addEventListener('click', () => {
    syncChecked();
    const k = el.dataset.toggleKunde;
    if (c.pickerExpanded.has(k)) c.pickerExpanded.delete(k); else c.pickerExpanded.add(k);
    render();
  }));
  const pickerSearchInput = document.getElementById('ctf_picker_search');
  if (pickerSearchInput) pickerSearchInput.addEventListener('input', () => {
    syncChecked();
    c.pickerSearch = pickerSearchInput.value;
    render();
    const fresh = document.getElementById('ctf_picker_search');
    if (fresh) { fresh.focus(); const pos = fresh.value.length; fresh.setSelectionRange(pos, pos); }
  });

  document.getElementById('modalCancelContractor').addEventListener('click', () => { modalConfig = null; render(); });
  if (c.id) document.getElementById('modalDeleteContractor').addEventListener('click', () => deleteContractor(c.id));
  document.getElementById('modalSaveContractor').addEventListener('click', async () => {
    syncChecked();
    const payload = {
      org: c.id ? c.values.org : activeOrg,
      name: document.getElementById('ctf_name').value.trim(),
      email: document.getElementById('ctf_email').value.trim() || null,
    };
    let contractorId = c.id;
    if (contractorId) await sb.from('contractors').update(payload).eq('id', contractorId);
    else { const { data: inserted } = await sb.from('contractors').insert(payload).select().single(); contractorId = inserted && inserted.id; }
    if (contractorId) {
      const checkedIds = Array.from(c.pickerChecked);
      const toRemove = Array.from(assignedIds).filter(id => !c.pickerChecked.has(id));
      const toAdd = checkedIds.filter(id => !assignedIds.has(id));
      for (const projectId of toRemove) await sb.from('contractor_projects').delete().eq('contractor_id', contractorId).eq('project_id', projectId);
      for (const projectId of toAdd) await sb.from('contractor_projects').insert({ contractor_id: contractorId, project_id: projectId });
    }
    modalConfig = null;
    await loadAll();
  });
}

// ---------- CRM (Kandidaten/Freelancer) ----------
// Ein Kandidat bildet die Beziehung Freelancer<->Kunde ab (Name, E-Mails, VAT-ID). Darunter
// können mehrere Subprojekte hängen (candidate_projects) - manche Freelancer arbeiten für
// denselben Kunden gleichzeitig an mehreren, eigenständigen Projekten mit jeweils eigenem
// Namen, eigener Projektnummer und eigenen Konditionen. "Projekt erzeugen" übernimmt pro
// Subprojekt nur die Felder, die es auch in der Tabelle "projects" gibt (Kunde/Contractor
// kommen dabei vom übergeordneten Kandidaten) - Projektname, Projektnummer, E-Mails und
// VAT-ID bleiben bewusst nur im CRM.

function candidate(id) { return data.candidates.find(cd => cd.id === id); }
function candidateProjectsOf(candidateId) { return data.candidateProjects.filter(cp => cp.candidate_id === candidateId); }

// ---------- CRM (Kunden-Stammdaten: Anschrift, VAT-ID, Ansprechpartner, Payment Terms) ----------
// Projekte und Kandidaten wählen ihren Kunden per Dropdown aus dieser Liste (kunde_id) statt per
// Freitext - siehe migration_kunden.sql. Das bisherige Textfeld "kunde" bleibt als denormalisierter
// Anzeigename bestehen (wird beim Speichern/Umbenennen automatisch synchron gehalten), damit alle
// bestehenden Auswertungen (Filter, Gruppierung, Tortendiagramm, Suche) unverändert weiterlaufen.

function kundeName(id) { const k = kunde(id); return k ? k.name : '–'; }

        <label style="font-size:12.5px;color:var(--muted);font-weight:600;">Monat:</label>

        <button class="btn primary" id="generateKundenReportBtn">Report generieren (.xlsx)</button>
      </div>
    </div>

}

// Summe der freigegebenen (approved) Timesheet-Stunden eines Projekts in einem bestimmten Monat -
// Basis für die "Work quantity"-Spalte im Kunden-Report (siehe generateKundenReport).
function approvedHoursForProjectMonth(projectId, month) {
  const tsIds = new Set(data.timesheets.filter(t => t.project_id === projectId && t.month === month && t.status === 'approved').map(t => t.id));
  if (!tsIds.size) return 0;
  return data.timesheetDays.filter(d => tsIds.has(d.timesheet_id)).reduce((s, d) => s + (Number(d.stunden) || 0), 0);
}

// Baut eine Excel-Datei im Stil des bisherigen TimesheetPortal-Exports: eine Zeile pro
// CRM-Subprojekt (candidate_projects) mit tatsächlich erfassten (freigegebenen) Stunden im
// gewählten Monat. "Rate code"/"Rate description" entsprechen Projektnummer/Projektname des
// Subprojekts, "Placement code/description" und "PO" kommen vom übergeordneten Kandidaten.
function generateKundenReport() {
  if (!reportKundeId) { alert('Bitte zuerst einen Kunden auswählen.'); return; }
  if (typeof XLSX === 'undefined') { alert('Die Excel-Bibliothek konnte nicht geladen werden (CDN/Internetverbindung prüfen).'); return; }
  const k = kunde(reportKundeId);
  const candidatesOfKunde = data.candidates.filter(cd => cd.kunde_id === reportKundeId);
  const rows = [];
  candidatesOfKunde.forEach(cd => {
    candidateProjectsOf(cd.id).filter(sp => sp.linked_project_id).forEach(sp => {
      const hours = approvedHoursForProjectMonth(sp.linked_project_id, reportMonth);
      if (!hours) return; // wie im Original-Report: nur Zeilen mit tatsächlich erfassten Stunden
      const payRate = cd.pay_h || 0;
      const chargeRate = cd.charge_h || 0;
      const consultantNames = [cd.consultant1_id, cd.consultant2_id].filter(Boolean).map(consultantName).join(' / ');
      rows.push({
        'Placement code': cd.placement_code || '',
        'Contractor name': cd.contractor || '',
        'Client name': k ? k.name : '',
        'Placement description': cd.placement_description || '',
        'Work quantity': round1(hours),
        'Rate code': sp.projekt_nummer || '',
        'Rate description': sp.projekt_name || '',
        'Units': 'Hours',
        'Pay rate': payRate,
        'Total pay': round1(hours * payRate),
        'Charge rate': chargeRate,
        'Total charge': round1(hours * chargeRate),
        'Placement consultant': consultantNames,
        'Placement PO': cd.po_reference || '',
        'Placement: Purchase Order / Invoice Reference': cd.po_reference || '',
      });
    });
  });
  if (!rows.length) { alert('Keine freigegebenen Stunden für diesen Kunden/Monat gefunden.'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Report');
  const kundeSlug = (k ? k.name : 'Kunde').replace(/[^a-z0-9]+/gi, '_');
  XLSX.writeFile(wb, `Report_${kundeSlug}_${reportMonth}.xlsx`);
}

// muss vor jedem Re-Render (Karte hinzufügen/entfernen) aufgerufen werden, sonst gingen bereits

// ...) gelten für den ganzen Kandidaten und liegen daher nicht mehr pro Karte, sondern werden separat
// im modalSaveCandidate-Handler aus den cd_*-Feldern gelesen.
function syncSubProjectsFromDOM(c) {
  c.subProjects.forEach(sp => {

    sp.projekt_name = nameEl.value.trim();
    sp.projekt_nummer = document.getElementById('sp_nummer_' + k).value.trim();

}

// Erzeugt aus einem CRM-Subprojekt einen echten Eintrag im Tab "Projekte" - Kunde/Contractor
// UND alle Konditionen (Zeitraum, Pay/Charge, Consultants, ...) kommen vom übergeordneten
// Kandidaten, nur Projektname/-nummer vom Subprojekt selbst. Übernimmt bewusst NUR die Felder,
// die es auch in der Tabelle "projects" gibt.
async function generateProjectFromSubProject(c, sp) {
  if (sp.linked_project_id && !confirm('Für dieses Subprojekt wurde bereits ein Projekt erzeugt. Trotzdem ein weiteres, neues Projekt anlegen?')) return;
  const org = c.id ? c.values.org : activeOrg;
  const val = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const kundeId = (val('cd_kunde') !== undefined ? val('cd_kunde') : c.values.kunde_id) || null;
  if (!kundeId) { alert('Bitte zuerst einen Kunden auswählen.'); return; }
  const kunde = kundeName(kundeId);
  const contractor = val('cd_contractor') !== undefined ? val('cd_contractor').trim() : c.values.contractor;
  const projekttyp = val('cd_art') !== undefined ? val('cd_art') : c.values.projekttyp;
  const isPerm = projekttyp === 'perm';
  const rechnungsname = (val('cd_rechnungsname') !== undefined ? val('cd_rechnungsname').trim() : c.values.rechnungsname) || null;
  const start_date = (val('cd_start') !== undefined ? val('cd_start') : c.values.start_date) || null;
  const end_date = (val('cd_ende') !== undefined ? val('cd_ende') : c.values.end_date) || (isPerm ? start_date : null);
  const pay_h = Number(val('cd_payH') !== undefined ? val('cd_payH') : c.values.pay_h) || 0;
  const charge_h = Number(val('cd_chargeH') !== undefined ? val('cd_chargeH') : c.values.charge_h) || 0;
  const consultant1_id = (val('cd_consultant1') !== undefined ? val('cd_consultant1') : c.values.consultant1_id) || null;
  const consultant2_id = (val('cd_consultant2') !== undefined ? val('cd_consultant2') : c.values.consultant2_id) || null;
  const payload = {
    org, projekttyp, kunde_id: kundeId, kunde, contractor,
    rechnungsname, start_date, end_date,
    pay_h, charge_h, consultant1_id, consultant2_id,
    status: 'Auto',
  };
  if (org === 'peax') {
    const amountEl = document.getElementById('cd_amountordered'), dealEl = document.getElementById('cd_dealvalue');
    payload.amount_ordered_hours = amountEl ? (amountEl.value !== '' ? Number(amountEl.value) : null) : c.values.amount_ordered_hours;
    payload.deal_value = dealEl ? (dealEl.value !== '' ? Number(dealEl.value) : null) : c.values.deal_value;
    payload.wochenstunden = 0;
  } else {
    const wochenEl = document.getElementById('cd_wochenstunden');
    payload.wochenstunden = isPerm ? 0 : (wochenEl ? Number(wochenEl.value) || 0 : (c.values.wochenstunden || 0));
  }
  const { data: inserted, error } = await sb.from('projects').insert(payload).select().single();
  if (error) { alert(error.message); return; }
  sp.linked_project_id = inserted.id;
  sp.status = 'Projekt erzeugt';
  if (sp.id) {
    await sb.from('candidate_projects').update({ linked_project_id: inserted.id, status: 'Projekt erzeugt' }).eq('id', sp.id);
  } else {
    // Subprojekt existiert noch nicht in der DB (neu angelegt, noch nicht gespeichert) -
    // gleich mit anlegen, damit die Verknüpfung nicht beim nächsten Speichern verloren geht.
    const { data: spInserted } = await sb.from('candidate_projects').insert({
      candidate_id: c.id, projekt_name: sp.projekt_name || null, projekt_nummer: sp.projekt_nummer || null,
      linked_project_id: inserted.id, status: 'Projekt erzeugt',
    }).select().single();
    if (spInserted) sp.id = spInserted.id;
  }
  await loadAll();
  await syncAutoSoll(inserted);
  render();
}

async function loadAll() {
  // allProjects/allConsultants kommen ungefiltert (RLS liefert automatisch nur die Firmen,
  // für die diese Person laut user_access Zugriff hat - bei Zugriff auf beide Firmen also
  // beide gemischt). data.projects/consultants werden danach auf activeOrg eingegrenzt,
  // data.allProjects bleibt firmenübergreifend für die KI-Vorschläge-Zuordnung erhalten.
  const [{ data: allProjects, error: e1 }, { data: entries, error: e2 }, { data: allConsultants, error: e3 }, { data: kiVorschlaege, error: e4 }, { data: teamMemberships, error: e5 }, { data: contractors, error: e6 }, { data: contractorProjects, error: e9 }, { data: timesheets, error: e7 }, { data: timesheetDays, error: e8 }, { data: candidates, error: e10 }, { data: candidateProjects, error: e11 }, { data: kunden, error: e12 }] = await Promise.all([
    sb.from('projects').select('*').order('created_at'),
    sb.from('entries').select('*'),
    sb.from('consultants').select('*').order('created_at'),
    // ki_vorschlaege ist optional – falls die Tabelle (noch) nicht existiert (Migration nicht ausgeführt),
    // soll die App trotzdem normal weiterlaufen, nur der Tab "KI-Vorschläge" bleibt dann leer.
    sb.from('ki_vorschlaege').select('*').order('created_at', { ascending: false }),
    // team_memberships ist ebenfalls optional (siehe migration_team_bonus.sql) - ohne die Migration
    // bleiben Team-Boni einfach leer, statt die App zum Absturz zu bringen.
    sb.from('team_memberships').select('*'),
    // contractors/contractor_projects/timesheets/timesheet_days sind ebenfalls optional (siehe
    // migration_contractor_timesheets.sql) - ohne die Migration bleibt der Tab "Timesheets"
    // einfach leer, statt die App zum Absturz zu bringen.
    sb.from('contractors').select('*').order('name'),
    sb.from('contractor_projects').select('*'),
    sb.from('timesheets').select('*').order('month', { ascending: false }),
    sb.from('timesheet_days').select('*'),
    // candidates/candidate_projects (CRM) sind ebenfalls optional (siehe migration_crm.sql
    // und migration_crm_subprojekte.sql).
    sb.from('candidates').select('*').order('created_at', { ascending: false }),
    sb.from('candidate_projects').select('*').order('created_at', { ascending: false }),
    // kunden (CRM-Stammdaten pro Kunde) ist ebenfalls optional (siehe migration_kunden.sql).
    sb.from('kunden').select('*').order('name'),
  ]);
  if (e1 || e2 || e3) {
    console.error('load error', e1, e2, e3);
    renderError((e1 || e2 || e3).message);
    return;
  }
  if (e4) console.warn('ki_vorschlaege konnte nicht geladen werden (Migration ausgeführt?)', e4);
  if (e5) console.warn('team_memberships konnte nicht geladen werden (migration_team_bonus.sql ausgeführt?)', e5);
  if (e6 || e7 || e8 || e9) console.warn('Contractor-Timesheets konnten nicht geladen werden (migration_contractor_timesheets.sql ausgeführt?)', e6, e7, e8, e9);
  if (e10 || e11) console.warn('CRM-Kandidaten konnten nicht geladen werden (migration_crm.sql/migration_crm_subprojekte.sql ausgeführt?)', e10, e11);
  if (e12) console.warn('Kunden-CRM konnte nicht geladen werden (migration_kunden.sql ausgeführt?)', e12);
  data.allProjects = allProjects || [];
  data.projects = data.allProjects.filter(p => p.org === activeOrg);
  const projectIds = new Set(data.projects.map(p => p.id));
  data.entries = (entries || []).filter(e => projectIds.has(e.project_id));
  data.contractors = (contractors || []).filter(c => c.org === activeOrg);
  data.contractorProjects = (contractorProjects || []).filter(cp => projectIds.has(cp.project_id));
  data.timesheets = (timesheets || []).filter(t => projectIds.has(t.project_id));
  const timesheetIds = new Set(data.timesheets.map(t => t.id));
  data.timesheetDays = (timesheetDays || []).filter(d => timesheetIds.has(d.timesheet_id));
  data.candidates = (candidates || []).filter(cd => cd.org === activeOrg);
  const candidateIds = new Set(data.candidates.map(cd => cd.id));
  data.candidateProjects = (candidateProjects || []).filter(cp => candidateIds.has(cp.candidate_id));
  data.kunden = (kunden || []).filter(k => k.org === activeOrg);
  data.consultants = (allConsultants || []).filter(c => c.org === activeOrg);
  data.ki_vorschlaege = kiVorschlaege || [];
  data.team_memberships = teamMemberships || [];
  render();
}

// Ermittelt, auf welche Firma(en) diese E-Mail-Adresse laut Tabelle user_access Zugriff hat
// (RLS liefert dort ohnehin nur die eigenen Zeilen zurück, siehe migration_multi_org.sql).
// Merkt sich die zuletzt gewählte Firma im Browser (localStorage), damit man nach einem
// Reload nicht immer wieder auf die erste Firma zurückfällt.
async function initOrgAccess() {
  const { data: rows, error } = await sb.from('user_access').select('org');
  if (error) { console.error('user_access konnte nicht geladen werden', error); allowedOrgs = []; activeOrg = null; return; }
  allowedOrgs = Array.from(new Set((rows || []).map(r => r.org)));
  const saved = localStorage.getItem('activeOrg');
  activeOrg = allowedOrgs.includes(saved) ? saved : (allowedOrgs[0] || null);
}

function setActiveOrg(org) {
  if (!allowedOrgs.includes(org) || org === activeOrg) return;
  activeOrg = org;
  localStorage.setItem('activeOrg', org);
  loadAll();
}

async function handleLogin(email, password) {
  authBusy = true; authError = ''; renderAuth();
  const { error } = await sb.auth.signInWithPassword({ email, password });
  authBusy = false;
  if (error) { authError = error.message; renderAuth(); }
}
// Nur @konzepthaus-consulting.com (KH) oder @peaxagency.com (peax) dürfen sich registrieren.
// Das ist nur die Frontend-Vorabprüfung für eine sofortige, freundliche Fehlermeldung – die
// eigentliche Absicherung läuft serverseitig über einen Datenbank-Trigger auf auth.users
// (siehe migration_email_domains.sql), da der anon key öffentlich ist und Registrierungen
// theoretisch auch direkt über die Supabase-API versucht werden könnten. Derselbe Trigger
// trägt bei der Registrierung automatisch den passenden Firmen-Zugriff in user_access ein
// (peaxagency.com -> peax, konzepthaus-consulting.com -> kh) - nur Zugriff auf BEIDE Firmen
// (wie bei Rike) muss weiterhin von Hand per SQL Editor ergänzt werden.
const ALLOWED_EMAIL_DOMAINS = ['konzepthaus-consulting.com', 'peaxagency.com'];
function isAllowedEmail(email) {
  const e = (email || '').toLowerCase().trim();
  return ALLOWED_EMAIL_DOMAINS.some(d => e.endsWith('@' + d));
}

async function handleSignup(email, password) {
  authError = ''; authInfo = '';
  if (!isAllowedEmail(email)) {
    authError = `Registrierung ist nur mit einer @${ALLOWED_EMAIL_DOMAINS.join(' oder @')} E-Mail-Adresse möglich.`;
    renderAuth();
    return;
  }
  authBusy = true; renderAuth();
  const { data: res, error } = await sb.auth.signUp({ email, password });
  authBusy = false;
  if (error) { authError = error.message; renderAuth(); return; }
  if (res.session) return; // logged in immediately (email confirmation disabled)
  authInfo = 'Konto erstellt. Falls E-Mail-Bestätigung aktiviert ist, bitte den Link in deinem Postfach öffnen und dich danach anmelden.';
  authMode = 'login';
  renderAuth();
}
async function handleLogout() {
  await sb.auth.signOut();
}

function setupChart() {
  const sel = document.getElementById('dashMonthSel');
  if (sel) sel.addEventListener('change', () => { dashMonth = sel.value; render(); });

  // Kunden-Tortendiagramm: IST-Umsatz-Verteilung über alle Kunden, innerhalb des oben gewählten Zeitraums.
  const kundeCtx = document.getElementById('kundeChart');
  if (kundeCtx) {
    const sollForChart = dashMonth === 'all' ? entriesOf('soll') : entriesOf('soll').filter(e => e.month === dashMonth);
    const istForChart = dashMonth === 'all' ? entriesOf('ist') : entriesOf('ist').filter(e => e.month === dashMonth);
    const perKundeForChart = customerBreakdown(sollForChart, istForChart);
    if (kundeChart) { kundeChart.destroy(); kundeChart = null; }
    if (perKundeForChart.length) {
      kundeChart = new Chart(kundeCtx, {
        type: 'pie',
        data: {
          labels: perKundeForChart.map(k => k.kunde),
          datasets: [{ data: perKundeForChart.map(k => k.istUmsatz), backgroundColor: perKundeForChart.map((k, i) => PIE_COLORS[i % PIE_COLORS.length]) }],
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } },
      });
    }
  }

  // Checkboxen zur Auswahl, welche Kennzahlen im Monatstrend gezeigt werden (einzeln oder alle).
  ['umsatz', 'kosten', 'rohertrag'].forEach(key => {
    const cb = document.getElementById('trendShow_' + key);
    if (cb) cb.addEventListener('change', () => { trendShow[key] = cb.checked; render(); });
  });
  const trendShowAllBtn = document.getElementById('trendShowAllBtn');
  if (trendShowAllBtn) trendShowAllBtn.addEventListener('click', () => { trendShow = { umsatz: true, kosten: true, rohertrag: true }; render(); });

  // Monatstrend als Liniendiagramm: Umsatz, Kosten und Rohertrag (jeweils IST) in eigenen Farben,
  // zusätzlich SOLL als gestrichelte Linie in einem Grauton je Kennzahl (heller/dunkler), damit man
  // IST vs. SOLL für alle drei Kennzahlen auf einen Blick vergleichen kann.
  // tension: 0 = gerade Linien zwischen den echten Monatswerten, damit zwischen Monaten ohne
  // Daten keine unsinnigen "Hügel" durch Kurvenglättung entstehen.
  const months = allMonthsUsed();
  const istByMonth = months.map(m => sumEntries(entriesOf('ist').filter(e => e.month === m)));
  const sollByMonth = months.map(m => sumEntries(entriesOf('soll').filter(e => e.month === m)));
  const labels = months.map(monthLabel);
  const trendDatasetDefs = [
    { key: 'umsatz', label: 'Umsatz', color: '#2563eb', sollColor: '#9ca3af' },
    { key: 'kosten', label: 'Kosten', color: '#b91c1c', sollColor: '#6b7280' },
    { key: 'rohertrag', label: 'Rohertrag', color: '#15803d', sollColor: '#374151' },
  ];

  const ctx = document.getElementById('trendChart');
  if (trendChart) { trendChart.destroy(); trendChart = null; }
  if (ctx) {
    const activeDefs = trendDatasetDefs.filter(d => trendShow[d.key]);
    const datasets = [];
    activeDefs.forEach(d => {
      datasets.push({
        label: d.label + ' (IST)',
        data: istByMonth.map(v => v[d.key]),
        borderColor: d.color,
        backgroundColor: d.color,
        fill: false,
        tension: 0,
      });
      datasets.push({
        label: d.label + ' (SOLL)',
        data: sollByMonth.map(v => v[d.key]),
        borderColor: d.sollColor,
        backgroundColor: d.sollColor,
        borderDash: [6, 4],
        fill: false,
        tension: 0,
        pointRadius: 2,
      });
    });
    trendChart = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true } } },
    });
  }
}

// ---------- PROJEKTE ----------

// Baut einen durchsuchbaren Text aus genau den Werten, die auch in der Projekte-Tabelle
// angezeigt werden (Art, Kunde, Contractor, Daten, Zahlen, Consultants, Status) – so findet
// die Suche wie in Excel jedes Wort, das irgendwo in der Zeile sichtbar ist.
function projectSearchText(p) {
  const isPerm = p.projekttyp === 'perm';
  return [
    isPerm ? 'Perm' : 'Contract',
    p.kunde,
    p.contractor,
    p.rechnungsname,
    fmtDate(p.start_date),
    fmtDate(p.end_date),
    isPerm ? '' : p.wochenstunden,
    isPerm ? '1 Std. Pauschale' : fmtNum(projectTotalSollHours(p), 1),
    fmtEUR(p.pay_h),
    fmtEUR(p.charge_h),
    fmtEUR(margeH(p)),
    fmtPct(margePct(p)),
    [p.consultant1_id, p.consultant2_id].filter(Boolean).map(consultantName).join(' '),
    computedStatus(p),
  ].join(' ').toLowerCase();
}

// Sortiert und filtert die Projektliste für die Projekte-Ansicht. Kunden werden dabei
// immer alphabetisch einsortiert (bzw. per Sortier-Dropdown auch nach Start/Ende).
function filteredSortedProjects() {
  let list = data.projects.slice();
  if (projFilterKunde !== 'all') list = list.filter(p => p.kunde === projFilterKunde);
  if (projFilterStatus !== 'all') list = list.filter(p => computedStatus(p) === projFilterStatus);
  if (projFilterArt !== 'all') list = list.filter(p => (p.projekttyp === 'perm' ? 'perm' : 'contract') === projFilterArt);
  if (projFilterStartMonat) list = list.filter(p => p.start_date && p.start_date.slice(0, 7) === projFilterStartMonat);
  if (projFilterEndeMonat) list = list.filter(p => p.end_date && p.end_date.slice(0, 7) === projFilterEndeMonat);
  if (projSearch.trim()) {
    const q = projSearch.trim().toLowerCase();
    list = list.filter(p => projectSearchText(p).includes(q));
  }

  const dateVal = (s, fallback) => s ? parseDateUTC(s) : fallback;
  if (projSort === 'start_asc') list.sort((a, b) => dateVal(a.start_date, Infinity) - dateVal(b.start_date, Infinity));
  else if (projSort === 'start_desc') list.sort((a, b) => dateVal(b.start_date, -Infinity) - dateVal(a.start_date, -Infinity));
  else if (projSort === 'end_asc') list.sort((a, b) => dateVal(a.end_date, Infinity) - dateVal(b.end_date, Infinity));
  else if (projSort === 'end_desc') list.sort((a, b) => dateVal(b.end_date, -Infinity) - dateVal(a.end_date, -Infinity));
  else list.sort((a, b) => a.kunde.localeCompare(b.kunde) || a.contractor.localeCompare(b.contractor));

  return list;
}

// peax arbeitet beim SOLL anders als KH: statt automatisch aus Std./Woche x Laufzeit
// berechnet zu werden, wird die insgesamt bestellte Stundenzahl einmalig manuell im
// Projekt eingetragen (amount_ordered_hours). "Verbleibend" wird deshalb hier live
// berechnet (bestellt minus Summe aller bisher erfassten IST-Stunden dieses Projekts),
// statt gespeichert zu werden - so bleibt es automatisch aktuell, auch wenn neue
// IST-Stunden über die KI-Vorschläge aus Weclapp dazukommen.
function amountLeftHours(p) {
  if (p.amount_ordered_hours == null) return null;
  const used = data.entries.filter(e => e.kind === 'ist' && e.project_id === p.id).reduce((s, e) => s + (e.stunden || 0), 0);
  return round1(p.amount_ordered_hours - used);
}

  const chargeLabel = document.getElementById('f_chargeH_label');
  function applyArtUI() {

    const payload = {
      org: c.id ? c.values.org : activeOrg, // Firma steht fest, sobald das Projekt existiert
      projekttyp: isPerm ? 'perm' : 'contract',
      kunde_id: kundeIdVal,

    let proj = null;
    if (c.id) {
      const { data: updated } = await sb.from('projects').update(payload).eq('id', c.id).select().single();
      proj = updated;
    } else {
      const { data: inserted } = await sb.from('projects').insert(payload).select().single();
      proj = inserted;
    }
    if (proj) {
      // Contractor-Zugang (n:m, siehe contractor_projects) - Mehrfachauswahl, da z.B. bei
      // Siemens mehrere Contractors am selben Projekt arbeiten.
      const checkedIds = Array.from(document.querySelectorAll('.f_contractor_project:checked')).map(el => el.value);
      const existingIds = new Set(c.id ? data.contractorProjects.filter(cp => cp.project_id === c.id).map(cp => cp.contractor_id) : []);
      const toRemove = Array.from(existingIds).filter(id => !checkedIds.includes(id));
      const toAdd = checkedIds.filter(id => !existingIds.has(id));
      for (const contractorId of toRemove) await sb.from('contractor_projects').delete().eq('project_id', proj.id).eq('contractor_id', contractorId);
      for (const contractorId of toAdd) await sb.from('contractor_projects').insert({ project_id: proj.id, contractor_id: contractorId });
    }
    modalConfig = null;
    await loadAll();

// ---------- SOLL / IST MONATSERFASSUNG ----------

// Baut für einen gegebenen Monat/Kind (soll/ist) pro Projekt eine Zeile mit allen angezeigten
// Werten (inkl. berechnetem Umsatz/Kosten/Rohertrag) – Basis sowohl für die Tabelle als auch
// für die Excel-artige Volltextsuche und die Filter.
function entryRows(kind, monthVal) {
  const entries = entriesOf(kind);
  const [monthStart, monthEnd] = monthRangeUTC(monthVal);
  return data.projects
    .filter(p => {
      // Projekte, die erst nach diesem Monat starten, werden für diesen Monat gar nicht erst
      // angezeigt (macht keinen Sinn, z.B. im Januar einen Contractor zu sehen, der erst zum
      // 01.02. startet).
      const ps = parseDateUTC(p.start_date);
      if (ps !== null && ps > monthEnd) return false;
      // Projekte, die vor diesem Monat schon beendet wurden: nur noch anzeigen, wenn es für
      // genau diesen Monat bereits einen IST-Eintrag gibt (z.B. ein paar Reststunden kurz nach
      // Vertragsende). So verschwinden alte, bereits erfasste Werte nicht, aber ein beendeter
      // Contractor taucht nicht dauerhaft in jedem künftigen Monat als leere Zeile auf.
      const pe = parseDateUTC(p.end_date);
      if (pe !== null && pe < monthStart) {
        if (kind !== 'ist') return false;
        return entries.some(e => e.project_id === p.id && e.month === monthVal);
      }
      return true;
    })
    .map(p => {
      const active = isActiveInMonth(p, monthVal);
      // IST-Stunden sollen auch nachträglich für bereits beendete Contractor eintragbar sein
      // (echte geleistete Stunden können außerhalb des geplanten Projektfensters liegen).
      // Nur bei SOLL bleibt die Sperre, da SOLL automatisch aus der Projektlaufzeit berechnet wird.
      const editable = active || kind === 'ist';
      const entry = entries.find(e => e.project_id === p.id && e.month === monthVal);
      const stunden = entry ? entry.stunden : '';
      const c = computeEntry({ project_id: p.id, stunden: entry ? entry.stunden : 0 });
      const badge = kind === 'soll' && entry ? `<span class="mini-badge ${entry.auto ? 'auto' : 'manuell'}">${entry.auto ? 'auto' : 'manuell'}</span>` : '';
      return { p, editable, entry, stunden, c, badge, status: computedStatus(p), isPerm: p.projekttyp === 'perm' };
    });
}

// Durchsuchbarer Text pro Zeile – analog zur Projekte-Suche, inkl. der für diesen Monat
// berechneten Stunden/Umsatz/Kosten/Rohertrag, damit man z.B. auch nach Beträgen suchen kann.
function entryRowSearchText(row) {
  return [
    row.isPerm ? 'Perm' : 'Contract',
    row.p.kunde, row.p.contractor,
    fmtEUR(row.p.pay_h), fmtEUR(row.p.charge_h),
    row.stunden !== '' ? fmtNum(row.stunden, 1) : '',
    fmtEUR(row.c.umsatz), fmtEUR(row.c.kosten), fmtEUR(row.c.rohertrag),
    row.status,
  ].join(' ').toLowerCase();
}

function filteredEntryRows(kind, monthVal) {
  let rows = entryRows(kind, monthVal);
  const filterKunde = entryFilterKunde[kind];
  const filterArt = entryFilterArt[kind];
  const filterStatus = entryFilterStatus[kind];
  const search = entrySearch[kind];
  if (filterKunde !== 'all') rows = rows.filter(r => r.p.kunde === filterKunde);
  if (filterArt !== 'all') rows = rows.filter(r => (r.isPerm ? 'perm' : 'contract') === filterArt);
  if (filterStatus !== 'all') rows = rows.filter(r => r.status === filterStatus);
  if (search.trim()) {
    const q = search.trim().toLowerCase();
    rows = rows.filter(r => entryRowSearchText(r).includes(q));
  }
  return rows;
}

      <select id="entryFilterArtSel_${kind}">

        <tbody>
          ${rows.map(({ p, editable, stunden, c, badge }) => `

          </tr>

async function setEntry(kind, projectId, monthVal, stunden) {
  const existing = data.entries.find(e => e.project_id === projectId && e.kind === kind && e.month === monthVal);
  if (stunden === '' || stunden === null || isNaN(stunden)) {
    if (existing) await sb.from('entries').delete().eq('id', existing.id);
    if (kind === 'soll') {
      const proj = project(projectId);
      if (proj) { await syncAutoSoll(proj); return; }
    }
  } else if (existing) {
    const patch = { stunden };
    if (kind === 'soll') patch.auto = false; // manuelle Änderung überschreibt die Automatik
    await sb.from('entries').update(patch).eq('id', existing.id);
  } else {
    const payload = { project_id: projectId, kind, month: monthVal, stunden };
    if (kind === 'soll') payload.auto = false;
    await sb.from('entries').insert(payload);
  }
  await loadAll();
}

// ---------- KI-VORSCHLÄGE (aus Weclapp-Rechnungen) ----------

// Zeigt von der KI aus Weclapp-Eingangsrechnungen vorgeschlagene IST-Einträge (Contractor, Monat,
// Stunden) zur Prüfung an. Erst nach "Übernehmen" wird daraus ein echter IST-Eintrag – die KI
// schreibt nie direkt in die entries-Tabelle. Kommt aus einer separaten Supabase Edge Function
// (siehe edge-functions/weclapp-sync und WECLAPP_KI_SETUP.md), die diese Tabelle befüllt.

// Direktlink zur Original-Rechnung in Weclapp, damit man beim Prüfen eines Vorschlags die
// tatsächliche Rechnung danebenlegen kann. source_ref ist die Weclapp-purchaseInvoice-ID.
function weclappInvoiceUrl(v) {
  if (v.source !== 'weclapp' || !v.source_ref) return null;
  return `${WECLAPP_WEB_URL}/app/purchase-invoice/${v.source_ref}`;
}

      <div class="table-scroll">

async function approveKiVorschlag(id) {
  const projSel = document.querySelector(`[data-vid="${id}"][data-field="project"]`);
  const monthInp = document.querySelector(`[data-vid="${id}"][data-field="month"]`);
  const stundenInp = document.querySelector(`[data-vid="${id}"][data-field="stunden"]`);
  const projectId = projSel ? projSel.value : '';
  const monthVal = monthInp ? monthInp.value : '';
  const stunden = stundenInp && stundenInp.value !== '' ? Number(stundenInp.value) : NaN;
  if (!projectId || !monthVal || isNaN(stunden)) {
    alert('Bitte Projekt, Monat und Stunden ausfüllen, bevor du übernimmst.');
    return;
  }
  await setEntry('ist', projectId, monthVal, stunden);
  await sb.from('ki_vorschlaege').update({ status: 'approved', project_id: projectId, month: monthVal, stunden, reviewed_at: new Date().toISOString() }).eq('id', id);
  await loadAll();
}

async function rejectKiVorschlag(id) {
  await sb.from('ki_vorschlaege').update({ status: 'rejected', reviewed_at: new Date().toISOString() }).eq('id', id);
  await loadAll();
}

async function resetKiVorschlag(id) {
  await sb.from('ki_vorschlaege').update({ status: 'pending', reviewed_at: null }).eq('id', id);
  await loadAll();
}

    const c = contractor(b.dataset.copyInvite);
    if (!c || !c.email) return;
    const link = location.origin + location.pathname + '?invite=' + encodeURIComponent(c.email);
    try {
      await navigator.clipboard.writeText(link);
      const old = b.textContent; b.textContent = 'Kopiert!'; setTimeout(() => { b.textContent = old; }, 1500);
    } catch (e) {
      prompt('Link kopieren (Strg/Cmd+C):', link);
    }
  }));
  const tsFilterStatusSel = document.getElementById('tsFilterStatusSel');
  if (tsFilterStatusSel) tsFilterStatusSel.addEventListener('change', () => { tsFilterStatus = tsFilterStatusSel.value; render(); });
  document.querySelectorAll('[data-approve-ts]').forEach(b => b.addEventListener('click', () => approveTimesheetAdmin(b.dataset.approveTs)));
  document.querySelectorAll('[data-reject-ts]').forEach(b => b.addEventListener('click', () => rejectTimesheetAdmin(b.dataset.rejectTs)));
  const addCandidateBtn = document.getElementById('addCandidateBtn');
  if (addCandidateBtn) addCandidateBtn.addEventListener('click', () => openCandidateModal(null));
  document.querySelectorAll('[data-edit-candidate]').forEach(b => b.addEventListener('click', () => openCandidateModal(b.dataset.editCandidate)));
  document.querySelectorAll('[data-del-candidate]').forEach(b => b.addEventListener('click', () => deleteCandidate(b.dataset.delCandidate)));
  const addKundeBtn = document.getElementById('addKundeBtn');
  if (addKundeBtn) addKundeBtn.addEventListener('click', () => openKundeModal(null));
  document.querySelectorAll('[data-edit-kunde]').forEach(b => b.addEventListener('click', () => openKundeModal(b.dataset.editKunde)));
  document.querySelectorAll('[data-del-kunde]').forEach(b => b.addEventListener('click', () => deleteKunde(b.dataset.delKunde)));
  const reportKundeSel = document.getElementById('reportKundeSel');
  if (reportKundeSel) reportKundeSel.addEventListener('change', () => { reportKundeId = reportKundeSel.value; render(); });
  const reportMonthPicker = document.getElementById('reportMonthPicker');
  if (reportMonthPicker) reportMonthPicker.addEventListener('change', () => { reportMonth = reportMonthPicker.value; render(); });
  const generateKundenReportBtn = document.getElementById('generateKundenReportBtn');
  if (generateKundenReportBtn) generateKundenReportBtn.addEventListener('click', () => generateKundenReport());
}

// ---------- CONTRACTOR-PORTAL (externe Freelancer, siehe migration_contractor_timesheets.sql) ----------
// Läuft komplett getrennt von der internen App oben - ausschließlich über die dort angelegten
// SECURITY DEFINER-Funktionen (sb.rpc(...)), nie über direkten Tabellenzugriff, damit ein
// Contractor rein technisch gar nicht an andere Daten kommen kann.

// Prüft, ob die eingeloggte E-Mail zu einem Contractor gehört (kein interner Zugriff nötig).
async function initContractorAccess() {
  const { data: rows, error } = await sb.rpc('my_contractor_profile');
  if (error) { console.error('Contractor-Profil konnte nicht geladen werden (migration_contractor_timesheets.sql ausgeführt?)', error); return false; }
  if (!rows || !rows.length) return false;
  contractorProfile = rows[0];
  return true;
}

async function loadContractorPortal() {
  const { data: projects, error } = await sb.rpc('my_timesheet_projects');
  if (error) console.error('Projekte des Contractors konnten nicht geladen werden', error);
  contractorProjects = projects || [];
  if (!contractorProjects.find(p => p.project_id === contractorProjectId)) {
    contractorProjectId = contractorProjects.length ? contractorProjects[0].project_id : null;
  }
  await loadContractorTimesheet();
}

async function loadContractorTimesheet() {
  if (!contractorProjectId) { contractorTimesheet = null; contractorDays = []; renderContractorPortal(); return; }
  const { data: tsRows, error } = await sb.rpc('my_timesheet', { p_project_id: contractorProjectId, p_month: contractorMonth });
  if (error) { console.error('Timesheet konnte nicht geladen werden', error); contractorTimesheet = null; contractorDays = []; renderContractorPortal(); return; }
  contractorTimesheet = (tsRows && tsRows[0]) || null;
  if (!contractorTimesheet) { contractorDays = []; renderContractorPortal(); return; }
  const { data: dayRows, error: dayErr } = await sb.rpc('my_timesheet_days', { p_timesheet_id: contractorTimesheet.timesheet_id });
  if (dayErr) console.error('Tageswerte konnten nicht geladen werden', dayErr);
  contractorDays = dayRows || [];
  renderContractorPortal();
}

function renderContractorPortal() {
  document.body.dataset.org = contractorProfile ? contractorProfile.org : '';
  const app = document.getElementById('app');
  const status = contractorTimesheet ? contractorTimesheet.status : 'draft';
  const locked = status === 'submitted' || status === 'approved';
  const days = daysOfMonth(contractorMonth);
  const dayMap = new Map(contractorDays.map(d => [d.day, d.stunden]));
  const total = contractorDays.reduce((s, d) => s + (Number(d.stunden) || 0), 0);

  app.innerHTML = `
    <header class="top">
      <div class="brand-row">
        ${contractorProfile && contractorProfile.org === 'peax'
          ? `<div class="peax-wordmark">peax<span class="tag">A Konzepthaus Brand</span></div>`
          : `<div class="kh-wordmark">KONZEPT<br>HAUS</div>`}
        <div>
          <h1>Mein Timesheet</h1>
          <div class="sub">${contractorProfile ? contractorProfile.name : ''} – ${session.user.email}</div>
        </div>
      </div>
      <div class="userbar"><button class="btn" id="logoutBtn">Abmelden</button></div>
    </header>
    <div class="card panel" style="max-width:640px;">
      ${!contractorProjects.length ? '<div class="empty">Für dich ist noch kein Projekt hinterlegt. Bitte bei Rike melden.</div>' : `
      <div class="toolbar-filters" style="margin-bottom:16px;">
        <label style="font-size:12.5px;color:var(--muted);font-weight:600;">Projekt / Kunde:</label>
        <select id="tsProjectSel">
          ${contractorProjects.map(p => `<option value="${p.project_id}" ${p.project_id === contractorProjectId ? 'selected' : ''}>${p.projektname ? p.kunde + ' – ' + p.projektname : p.kunde}</option>`).join('')}
        </select>
        <label style="font-size:12.5px;color:var(--muted);font-weight:600;">Monat:</label>
        <input type="month" id="tsMonthInput" value="${contractorMonth}">
      </div>
      <div style="margin-bottom:14px;">
        <span class="mini-badge ${status === 'approved' ? 'auto' : (status === 'rejected' ? '' : 'manuell')}" style="font-size:11px;">${TS_STATUS_LABEL[status]}</span>
        ${status === 'rejected' && contractorTimesheet.review_note ? `<div class="banner error" style="margin-top:10px;">Grund der Ablehnung: ${contractorTimesheet.review_note}</div>` : ''}
        ${locked ? `<div class="empty" style="text-align:left;padding:6px 0;">${status === 'approved' ? 'Freigegeben – keine Änderung mehr möglich.' : 'Eingereicht – wird geprüft, solange keine Änderung möglich.'}</div>` : ''}
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Tag</th><th>Wochentag</th><th>Stunden</th></tr></thead>
          <tbody>
            ${days.map(d => `<tr>
              <td>${fmtDate(d.date)}</td><td>${d.weekday}</td>
              <td><input class="num-cell" type="number" min="0" step="0.5" data-day="${d.date}" value="${dayMap.has(d.date) ? dayMap.get(d.date) : ''}" ${locked ? 'disabled' : ''}></td>
            </tr>`).join('')}
          </tbody>
          <tfoot><tr style="font-weight:700;"><td colspan="2">Summe</td><td>${fmtNum(total, 1)}</td></tr></tfoot>
        </table>
      </div>
      <div class="modal-actions" style="justify-content:flex-start;margin-top:16px;">
        <button class="btn primary" id="tsSubmitBtn" ${locked || !total ? 'disabled' : ''}>Timesheet einreichen</button>
      </div>
      `}
    </div>
    <footer class="hint">Deine Eingaben werden automatisch gespeichert. Nach dem Einreichen prüft das Team deine Stunden und gibt sie frei.</footer>
  `;
  document.getElementById('logoutBtn').addEventListener('click', handleLogout);
  const projectSel = document.getElementById('tsProjectSel');
  if (projectSel) projectSel.addEventListener('change', () => { contractorProjectId = projectSel.value; loadContractorTimesheet(); });
  const monthInput = document.getElementById('tsMonthInput');
  if (monthInput) monthInput.addEventListener('change', () => { contractorMonth = monthInput.value; loadContractorTimesheet(); });
  app.querySelectorAll('input[data-day]').forEach(inp => {
    inp.addEventListener('change', async () => {
      const val = inp.value === '' ? 0 : Number(inp.value);
      const { error } = await sb.rpc('set_timesheet_day', { p_timesheet_id: contractorTimesheet.timesheet_id, p_day: inp.dataset.day, p_stunden: val });
      if (error) { alert(error.message); }
      await loadContractorTimesheet();
    });
  });
  const submitBtn = document.getElementById('tsSubmitBtn');
  if (submitBtn) submitBtn.addEventListener('click', async () => {
    const { error } = await sb.rpc('submit_timesheet', { p_timesheet_id: contractorTimesheet.timesheet_id });
    if (error) { alert(error.message); return; }
    await loadContractorTimesheet();
  });
}

function subscribeContractorRealtime() {
  if (realtimeChannel) return;
  realtimeChannel = sb.channel('public:contractor-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'timesheets' }, () => loadContractorTimesheet())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'timesheet_days' }, () => loadContractorTimesheet())
    .subscribe();
}

// ---------- BOOTSTRAP ----------

async function startApp() {
  document.getElementById('app').innerHTML = '<div class="empty">Lade…</div>';
  await initOrgAccess();
  if (!allowedOrgs.length) {
    const isContractor = await initContractorAccess();
    if (isContractor) { subscribeContractorRealtime(); await loadContractorPortal(); return; }
    renderNoAccess();
    return;
  }
  subscribeRealtime();
  await loadAll();
}

sb.auth.onAuthStateChange((event, newSession) => {
  session = newSession;
  if (session) {
    renderAuth(); // clears any stale auth screen instantly, then app takes over
    startApp();
  } else {
    if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
    allowedOrgs = []; activeOrg = null;
    contractorProfile = null; contractorProjects = []; contractorProjectId = null; contractorTimesheet = null; contractorDays = [];
    renderAuth();
  }
});

sb.auth.getSession().then(({ data: { session: s } }) => {
  session = s;
  if (session) startApp();
  else renderAuth();
});
</script>
